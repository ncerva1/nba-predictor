<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Bebas+Neue&family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500;600&display=swap">
<script>
// Tema claro/oscuro: se aplica antes de pintar para que no parpadee. Sin preferencia guardada sigue al sistema.
try { const t = localStorage.getItem("nbap-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<style>
/* Layout: banner con el título y las pestañas (Liga regular / NBA Cup), barra de partidos en movimiento
   (clic → análisis), y debajo la página activa: inicio de la pestaña o el panel de un partido (#id).
   Paleta: azul y rojo NBA en la liga regular; negro, oro y plata en la NBA Cup (data-mode="cup"). */
:root {
  --bg: #f2f4f8; --surface: #ffffff; --ink: #0b1630; --muted: #586379; --line: #dce1ea;
  --accent: #1d428a; --accent-soft: #e2e9f6; --hot: #c8102e; --on-accent: #ffffff;
  --banner: #0b1a3a; --banner-2: #1d428a; --banner-ink: #f4f6fb; --banner-muted: #aab6d3; --ticker: #08122a; --stripe: #c8102e;
  --good: #0a7d4b; --good-soft: #dcf2e6; --bad: #b3122b; --bad-soft: #f9e1e4;
  --display: "Oswald", "Arial Narrow", system-ui, sans-serif;
  --body: "Roboto", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Roboto Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #060b17; --surface: #0e1628; --ink: #eef2f9; --muted: #93a0b8; --line: #1e2a42;
  --accent: #6f9bff; --accent-soft: #152449; --hot: #ff4d5e; --on-accent: #060b17;
  --banner: #050a18; --banner-2: #12285a; --banner-ink: #f4f6fb; --banner-muted: #93a1c4; --ticker: #03070f; --stripe: #e0213f;
  --good: #47d08f; --good-soft: #10301f; --bad: #ff7b86; --bad-soft: #3a141b; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #060b17; --surface: #0e1628; --ink: #eef2f9; --muted: #93a0b8; --line: #1e2a42;
  --accent: #6f9bff; --accent-soft: #152449; --hot: #ff4d5e; --on-accent: #060b17;
  --banner: #050a18; --banner-2: #12285a; --banner-ink: #f4f6fb; --banner-muted: #93a1c4; --ticker: #03070f; --stripe: #e0213f;
  --good: #47d08f; --good-soft: #10301f; --bad: #ff7b86; --bad-soft: #3a141b; color-scheme: dark }
/* NBA Cup: tablero negro, oro del trofeo y plata */
:root[data-mode="cup"] {
  --bg: #f5f2ea; --surface: #fffdf8; --ink: #17140c; --muted: #6b6250; --line: #e4dcc8;
  --accent: #8a6412; --accent-soft: #f3e8cc; --hot: #b8892b; --on-accent: #ffffff;
  --banner: #0d0c0a; --banner-2: #2a2316; --banner-ink: #faf6ec; --banner-muted: #c9bc9c; --ticker: #070605; --stripe: #d4a537;
  --display: "Bebas Neue", "Oswald", "Arial Narrow", sans-serif;
}
@media (prefers-color-scheme: dark) { :root[data-mode="cup"]:not([data-theme="light"]) {
  --bg: #0a0907; --surface: #15130e; --ink: #f6f1e4; --muted: #a99f88; --line: #2c271c;
  --accent: #e2b75a; --accent-soft: #2d2412; --hot: #f0c66b; --on-accent: #0a0907;
  --banner: #000000; --banner-2: #241d10; --ticker: #000000; --stripe: #e2b75a } }
:root[data-mode="cup"][data-theme="dark"] {
  --bg: #0a0907; --surface: #15130e; --ink: #f6f1e4; --muted: #a99f88; --line: #2c271c;
  --accent: #e2b75a; --accent-soft: #2d2412; --hot: #f0c66b; --on-accent: #0a0907;
  --banner: #000000; --banner-2: #241d10; --ticker: #000000; --stripe: #e2b75a }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body); margin: 0 }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.inner { max-width: 1080px; margin: 0 auto }
h1, h2, h3 { font-family: var(--display); font-weight: 700; letter-spacing: .01em; margin: 0; text-wrap: balance; line-height: 1.05 }
h1 { font-size: clamp(34px, 6vw, 52px); text-transform: uppercase }
h2 { font-size: 28px; text-transform: uppercase }
h3 { font-size: 20px }
.eyebrow { font: 500 12px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted) }
.muted { color: var(--muted) }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums }
a { color: var(--accent) }

/* banner */
.banner { background: linear-gradient(115deg, var(--banner) 0%, var(--banner) 55%, var(--banner-2) 100%); color: var(--banner-ink); position: relative }
.banner::after { content: ""; position: absolute; inset: auto 0 0 0; height: 4px; background: linear-gradient(90deg, var(--stripe) 0 62%, var(--banner-ink) 62% 64%, var(--accent) 64%) }
:root[data-mode="cup"] .banner::after { background: linear-gradient(90deg, #7a5a14, var(--stripe) 30%, #f6e2a6 55%, var(--stripe) 75%, #7a5a14) }
.banner .inner { padding-block: 22px 0; display: flex; flex-wrap: wrap; gap: 10px 24px; align-items: center; justify-content: space-between }
.banner a.brand { color: inherit; text-decoration: none; display: flex; align-items: center; gap: 14px }
.banner .logo { flex: none; width: 52px; height: 52px; border-radius: 12px; display: grid; place-items: center; background: var(--stripe); box-shadow: inset 0 -3px 0 rgba(0,0,0,.25) }
:root[data-mode="cup"] .banner .logo { background: linear-gradient(150deg, #f6e2a6, var(--stripe) 45%, #7a5a14) }
.banner .logo svg { width: 34px; height: 34px }
.banner .brand-t { display: grid; gap: 2px }
.banner .brand-t > span { font: 500 11px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--banner-muted) }
.banner h1 { font-size: clamp(34px, 6vw, 52px); letter-spacing: .02em }
.banner .side { display: flex; align-items: center; gap: 14px; margin-left: auto }
.banner .meta { font: 500 12px var(--mono); color: var(--banner-muted); letter-spacing: .04em; text-align: right }
.theme-btn { flex: none; width: 40px; height: 40px; border-radius: 999px; border: 1px solid rgba(255,255,255,.25); background: rgba(255,255,255,.08);
  color: var(--banner-ink); display: grid; place-items: center; cursor: pointer; transition: background .15s, border-color .15s }
.theme-btn:hover, .theme-btn:focus-visible { background: rgba(255,255,255,.18); border-color: var(--banner-ink); outline: none }
.theme-btn svg { width: 20px; height: 20px }
.theme-btn .moon { display: none }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .theme-btn .moon { display: block } :root:not([data-theme="light"]) .theme-btn .sun { display: none } }
:root[data-theme="dark"] .theme-btn .moon { display: block } :root[data-theme="dark"] .theme-btn .sun { display: none }
/* pestañas: liga regular / NBA Cup */
.tabs { flex-basis: 100%; display: flex; gap: 4px; margin-top: 6px }
.tab { display: flex; align-items: center; gap: 8px; padding: 10px 16px 12px; color: var(--banner-muted); text-decoration: none;
  font: 600 15px/1 var(--display); letter-spacing: .08em; text-transform: uppercase; border-radius: 8px 8px 0 0; position: relative; transition: color .15s, background .15s }
.tab:hover, .tab:focus-visible { color: var(--banner-ink); background: rgba(255,255,255,.06); outline: none }
.tab[aria-current="page"] { color: var(--banner-ink); background: rgba(255,255,255,.1) }
.tab[aria-current="page"]::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: 4px; height: 3px; border-radius: 2px; background: var(--banner-ink) }
.tab.cup-tab { font-family: "Bebas Neue", var(--display); font-size: 19px; font-weight: 400; letter-spacing: .1em }
.tab.cup-tab svg { width: 16px; height: 16px; color: #e2b75a }
.tab.cup-tab[aria-current="page"]::after { background: linear-gradient(90deg, #a77a1c, #f6e2a6, #a77a1c) }
.tab .n:empty { display: none }
.tab .n { font: 600 11px var(--mono); letter-spacing: 0; background: rgba(255,255,255,.14); padding: 2px 6px; border-radius: 999px }
/* colores de cada equipo (TEAM en el script): insignia con la abreviatura y barras de probabilidad */
.tm { display: inline-flex; align-items: center; gap: 8px }
.tm i { width: 10px; height: 10px; border-radius: 3px; background: var(--tc); box-shadow: 0 0 0 1px rgba(128,128,128,.35); flex: none }
.badge { display: inline-grid; place-items: center; min-width: 2.6em; padding: .18em .4em .1em; border-radius: 6px; background: var(--tc); color: var(--tf);
  font: 700 1em/1 var(--display); letter-spacing: .04em; box-shadow: inset 0 -2px 0 rgba(0,0,0,.2), 0 0 0 1px rgba(128,128,128,.25) }
:root[data-mode="cup"] h1, :root[data-mode="cup"] h2, :root[data-mode="cup"] h3 { font-weight: 400; letter-spacing: .03em }
/* barra de partidos */
/* Se mueve sola con JS (scrollLeft), así que también se puede arrastrar, deslizar con el dedo o
   mover con las flechas; se pausa al pasar el ratón o al tocarla y sigue a los pocos segundos. */
.ticker { background: var(--ticker); border-top: 1px solid rgba(255,255,255,.08); position: relative; display: flex; align-items: stretch }
.ticker-scroll { flex: 1; min-width: 0; overflow-x: auto; scrollbar-width: none; cursor: grab; user-select: none; -webkit-user-select: none }
.ticker-scroll::-webkit-scrollbar { display: none }
.ticker-scroll.dragging { cursor: grabbing }
.ticker-track { display: flex; gap: 10px; width: max-content; padding-block: 10px; align-items: stretch }
.tk-btn { flex: none; width: 34px; border: 0; background: var(--ticker); color: var(--banner-ink); font: 700 22px/1 var(--display); cursor: pointer; position: relative; z-index: 1 }
.tk-btn:hover, .tk-btn:focus-visible { background: rgba(255,255,255,.1); outline: none }
.tk-btn.prev { box-shadow: 8px 0 10px -6px rgba(0,0,0,.5) } .tk-btn.next { box-shadow: -8px 0 10px -6px rgba(0,0,0,.5) }
.tk-label { display: grid; place-items: center; writing-mode: vertical-rl; transform: rotate(180deg); font: 600 10px var(--mono); letter-spacing: .1em;
  text-transform: uppercase; color: var(--banner-muted); padding: 0 2px; border-left: 1px solid rgba(255,255,255,.15) }
.chip.done { background: rgba(255,255,255,.03) }
.chip .ok { color: #7fe3b0 } .chip .ko { color: #ffaaa3 }
.chip { display: grid; grid-template-columns: auto auto; gap: 0 14px; align-items: center; text-decoration: none; color: var(--banner-ink);
  background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12); border-radius: 8px; padding: 7px 12px; min-width: 190px; transition: background .15s, border-color .15s }
.chip:hover, .chip:focus-visible { background: rgba(255,255,255,.14); border-color: var(--banner-ink); outline: none }
.chip.active { border-color: var(--banner-ink) }
.chip .t { font: 700 19px/1.15 var(--display); letter-spacing: .03em }
.chip .s { font: 500 13px/1.3 var(--mono); text-align: right }
.chip .x { font: 500 11px var(--mono); color: var(--banner-muted); grid-column: 1 / -1 }
.chip .v { color: #7fe3b0 }
.chip { border-left: 3px solid var(--ca, rgba(255,255,255,.12)) }
.chip.cup { border-color: rgba(226,183,90,.45); border-left-color: #e2b75a; background: rgba(226,183,90,.08) }
/* hoy resalta (fondo más claro, etiqueta HOY); ayer queda atenuado */
.chip.past { opacity: .62 } .chip.past:hover, .chip.past:focus-visible, .chip.past.active { opacity: 1 }
.chip.today { background: rgba(255,255,255,.13); border-color: rgba(255,255,255,.38) }
.chip.today.cup { background: rgba(226,183,90,.16); border-color: rgba(226,183,90,.7) }
.chip .hoy { display: inline-block; background: var(--stripe); color: #fff; font: 700 10px/1.5 var(--mono); letter-spacing: .08em; padding: 0 5px; border-radius: 3px; margin-right: 6px; vertical-align: 1px }
.tk-label.today { background: var(--stripe); color: #fff; font-weight: 700; border-left: 0; border-radius: 4px; padding: 0 4px }
.chip .cupk { color: #e2b75a; font-weight: 600 }

main.wrap { padding-block: 28px 64px }
main .inner { display: grid; gap: 30px }
.section > h2, .section > header > h2 { display: flex; align-items: center; gap: 10px }
.rot-wrap{display:grid;gap:20px}
.rot{width:100%;table-layout:fixed}
.rot th:nth-child(1),.rot td:nth-child(1){width:38%}
.rot th:nth-child(2),.rot td:nth-child(2){width:17%}
.rot th:nth-child(3),.rot td:nth-child(3){width:9%}
.rot td{vertical-align:middle}
.rot-q{display:flex;justify-content:space-around;font-size:.75rem}
.rotbar{width:100%;height:16px;display:block}
.rb-bg{fill:var(--line)} .rb-q{stroke:var(--surface);stroke-width:2}
.rb-titular{fill:var(--accent)} .rb-rotacion{fill:var(--good)} .rb-rol{fill:var(--muted)} .rb-reserva{fill:var(--hot);opacity:.55}
.rtag{display:inline-block;font-size:.72rem;padding:2px 6px;border-radius:999px;white-space:nowrap}
.rt-titular{background:var(--accent-soft);color:var(--accent)} .rt-rotacion{background:var(--good-soft);color:var(--good)}
.rt-rol{background:var(--line);color:var(--ink)} .rt-reserva{background:var(--bad-soft);color:var(--bad)}
.rot-note{margin:4px 0 8px}
@media (max-width:640px){
  .rot thead{display:none}
  .rot,.rot tbody{display:block}
  .rot tr{display:grid;grid-template-columns:1fr auto auto;gap:4px 10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
  .rot td{display:block;width:auto !important;padding:0;border:0;font-size:.88rem}
  .rot td.rot-tl{grid-column:1/-1}
  .rot-wrap h3::after{content:"  1.º · 2.º · 3.º · 4.º cuarto";font:400 .72rem var(--body);color:var(--muted)}
}
.mp-h{margin:18px 0 4px;font-size:1rem}
.mp-wrap tr[hidden],.mp-wrap p[hidden]{display:none!important}
.calc{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;align-items:end}
.calc label{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted, inherit)}
.calc select,.calc input{font:inherit;padding:6px 8px;border-radius:8px;border:1px solid var(--line, #8884);background:var(--bg, transparent);color:inherit;min-width:0}
.calc-out{grid-column:1/-1;display:flex;flex-direction:column;gap:4px}
.fold-btn { margin-left: auto; flex: none; font: 500 11px var(--mono); letter-spacing: .04em; text-transform: none; padding: 4px 10px;
  border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); cursor: pointer }
.fold-btn:hover { color: var(--ink); border-color: var(--accent) }
.panel.section > h3 { display: flex; align-items: center; gap: 8px }
.section.folded > :not(h2):not(h3):not(.eyebrow) { display: none !important }
.section > h2::before { content: ""; flex: none; width: 6px; height: .82em; border-radius: 2px; background: var(--hot); transform: skewX(-12deg) }
.vs { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px }
.vs .badge { font-size: .9em; min-width: 2.9em }
.vs .at { color: var(--muted); font-size: .6em }
.section { display: grid; gap: 12px }
.section > p { margin: 0 }
.lede { max-width: 70ch; color: var(--muted) }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px; min-width: 0 }
.tbl-wrap { overflow-x: auto; min-width: 0 }
table { border-collapse: collapse; width: 100%; font-size: 14px }
th { text-align: left; font: 500 11px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted);
  padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap }
td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: middle }
tr:last-child td { border-bottom: 0 }
td.r, th.r { text-align: right }
tr.link { cursor: pointer }
tr.link:hover td { background: var(--accent-soft) }
.pill { display: inline-block; font: 600 11px var(--mono); letter-spacing: .04em; padding: 2px 8px; border-radius: 999px; white-space: nowrap }
.pill.value { background: var(--good-soft); color: var(--good) }
.wo-d { font: 600 11px var(--mono); margin-left: 4px; padding: 1px 5px; border-radius: 4px; background: var(--line); color: var(--muted) }
.wo-d.up { background: var(--good-soft); color: var(--good) } .wo-d.dn { background: var(--bad-soft); color: var(--bad) }
.wo-c { white-space: nowrap } .wo-who { font-size: 13px } .wo-who .tag { font: 500 10px var(--mono); margin-left: 4px; color: var(--bad) }
.wo-note { margin: 8px 0 12px; font-size: 14px } .wo-real h3 { margin: 18px 0 6px; font-size: 15px }
.pill.neg { background: var(--bad-soft); color: var(--bad) }
.pill.flat { background: var(--accent-soft); color: var(--accent) }
.kind { font: 500 11px var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .05em }
.legend-row { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)) }
.legend-item { display: grid; gap: 4px; font-size: 13px; color: var(--muted) }
.legend-item .pill { justify-self: start }
details.howto { font-size: 14px; color: var(--muted) }
details.howto summary { cursor: pointer; color: var(--accent); font-weight: 500 }
details.howto dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; margin: 10px 0 0; max-width: 80ch }
details.howto dt { font-weight: 600; color: var(--ink) }
details.howto dd { margin: 0 }
.games { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)) }
.card { display: grid; gap: 12px; text-decoration: none; color: inherit; background: var(--surface); position: relative; overflow: hidden;
  border: 1px solid var(--line); border-radius: 10px; padding: 19px 16px 16px; transition: border-color .15s, transform .15s, box-shadow .15s }
.card::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 4px; background: linear-gradient(90deg, var(--ca, var(--accent)) 50%, var(--ch, var(--hot)) 50%) }
.card:hover { transform: translateY(-2px); box-shadow: 0 8px 22px -12px rgba(0,0,0,.35) }
.card:hover, .card:focus-visible { border-color: var(--accent); outline: none }
.matchup { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: baseline }
.team { font: 700 24px/1 var(--display); letter-spacing: .02em; display: flex; align-items: center; gap: 8px; flex-wrap: wrap }
.team .badge { font-size: 20px }
.score { font: 500 18px var(--mono) }
.bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; display: flex }
.bar i { background: var(--accent); display: block }

.mini { display: grid; gap: 4px; font-size: 13px }
.mini div { display: flex; justify-content: space-between; gap: 8px }
.cta { font: 500 13px var(--mono); color: var(--accent) }
.back { font: 500 13px var(--mono); text-decoration: none }
.hero { display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)) }
.stat { display: grid; gap: 2px }
.stat b { font: 700 34px/1 var(--display) }
.notes { margin: 0; padding-left: 18px; color: var(--muted); display: grid; gap: 4px; max-width: 80ch }
.grid2 { display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)) }
.chart text { fill: var(--muted); font: 11px var(--mono) }
.filters { display: flex; flex-wrap: wrap; gap: 8px }
.filters + .filters { margin-top: -4px }
.filters .lbl { font: 500 11px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); align-self: center; min-width: 74px }
.filters button { font: 500 12px var(--mono); padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink); cursor: pointer }
.filters button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--surface) }
.filters button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
th.sort { cursor: pointer; user-select: none }
th.sort:hover { color: var(--ink) }
th.sort[aria-sort]::after { content: " ▼"; font-size: 9px }

.sortsel { font: 500 12px var(--mono); padding: 6px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink) }
.seeall { justify-self: start; font: 600 13px var(--mono); text-decoration: none; padding: 9px 16px; border-radius: 999px; border: 1px solid var(--accent); color: var(--accent) }
.seeall:hover { background: var(--accent); color: var(--surface) }
.search { font: 14px var(--sans, inherit); padding: 8px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); width: min(100%, 320px) }
.more { display: block; margin-top: 4px; font: 500 11px var(--mono); color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline }
tr.detail td { background: var(--bg) }
.books { display: flex; flex-wrap: wrap; gap: 6px }
.book { font: 12px var(--mono); border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 3px 8px; white-space: nowrap }
.book i { font-style: normal; color: var(--muted) }
.book.good i { color: var(--good) } .book.bad i { color: var(--bad) }
.co { font: 600 9px var(--mono); letter-spacing: .04em; color: #fff; background: #1a4fa0; border-radius: 3px; padding: 1px 3px; margin-left: 4px; vertical-align: 1px }
.bestco { margin-top: 3px }
.res { font: 600 11px var(--mono); letter-spacing: .04em; padding: 2px 8px; border-radius: 999px; white-space: nowrap }
.res.won { background: var(--good-soft); color: var(--good) }
.res.lost { background: var(--bad-soft); color: var(--bad) }
.res.push { background: var(--accent-soft); color: var(--accent) }
.final { font: 500 13px var(--mono) }
.empty { padding: 24px; text-align: center; color: var(--muted) }
.foot { font-size: 13px; color: var(--muted); max-width: 80ch; margin: 0 }
.h2h-games { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)) }
.h2h-g { display: grid; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px }
.h2h-g .sc { display: grid; grid-template-columns: 1fr auto; font: 600 17px/1.3 var(--mono) }
.h2h-g .sc .w { color: var(--ink) } .h2h-g .sc .l { color: var(--muted); font-weight: 500 }
.h2h-g .ld { font-size: 12px; color: var(--muted) }
.h2h-cell .vals { display: block; font: 11px var(--mono); color: var(--muted) }
/* enfrentamiento según los rankings: todo se colorea desde el punto de vista del equipo que ataca */
.mv-block { display: grid; gap: 10px }
.mv-block + .mv-block { margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--line) }
.mv-block h3 small { font: 500 12px var(--body); color: var(--muted); letter-spacing: 0 }
.mv-rows { display: grid; gap: 8px }
.dvp-row { display: grid; grid-template-columns: minmax(130px, 1.3fr) repeat(4, minmax(0, 1fr)); gap: 6px; align-items: stretch }
.dvp-pos { display: grid; align-content: center; gap: 2px; min-width: 0 }
.dvp-pos b { font: 700 22px/1 var(--display) }
.dvp-pos span { font-size: 12px; color: var(--muted); line-height: 1.3 }
.cell { border-radius: 8px; padding: 6px 8px; background: var(--bg); display: grid; gap: 1px; min-width: 0 }
.cell .k { font: 500 10px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted) }
.cell .v { font: 600 17px/1.15 var(--mono); font-variant-numeric: tabular-nums }
.cell .rk { font: 500 11px var(--mono); color: var(--muted) }
.cell.good { background: var(--good-soft) } .cell.good .rk { color: var(--good) }
.cell.bad { background: var(--bad-soft) } .cell.bad .rk { color: var(--bad) }
.pt-row { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr) minmax(0, 1fr) 120px; gap: 6px 12px; align-items: center;
  padding: 8px 0; border-bottom: 1px solid var(--line) }
.pt-row:last-child { border-bottom: 0 }
.pt-name { display: grid; gap: 4px; min-width: 0 }
.pt-name b { font-weight: 600 }
.pt-freq { display: flex; align-items: center; gap: 8px; font: 12px var(--mono); color: var(--muted) }
.pt-freq .bar { flex: 1; max-width: 140px }
.pt-cell { display: grid; gap: 1px; font-size: 13px }
.pt-cell .k { font: 500 10px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted) }
.pt-row > .pill { justify-self: end }
.pt-cell .num.good { color: var(--good) } .pt-cell .num.bad { color: var(--bad) }
.mv-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--muted) }
.mv-legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 6px }
@media (max-width: 640px) {
  .dvp-row { grid-template-columns: repeat(4, minmax(0, 1fr)); padding-bottom: 8px; border-bottom: 1px solid var(--line) }
  .dvp-row:last-child { border-bottom: 0 }
  .dvp-pos { grid-column: 1 / -1; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap }
  .cell { padding: 5px 6px } .cell .v { font-size: 15px }
  .pt-row { grid-template-columns: 1fr 1fr }
  .pt-name { grid-column: 1 / -1 }
  .pt-row > .pill { grid-column: 1 / -1; justify-self: start }
}
@media (max-width: 640px) {
  .hide-sm { display: none }
  table.stack thead { display: none }
  table.stack, table.stack tbody { display: block }
  table.stack tr { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 16px; padding: 12px 0; border-bottom: 1px solid var(--line) }
  table.stack tr:last-child { border-bottom: 0 }
  table.stack td { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 0; border: 0; text-align: right }
  table.stack td::before { content: attr(data-label); font: 500 10px var(--mono); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); text-align: left }
  table.stack td.num { white-space: nowrap }
  table.stack td.head { grid-column: 1 / -1; display: block; text-align: left; font-weight: 600 }
  table.stack td.head::before, table.stack td.r-sm::before { content: none }
  table.stack td.r-sm { grid-column: 1 / -1; display: block; text-align: left; padding-top: 4px; border-top: 1px dashed var(--line) }
  table.stack td.r-sm::before { content: "Mejor casa"; display: block; font: 500 10px var(--mono); letter-spacing: .05em; text-transform: uppercase; color: var(--muted) }
  table.stack tr.detail { display: block; padding: 8px 0 12px }
  table.stack tr.detail td { display: block; background: none }
  table.stack tr.detail td::before { content: none }
  tr.link:hover td { background: none }

  table.stack td .pill { margin-left: auto }

}
/* las tres actualizaciones del día */
.upd { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin: 0; padding: 0; list-style: none }
.upd li { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; gap: 2px; min-width: 0 }
.upd li.done { border-color: var(--good) }
.upd .st { font: 600 11px var(--mono); letter-spacing: .04em; text-transform: uppercase; color: var(--muted) }
.upd li.done .st { color: var(--good) }
.upd b { font-weight: 600 }
.upd .muted { font-size: 12px }
.pl-rec { font: 13px var(--mono); margin: 0 0 10px }
.pl-day { margin: 18px 0 6px }
@media (max-width: 640px) { .upd { grid-template-columns: 1fr } }
/* parlays recomendados: tarjetas con las patas y la prob. conjunta del modelo */
.pl-list { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)) }
.pl-card { display: grid; gap: 12px; align-content: start; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; min-width: 0 }
.pl-card > header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px }
.pl-card > header h3 { font-size: 22px }
.pl-card > header .res { margin-left: auto }
.pl-legs { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; counter-reset: leg }
.pl-legs li { display: grid; grid-template-columns: 22px 1fr auto; gap: 2px 8px; padding: 8px 0; border-top: 1px solid var(--line); counter-increment: leg }
.pl-legs li::before { content: counter(leg); font: 600 12px/1.6 var(--mono); color: var(--muted) }
.pl-legs li > div { min-width: 0 }
.pl-legs .lg { font-weight: 500 }
.pl-legs a { color: inherit; text-decoration: none } .pl-legs a:hover { text-decoration: underline }
.pl-legs .lp { font: 12px var(--mono); text-align: right; white-space: nowrap; display: grid; justify-items: end; gap: 2px }

.pl-stats .cell .v { font-size: 16px }
.pl-stats .cell.main { background: var(--accent-soft) }
.pl-corr { font-size: 12px; color: var(--muted); margin: 0 }
.pl-games { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: thin; padding-bottom: 4px }
.pl-games button { flex: none }
@media (max-width: 640px) {
  .pl-list { grid-template-columns: 1fr }
  .pl-stats { grid-template-columns: repeat(2, minmax(0, 1fr)) }
}
/* picks de inicio agrupados por partido (acordeones) */
.pgroups { display: grid; gap: 10px }
.pgroup { background: var(--surface); border: 1px solid var(--line); border-radius: 10px }
.pgroup[open] { border-color: var(--accent) }
.pgroup summary { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 4px 12px; padding: 12px 16px; cursor: pointer; list-style: none }
.pgroup summary::-webkit-details-marker { display: none }
.pgroup summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 10px }
.pgroup .pg-t { font: 700 20px/1.1 var(--display); letter-spacing: .02em }
.pgroup .pg-x { grid-column: 1; font: 12px var(--mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0 }
.pgroup .pg-r { grid-row: 1 / span 2; grid-column: 2; display: flex; align-items: center; gap: 10px }
.pgroup .pg-r::after { content: "▾"; color: var(--muted); transition: transform .15s }
.pgroup[open] .pg-r::after { transform: rotate(180deg) }
.pgroup .pg-n { font: 600 12px var(--mono); color: var(--good) }
.pgroup .pg-body { padding: 0 16px 12px; border-top: 1px solid var(--line) }
.pgroup.day .pg-body { padding-top: 14px }
.pgroup.day .pg-t { text-transform: capitalize }
.to-top { position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom)); z-index: 60; display: inline-flex; align-items: center; gap: 6px;
  border: 0; border-radius: 999px; padding: 10px 16px; background: var(--accent); color: var(--on-accent); font: 600 14px var(--body, inherit);
  box-shadow: 0 4px 14px rgba(0,0,0,.25); cursor: pointer; transition: opacity .2s, transform .2s }
.to-top[hidden] { display: none }
.to-top:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px }
.pgroup .pg-body table td:first-child, .pgroup .pg-body table th:first-child { display: none }
.pgroup .pg-go { display: inline-block; margin-top: 10px; font: 500 13px var(--mono); text-decoration: none }
.pg-tools { display: flex; justify-content: flex-end; margin-bottom: -2px }
.pg-tools button { font: 500 12px var(--mono); color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline }
/* Mi combinada: botón "+" en cada pick y panel flotante (minimizado = píldora abajo a la izquierda) */
/* Tablas de picks y player props: en móvil filas compactas que se deslizan a los lados (no se apilan) */
/* que una tabla ancha nunca ensanche la página: los hijos de las rejillas pueden encogerse y la tabla se desliza dentro */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100% }
.inner > *, .section > *, .pgroup, .pg-body, .tbl-wrap { min-width: 0; max-width: 100% }
.swipe-hint { display: none }
@media (max-width: 640px) {
  .swipe-hint { display: block; position: sticky; left: 0; margin: -4px 0 6px; font: 500 10.5px var(--mono); color: var(--muted); letter-spacing: .03em }
  .tbl-wrap { -webkit-overflow-scrolling: touch; overscroll-behavior-x: contain }
  .panel.tbl-wrap:has(> table.swipe) { padding: 12px 0 12px 12px }
  table.swipe { width: max-content; min-width: 100% }
  table.swipe td { white-space: nowrap }
  table.swipe .pk { position: sticky; left: 0; z-index: 1; background: var(--surface); box-shadow: 1px 0 0 var(--line);
    white-space: normal; min-width: 128px; max-width: 46vw; text-align: left }
  table.swipe td.pk .muted { display: block }
  table.swipe td.pk .pick-h { gap: 6px }
  table.swipe td.r-sm { white-space: normal; min-width: 150px }
  table.swipe tr.link:hover td.pk { background: var(--surface) }
  table.swipe tr.detail td { white-space: normal; padding: 0 }
  table.swipe tr.detail td > * { position: sticky; left: 0; width: calc(100vw - 72px); padding: 8px }
}
.pick-h { display: flex; align-items: flex-start; gap: 10px; justify-content: space-between }
.pick-h > div { min-width: 0 }
.addc { flex: none; display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--accent); background: var(--surface);
  color: var(--accent); font: 600 17px/1 var(--body); cursor: pointer; padding: 0; transition: background .15s, color .15s }
.addc:hover { background: var(--accent-soft) }
.addc[aria-pressed="true"] { background: var(--accent); color: var(--on-accent) }
.addc:focus-visible, .combo-pill:focus-visible, .cb-x:focus-visible, .cb-min:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.empty .addc { width: 22px; height: 22px; font-size: 14px; vertical-align: middle; cursor: default }
.pl-add { justify-self: start; font-size: 13px; padding: 6px 14px }
.calc-add { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
.calc-add .btn { font-size: 13px; padding: 6px 14px }
/* Crea tu pick: el mismo formulario en la página del partido y dentro de Mi combinada */
.calc .wide { grid-column: 1 / -1 }
.calc > .filters.wide { margin: 0 }
.cb-form { overflow-y: auto; padding: 4px 14px 14px; overscroll-behavior: contain; flex: 1 1 auto; min-height: 0 }
.cb-form .calc { grid-template-columns: repeat(2, minmax(0, 1fr)); margin-top: 10px }
.cb-form[hidden], .combo-panel.mk-open .cb-body, .combo-panel.mk-open .cb-foot { display: none }
.cb-mk { white-space: nowrap }
.cb-head h2 { min-width: 0 }
.cb-head button { flex: none }
@media (max-width: 640px) { .cb-head .cbm-t { display: none } .cb-head h2 { font-size: 20px } }
.cb-head .cb-mk + .cb-min { margin-left: -4px }
.mk-cta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin: 12px 0 0 }
.mk-cta .btn { font-size: 13px; padding: 6px 14px }
.combo { position: fixed; left: 16px; bottom: calc(16px + env(safe-area-inset-bottom)); z-index: 70 }
.combo[hidden] { display: none }
.combo-pill { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--accent); border-radius: 999px; padding: 8px 10px 8px 16px; cursor: pointer;
  background: var(--surface); color: var(--ink); font: 600 14px var(--body); box-shadow: 0 4px 14px rgba(0,0,0,.25) }
.combo-pill .n { display: inline-grid; place-items: center; min-width: 24px; height: 24px; padding: 0 6px; border-radius: 999px; background: var(--accent); color: var(--on-accent); font: 600 13px var(--mono) }
.combo-pill .n.won { background: var(--good) } .combo-pill .n.lost { background: var(--bad) }
.combo-pill .d { font: 600 13px var(--mono); color: var(--muted) }
.combo-pill.bump { animation: cbump .45s ease }
@keyframes cbump { 40% { transform: scale(1.08) } }
@media (prefers-reduced-motion: reduce) { .combo-pill.bump { animation: none } }
.combo.open .combo-pill { display: none }
.combo-panel { width: min(420px, calc(100vw - 32px)); max-height: min(78dvh, 720px); display: flex; flex-direction: column; background: var(--surface); color: var(--ink);
  border: 1px solid var(--line); border-top: 3px solid var(--accent); border-radius: 14px; box-shadow: 0 12px 40px rgba(0,0,0,.35); overflow: hidden }
.combo-panel[hidden] { display: none }
.cb-head { flex: none; display: flex; align-items: center; gap: 12px; padding: 12px 14px 10px; border-bottom: 1px solid var(--line) }
.cb-head h2 { font-size: 22px; flex: 1 }
.cb-min { font: 500 13px var(--mono); color: var(--accent); background: none; border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; cursor: pointer }
.cb-msg { margin: 0; padding: 8px 14px; background: var(--bad-soft); color: var(--bad); font-size: 13px }
.cb-body { overflow-y: auto; padding: 4px 14px 8px; overscroll-behavior: contain; flex: 1 1 auto; min-height: 0 }
.cb-body .empty { padding: 18px 0; font-size: 14px }
.cb-legs { list-style: none; margin: 0; padding: 0 }
.cb-legs li { display: grid; grid-template-columns: 1fr auto 28px; gap: 4px 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line) }

.cb-l { min-width: 0 } .cb-l .lg { font-weight: 500; font-size: 14px }

.cb-x { width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--line); background: none; color: var(--muted); font: 400 18px/1 var(--body); cursor: pointer; padding: 0 }
.cb-x:hover { color: var(--bad); border-color: var(--bad) }
.cb-note { margin: 8px 0 0; font-size: 12.5px; color: var(--muted) }
.cb-note.warn { color: var(--ink); background: var(--accent-soft); border-radius: 8px; padding: 8px 10px }
.cb-res { margin: 8px 0 2px; font: 600 14px var(--body); padding: 8px 10px; border-radius: 8px; background: var(--accent-soft) }

.cb-act { display: flex; align-items: center; gap: 12px; font-size: 11.5px }

@media (max-width: 640px) {
  .combo { left: 12px; bottom: calc(12px + env(safe-area-inset-bottom)) }

/* pestaña NBA Cup */
.cup-hero { position: relative; overflow: hidden; border-radius: 14px; padding: 26px 22px; color: #faf6ec;
  background: radial-gradient(120% 140% at 100% 0%, #3a2e14 0%, #15120b 45%, #050504 100%); border: 1px solid #3a321f; display: grid; gap: 14px }
.cup-hero::after { content: ""; position: absolute; right: -40px; top: -40px; width: 220px; height: 220px; border-radius: 50%;
  background: radial-gradient(circle, rgba(246,226,166,.22), rgba(246,226,166,0) 70%); pointer-events: none }
.cup-hero .eyebrow { color: #e2b75a }
.cup-hero h2 { font: 400 clamp(40px, 7vw, 64px)/.95 "Bebas Neue", var(--display); letter-spacing: .03em; color: #faf6ec }
.cup-hero h2 em { font-style: normal; background: linear-gradient(90deg, #a77a1c, #f6e2a6 50%, #c99a3a); -webkit-background-clip: text; background-clip: text; color: transparent }
.cup-hero p { margin: 0; max-width: 64ch; color: #d6cbb0 }
.cup-steps { list-style: none; margin: 6px 0 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; counter-reset: st }
.cup-steps li { counter-increment: st; border: 1px solid rgba(226,183,90,.3); border-radius: 10px; padding: 10px 12px; display: grid; gap: 2px; background: rgba(226,183,90,.06) }
.cup-steps li::before { content: "0" counter(st); font: 600 11px var(--mono); color: #e2b75a; letter-spacing: .08em }
.cup-steps b { font: 400 20px/1.05 "Bebas Neue", var(--display); letter-spacing: .05em }
.cup-steps span { font-size: 12px; color: #b9ad90 }
.pflag { display: inline-block; vertical-align: 1px; margin-left: 6px; font: 600 10px var(--mono); letter-spacing: .06em; text-transform: uppercase;
  padding: 1px 6px; border-radius: 999px; white-space: nowrap; cursor: help; color: #8a4b00; background: #fdecd2; border: 1px solid #f1cf9c }
.pflag.sin_datos { color: var(--muted); background: var(--line); border-color: transparent }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .pflag:not(.sin_datos) { color: #f5b25c; background: #33230f; border-color: #563a17 } }
:root[data-theme="dark"] .pflag:not(.sin_datos) { color: #f5b25c; background: #33230f; border-color: #563a17 }
.pf-note { display: block; margin-top: 3px; font-size: 12px; font-weight: 400; color: var(--muted); white-space: normal; text-transform: none; letter-spacing: 0 }

.calc-warn { color: #8a4b00 }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .calc-warn { color: #f5b25c } }
:root[data-theme="dark"] .calc-warn { color: #f5b25c }

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
// etiqueta de jugadores con poca historia NBA (rookie, un año fuera por lesión o sin datos de la temporada pasada)
const FLAG_TXT = { rookie: "Rookie", lesion: "Sin 2025-26", sin_datos: "Sin datos previos" };
const FLAG_WHY = " Sus predicciones pueden variar mucho más que las del resto.";
const ftag = f => f ? `<span class="pflag ${esc(f.t)}" title="${esc(f.note + "." + FLAG_WHY)}" role="button" tabindex="0">${FLAG_TXT[f.t] || esc(f.t)}</span><span class="pf-note" hidden>${esc(f.note + "." + FLAG_WHY)}</span>` : "";
// en el celular no hay cursor: tocar la etiqueta muestra / oculta el detalle debajo del nombre
document.addEventListener("click", e => {
  const t = e.target.closest(".pflag"); if (!t) return;
  e.stopPropagation(); e.preventDefault();
  const n = t.nextElementSibling; if (n && n.classList.contains("pf-note")) n.hidden = !n.hidden;
}, true);
const pct = (p, d = 1) => (p * 100).toFixed(d) + "%";
const dec = o => (o > 0 ? 1 + o / 100 : 1 + 100 / -o).toFixed(2);   // americana → decimal
const fairDec = p => p > 0 ? (1 / p).toFixed(2) : "—";               // cuota justa = 1 / prob
const evTxt = ev => (ev >= 0 ? "+" : "") + (ev * 100).toFixed(1) + "%";
// Colores de cada franquicia (uno vivo por equipo, para que se distingan también en modo oscuro)
const TEAM = { ATL: "#E03A3E", BOS: "#007A33", BKN: "#6E7378", CHA: "#00788C", CHI: "#CE1141", CLE: "#860038", DAL: "#00538C", DEN: "#FEC524",
  DET: "#C8102E", GSW: "#FFC72C", HOU: "#BA0C2F", IND: "#FDBB30", LAC: "#1D428A", LAL: "#552583", MEM: "#5D76A9", MIA: "#98002E", MIL: "#00471B",
  MIN: "#78BE20", NOP: "#85714D", NYK: "#F58426", OKC: "#007AC1", ORL: "#0077C0", PHI: "#006BB6", PHX: "#E56020", POR: "#E03A3E", SAC: "#5A2D81",
  SAS: "#8A8D8F", TOR: "#A6192E", UTA: "#F9A01B", WAS: "#E31837" };
const tc = t => TEAM[t] || "#5b6577";
const tf = t => { const h = tc(t), [r, g, b] = [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)); return (r * 299 + g * 587 + b * 114) / 1000 > 150 ? "#111" : "#fff"; };
const badge = t => `<span class="badge" style="--tc:${tc(t)};--tf:${tf(t)}">${esc(t)}</span>`;
const isCup = g => g.competition === "cup";
const KIND = { ml: "Ganador", spread: "Hándicap", total: "Total de puntos", tt: "Puntos de equipo", prop: "Player prop" };
let INDEX = null, DAY = null;
const cache = {};

async function getJSON(u) { const r = await fetch(u, { cache: "no-store" }); if (!r.ok) throw new Error(u + " " + r.status); return r.json(); }

function evPill(ev, thr) {
  if (ev >= thr) return `<span class="pill value">${evTxt(ev)}</span>`;
  if (ev >= 0) return `<span class="pill flat">${evTxt(ev)}</span>`;
  return `<span class="pill neg">${evTxt(ev)}</span>`;
}

const legend = thr => `<div class="legend-row">
  <div class="legend-item"><span class="pill value">Verde · EV ≥ +${(thr * 100).toFixed(0)}%</span>Pick con valor: la probabilidad (modelo mezclado con la casa) supera a la que paga la cuota. Máximo ${INDEX.max_daily || 15} por jornada.</div>
  <div class="legend-item"><span class="pill flat">${document.documentElement.dataset.mode === "cup" ? "Dorado" : "Azul"} · EV 0 a +${(thr * 100).toFixed(0)}%</span>Ligeramente a favor, pero el margen es tan pequeño que no se recomienda.</div>
  <div class="legend-item"><span class="pill neg">Rojo · EV negativo</span>La cuota paga menos de lo que vale según el modelo. Evitar.</div>
</div>`;

const howto = `<details class="howto"><summary>¿Cómo leer esta tabla?</summary><dl>
  <dt>Cuota</dt><dd>Cuota decimal promedio de las casas que ofrecen la línea más repetida (la de consenso): lo que recibes por cada 1 apostado, incluido lo apostado. Un * indica que no hubo cuota publicada y se asume 1.91.</dd>
  <dt>Prob. modelo</dt><dd>Porcentaje de las simulaciones en que gana la apuesta.</dd>
  <dt>Prob. casa</dt><dd>Probabilidad que implica la cuota (1 / cuota), con el margen de la casa incluido.</dd>
  <dt>Cuota justa</dt><dd>La cuota que haría la apuesta neutra según el modelo (1 / prob. modelo). Si la casa paga más que esto, hay valor.</dd>
  <dt>EV</dt><dd>Ganancia esperada por cada 100 apostados con la cuota promedio. +10% significa ganar 10 de media por cada 100 a largo plazo. El color se decide con esta cuota promedio.</dd>
  <dt>Mejor casa</dt><dd>La casa donde la apuesta rinde más según el modelo, a veces con una línea distinta (por ejemplo -13.5 en vez de -14.5). En la página de cada partido puedes ver todas las casas.</dd>
  <dt>Casas de Colombia <span class="co">CO</span></dt><dd>Rushbet y BetPlay, cuando hay cuotas suyas para el partido. Cuentan en el promedio como una casa más, y debajo de la mejor casa se muestra la mejor opción en Colombia.</dd>
</dl></details>`;

const lineTxt = (b, l) => l == null ? "" : (b.kind === "total" ? `${l} ` : `${l > 0 ? "+" : ""}${l} `);
function bestCell(b, thr) {
  if (!b.best) return `<span class="muted">—</span>`;
  const o = b.best, other = o.line !== b.line;
  const co = b.best_co && b.best_co !== o && b.best_co.book !== o.book ? b.best_co : null;
  return `<div class="num">${esc(o.book)}${coTag(o)}</div><div class="kind">${other ? esc(lineTxt(b, o.line)) + "@ " : "@ "}${o.dec.toFixed(2)} · EV ${evTxt(o.ev)}</div>` +
    (co ? `<div class="kind bestco">En Colombia: ${esc(co.book)} ${co.line !== b.line ? esc(lineTxt(b, co.line)) : ""}@ ${co.dec.toFixed(2)} · EV ${evTxt(co.ev)}</div>` : "");
}
const coTag = o => o.region === "CO" ? `<span class="co" title="Casa de Colombia">CO</span>` : "";
function bookList(b) {
  return `<div class="books">${b.books.map(o => `<span class="book${o.ev >= INDEX.value_ev ? " good" : o.ev < 0 ? " bad" : ""}"><b>${esc(o.book)}</b>${coTag(o)} ${esc(lineTxt(b, o.line))}@ ${o.dec.toFixed(2)} <i>${evTxt(o.ev)}</i></span>`).join("")}</div>`;
}
const RES = { won: "Ganada", lost: "Perdida", push: "Nula" };
// Las tres actualizaciones diarias (build_site.py --stage): resultados de madrugada, análisis de la mañana y
// revisión de bajas antes del primer partido. INDEX.updates = {jornada: {etapa: hora UTC}}.
const STAGE = { results: "Resultados de la jornada", morning: "Análisis y cuotas", pregame: "Revisión de bajas" };
const toDate = iso => iso ? new Date(iso.length === 16 ? iso + "Z" : iso) : null;
const hm = d => d.toLocaleTimeString("es-CO", { hour: "numeric", minute: "2-digit" });
const whenTxt = d => `${d.toLocaleDateString("es-CO", { day: "numeric", month: "short" })}, ${hm(d)}`;
// hora ET de un partido ("19:00" del día dado) como fecha real, con horario de verano o no según el día
function etDate(day, t) {
  for (const off of ["-04:00", "-05:00"]) {
    const d = new Date(`${day}T${t}:00${off}`);
    if (d.toLocaleTimeString("en-GB", { timeZone: "America/New_York", hour: "2-digit", minute: "2-digit" }) === t) return d;
  }
  return null;
}
const firstTip = todays => todays.map(g => g.tip_et && etDate(g.date, g.tip_et)).filter(Boolean).sort((a, b) => a - b)[0];
function updatesStrip() {
  const todays = INDEX.games.filter(g => g.date === DAY);  // la jornada completa (liga y Copa)
  if (!todays.length) return "";
  const u = (INDEX.updates || {})[DAY] || {}, tip = firstTip(todays), allRes = todays.every(g => g.result);
  const item = (k, done, at, todo) => `<li class="${done ? "done" : ""}"><span class="st">${done ? "✓ Hecha" : "Pendiente"}</span><b>${STAGE[k]}</b>
    <span class="muted">${done ? (at ? whenTxt(toDate(at)) : "Publicada") : todo}</span></li>`;
  const pre = tip ? new Date(tip - 45 * 60000) : null;
  return `<section class="section"><h2>Actualizaciones de la jornada ${qh("actualizaciones", "actualizaciones del día")}</h2>
    <ul class="upd">
      ${item("morning", true, u.morning, "")}
      ${item("pregame", !!u.pregame, u.pregame, pre ? `Hacia las ${hm(pre)}, entre 30 y 60 min antes del primer partido (${hm(tip)}).` : "Entre 30 y 60 min antes del primer partido.")}
      ${item("results", allRes, u.results, todays.some(g => g.result) ? "Faltan partidos por terminar." : "En la madrugada, cuando termine el último partido.")}
    </ul><p class="muted">Horas en tu zona horaria.</p></section>`;
}
// récord de parlays: [ganados, perdidos] (las nulas no cuentan)
const plRec = pls => [pls.filter(p => p.result === "won").length, pls.filter(p => p.result === "lost").length];
// En móvil, las tablas de picks y player props no se apilan: se deslizan a los lados con la 1.ª columna fija
const SWIPE_HINT = `<div class="swipe-hint">Desliza la tabla → para ver más</div>`;
const resPill = r => r ? `<span class="res ${r}">${RES[r]}</span>` : "";
function betRows(bets, thr, withGame) {
  const withRes = bets.some(b => b.result);
  return bets.map((b, i) => `<tr${withGame ? ` class="link" data-go="${b._gid}"` : ""}>
    ${withGame ? `<td class="head"><a href="#${b._gid}">${esc(b._game)}</a></td>` : ""}
    <td class="head pk"><div class="pick-h"><div><div>${esc(b.label)}${ftag(b.flag)}</div><div class="kind">${KIND[b.kind] || b.kind}</div>${!withGame && b.books ? `<button type="button" class="more" id="more-${i}" data-i="${i}" aria-expanded="false">Ver ${b.books.length} casas</button>` : ""}</div>${addBtn(regLeg(b, withGame ? b._gid : CUR_GAME.id, withGame ? b._game : CUR_GAME.game))}</div></td>
    <td class="r num" data-label="Cuota">${(b.dec || +dec(b.odds)).toFixed(2)}${b.odds_assumed ? "*" : ""}${b.n_books ? `<div class="kind">prom. ${b.n_books} casa${b.n_books > 1 ? "s" : ""}</div>` : ""}</td>
    <td class="r num" data-label="Prob. modelo">${pct(b.p)}</td>
    <td class="r num" data-label="Prob. casa">${pct(b.implied)}</td>
    <td class="r num" data-label="Cuota justa">${fairDec(b.p)}</td>
    <td class="r" data-label="EV">${evPill(b.ev, thr)}</td>
    <td class="r-sm" data-label="Mejor casa">${bestCell(b, thr)}</td>${withRes ? `<td class="r" data-label="Resultado">${resPill(b.result)}</td>` : ""}</tr>
    ${!withGame && b.books ? `<tr class="detail" id="det-${i}" hidden><td colspan="${withRes ? 9 : 8}">${bookList(b)}</td></tr>` : ""}`).join("");
}

const betHead = (withGame, withRes) => `<thead><tr>${withGame ? bth("game", "Partido", "") : ""}${bth("pick", "Pick", "pk")}${bth("dec", "Cuota")}

}

// Barra: resultados de la jornada anterior + partidos de hoy. Se repite 3 veces para poder dar la
// vuelta sin saltos en ambos sentidos; se mantiene siempre dentro de la copia del medio.
const TK = { set: 0, loop: false, pauseUntil: 0, hover: false, drag: null, pos: 0, last: 0 };
const calm = matchMedia("(prefers-reduced-motion: reduce)");
function renderTicker(prev, todays) {
  const sc = $("#tscroll"), tr = $("#track");
  const group = (games, label, dup, when) => games.length ? `<span class="tk-label ${when}"${dup ? ' aria-hidden="true"' : ""}>${label}</span>${games.map(g => chip(g, dup, when)).join("")}` : "";
  const copy = dup => group(prev, prev[0] ? "Ayer · " + prev[0].date.slice(5) : "", dup, "past") + group(todays, todays.some(g => g.result) ? "Jornada" : "Hoy", dup, "today");
  tr.innerHTML = `<span class="tk-copy" style="display:contents">${copy(false)}</span>`;
  const one = tr.scrollWidth;
  TK.loop = !calm.matches && one > sc.clientWidth;
  if (TK.loop) {
    tr.innerHTML = copy(true) + `<span class="tk-mark"></span>` + copy(false) + `<span class="tk-mark"></span>` + copy(true);
    const m = tr.querySelectorAll(".tk-mark");
    TK.set = m[1].offsetLeft - m[0].offsetLeft;
    sc.scrollLeft = TK.pos = m[0].offsetLeft - tr.offsetLeft;
  }
  // arranca mostrando los partidos de hoy (en el bucle, los de la copia del medio)
  const lb = tr.querySelectorAll(".tk-label.today"), hoyLb = lb[TK.loop ? 1 : 0];
  if (hoyLb && prev.length) { sc.scrollLeft = TK.pos = Math.max(0, hoyLb.offsetLeft - tr.offsetLeft - 8); tkPause(4000); }
  $("#tk-prev").hidden = $("#tk-next").hidden = one <= sc.clientWidth;
}
function tkWrap() {   // vuelve a la copia del medio cuando el usuario no está desplazando
  const sc = $("#tscroll");
  if (!TK.loop || TK.drag) return;
  const lo = TK.set * 0.5, hi = TK.set * 1.5 + 1;   // la copia del medio empieza ~en set
  if (sc.scrollLeft < lo) sc.scrollLeft += TK.set; else if (sc.scrollLeft > hi) sc.scrollLeft -= TK.set;
  TK.pos = sc.scrollLeft;
}
const tkPause = (ms = 5000) => { TK.pauseUntil = performance.now() + ms; };
function tkFrame(t) {
  const sc = $("#tscroll"), dt = Math.min(64, t - (TK.last || t)); TK.last = t;
  if (TK.loop && !TK.hover && !TK.drag && t > TK.pauseUntil && !document.hidden) {
    if (Math.abs(sc.scrollLeft - TK.pos) > 2) TK.pos = sc.scrollLeft;   // el usuario la movió
    TK.pos += dt * 0.04;   // 40 px por segundo
    sc.scrollLeft = TK.pos;
    if (sc.scrollLeft > TK.set * 1.5) { sc.scrollLeft -= TK.set; TK.pos -= TK.set; }
  }
  requestAnimationFrame(tkFrame);
}
function setupTicker() {
  const sc = $("#tscroll");
  sc.addEventListener("mouseenter", () => TK.hover = true);
  sc.addEventListener("mouseleave", () => { TK.hover = false; tkPause(1500); });
  ["touchstart", "touchmove", "touchend", "wheel", "focusin"].forEach(e => sc.addEventListener(e, () => tkPause(), { passive: true }));
  let idle;
  sc.addEventListener("scroll", () => { clearTimeout(idle); idle = setTimeout(tkWrap, 180); }, { passive: true });
  // arrastrar con el ratón; si hubo arrastre no se abre el partido al soltar
  sc.addEventListener("pointerdown", e => { if (e.pointerType === "mouse" && e.button === 0) TK.drag = { x: e.clientX, s: sc.scrollLeft, moved: false, id: e.pointerId }; });
  sc.addEventListener("pointermove", e => {
    const d = TK.drag; if (!d) return;
    const dx = e.clientX - d.x;
    if (!d.moved && Math.abs(dx) > 5) { d.moved = true; sc.classList.add("dragging"); sc.setPointerCapture(d.id); }
    if (d.moved) sc.scrollLeft = d.s - dx;
  });
  const end = () => { const d = TK.drag; if (!d) return; TK.drag = null; sc.classList.remove("dragging"); TK.pos = sc.scrollLeft; tkPause(3000); tkWrap();
    if (d.moved) sc.addEventListener("click", ev => { ev.preventDefault(); ev.stopPropagation(); }, { capture: true, once: true }); };
  sc.addEventListener("pointerup", end); sc.addEventListener("pointercancel", end);
  const step = dir => { tkPause(6000); sc.scrollBy({ left: dir * sc.clientWidth * 0.7, behavior: calm.matches ? "auto" : "smooth" }); };
  $("#tk-prev").addEventListener("click", () => step(-1));
  $("#tk-next").addEventListener("click", () => step(1));
  requestAnimationFrame(tkFrame);
}

// Parlays recomendados (build_site.py): mismo partido = prob. conjunta contada en las simulaciones
// (incluye la correlación); entre partidos = producto de probabilidades (partidos independientes).
const PL_N = { 2: "2 patas", 3: "3 patas", 4: "4 patas" };
function parlayCard(pl, thr, withGame) {
  const cross = pl.type === "cross", c = pl.corr;
  const corr = cross ? "Partidos distintos: la probabilidad conjunta es el producto de las de cada pata."
    : c >= 1.02 ? `Patas que se ayudan entre sí: ${pct(c - 1, 0)} más probable que si fueran independientes (${pct(pl.p_indep)}).`
    : c <= 0.98 ? `Patas que se estorban un poco: ${pct(1 - c, 0)} menos probable que si fueran independientes (${pct(pl.p_indep)}).`
    : `Patas casi independientes entre sí (${pct(pl.p_indep)} multiplicando).`;
  return `<article class="pl-card">
    <header><h3>${PL_N[pl.n] || pl.n + " patas"}</h3><span class="kind">${cross ? "Entre partidos" : "Mismo partido" + (withGame ? ` · <a href="#${pl.legs[0].gid}">${esc(pl.legs[0].game)}</a>` : "")}</span>${resPill(pl.result)}</header>
    <ol class="pl-legs">${pl.legs.map(l => `<li><div><div class="lg">${esc(l.label)}${ftag(l.flag)}</div><div class="kind">${KIND[l.kind] || l.kind}${cross ? ` · <a href="#${l.gid}">${esc(l.game)}</a>` : ""}</div></div>
      <div class="lp"><span>${pct(l.p, 0)} · @ ${l.dec.toFixed(2)}</span>${resPill(l.result)}</div></li>`).join("")}</ol>
    <div class="pl-stats">
      <div class="cell main"><span class="k">Prob. modelo</span><span class="v">${pct(pl.p)}</span></div>
      <div class="cell"><span class="k">Cuota aprox.</span><span class="v">${pl.dec.toFixed(2)}</span></div>
      <div class="cell"><span class="k">Cuota justa</span><span class="v">${pl.fair ? pl.fair.toFixed(2) : "—"}</span></div>
      <div class="cell"><span class="k">EV</span><span class="v">${evPill(pl.ev, thr)}</span></div>
    </div>
    <p class="pl-corr">${corr}</p>
    ${plAddBtn(pl)}
  </article>`;
}
const plHowto = `<details class="howto"><summary>¿Cómo se arman los parlays?</summary><dl>
  <dt>Patas</dt><dd>Solo entran player props con cuota a los dos lados, probabilidad (mezclada con la casa) de al menos 55% y EV no negativo, sin rookies ni jugadores sin temporada previa. Cada SGP de un partido usa patas distintas a las de los otros, así una pata fallada no tumba a todos. Los parlays entre partidos son de 2 patas, con picks con valor (EV ≥ +3%). No se combinan dos patas del mismo jugador.</dd>
  <dt>Elección</dt><dd>Para 2, 3 y 4 patas se elige la combinación con la mayor probabilidad de acertar todas, siempre que la cuota combinada sea de al menos 2.00 y el EV sea positivo.</dd>
  <dt>Prob. modelo</dt><dd>Mismo partido: porcentaje de las simulaciones en que aciertan todas las patas a la vez, así se tiene en cuenta que unas dependen de otras (si un equipo anota mucho suben sus jugadores y el over). Entre partidos: producto de las probabilidades. Se calcula suponiendo que juegan todos los jugadores de las props (si uno no juega, la casa anula esa pata) y no entran jugadores en duda.</dd>
  <dt>Cuota aprox.</dt><dd>Producto de las cuotas promedio de cada pata. En un parlay del mismo partido la casa suele pagar menos que esto cuando las patas van en la misma dirección: compara con la cuota que te ofrezca y con la cuota justa.</dd>
</dl></details>`;
let PL_MODE = "cross", PL_GAME = null;
function parlaySection(todays, thr) {
  const cross = crossFor(todays), withSgp = todays.filter(g => (g.parlays || []).length);
  if (!cross.length && !withSgp.length) return "";

  if (!withSgp.some(g => g.id === PL_GAME)) PL_GAME = withSgp[0]?.id;
  return `<section class="section" id="parlays">

    <h2>Parlays recomendados ${qh("parlays", "parlays")}</h2>
    <p class="lede">Combinadas de 2 a 4 patas con la mayor probabilidad de acertar todas según las simulaciones. Dentro de un mismo partido (SGP) se cuenta en cuántas simulaciones salen todas a la vez, no se multiplican a ciegas.</p>
    <div class="filters" role="group" aria-label="Tipo de parlay" id="pl-mode">
      ${cross.length ? `<button type="button" data-m="cross" aria-pressed="${PL_MODE === "cross"}">Entre partidos · ${cross.length}</button>` : ""}
      ${withSgp.length ? `<button type="button" data-m="sgp" aria-pressed="${PL_MODE === "sgp"}">Mismo partido · ${withSgp.length}</button>` : ""}
    </div>

      return `<p class="pl-rec">Resultado: ${cross.length ? `entre partidos ${cw}–${cl}` : ""}${cross.length && withSgp.length ? " · " : ""}${withSgp.length ? `mismo partido (SGP) ${sw}–${sl}` : ""}</p>`; })() : ""}
    <div class="filters pl-games" role="group" aria-label="Partido" id="pl-games"></div>
    <div class="pl-list" id="pl-list"></div>
    ${plHowto}
  </section>`;
}
// parlays entre partidos solo con patas de la pestaña activa (liga regular o NBA Cup)
function crossFor(todays) {
  const ids = new Set(todays.map(g => g.id));
  return ((INDEX.parlays || {})[DAY] || []).filter(pl => pl.legs.every(l => ids.has(l.gid)));
}
function bindParlays(todays, thr) {
  if (!$("#parlays")) return;
  const withSgp = todays.filter(g => (g.parlays || []).length);
  const draw = () => {
    document.querySelectorAll("#pl-mode button").forEach(b => b.setAttribute("aria-pressed", b.dataset.m === PL_MODE));

    gb.innerHTML = withSgp.map(g => `<button type="button" data-g="${g.id}" aria-pressed="${g.id === PL_GAME}">${esc(g.away)} @ ${esc(g.home)}</button>`).join("");
    gb.querySelectorAll("button").forEach(b => b.addEventListener("click", () => { PL_GAME = b.dataset.g; draw(); }));
    const list = PL_MODE === "cross" ? crossFor(todays) : (withSgp.find(g => g.id === PL_GAME) || {}).parlays || [];
    $("#pl-list").innerHTML = list.map(pl => parlayCard(pl, thr, PL_MODE === "sgp")).join("") || `<div class="empty">Sin parlays para esta selección.</div>`;

function histogram(h, away, home) {
  const W = 520, H = 170, pad = 26, n = h.length, max = Math.max(...h, 1), bw = (W - pad * 2) / n;
  const bars = h.map((v, i) => {
    const lo = -40 + i * 4, x = pad + i * bw, bh = (v / max) * (H - 44);
    return `<rect x="${x + 1}" y="${H - 24 - bh}" width="${bw - 2}" height="${bh}" rx="2" fill="${lo >= 0 ? "var(--accent)" : "var(--muted)"}" opacity="${lo >= 0 ? 1 : .55}"><title>${away} ${lo} a ${lo + 4}: ${v}</title></rect>`;
  }).join("");
  const ticks = [-40, -20, 0, 20, 40].map(t => `<text x="${pad + ((t + 40) / 4) * bw}" y="${H - 6}" text-anchor="middle">${t > 0 ? "+" + t : t}</text>`).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Distribución del margen">
    <line x1="${pad + 10 * bw}" x2="${pad + 10 * bw}" y1="8" y2="${H - 24}" stroke="var(--line)" />
    ${bars}${ticks}
    <text x="${W - pad}" y="14" text-anchor="end">gana ${esc(away)} →</text><text x="${pad}" y="14">← gana ${esc(home)}</text></svg>`;
}

// Enfrentamiento según los rankings (d.matchup_view, lo arma build_site.py desde la BD de rankings).
// Verde = favorece al equipo que ataca, rojo = favorece a la defensa rival.
const PLAY = { Isolation: "Aislamiento (1 vs 1)", Transition: "Transición", PRBallHandler: "Pick & roll · manejador", PRRollman: "Pick & roll · rodador",
  Postup: "Juego de poste", Spotup: "Tiro tras recepción (spot-up)", Handoff: "Hand-off", Cut: "Cortes", OffScreen: "Salida de bloqueo", OffRebound: "Rebote ofensivo (putback)" };
const rankCls = (r, invert) => { const x = invert ? 31 - r : r; return x <= 10 ? "good" : x >= 21 ? "bad" : ""; };   // ranking desde el ataque
const fmtV = v => v < 1 ? (v * 100).toFixed(1) + "%" : v.toFixed(1);
// Quinteto probable y rotación estimada (build_site.rotation_view). Los tramos de cada cuarto siguen el patrón típico
// de la NBA: los titulares abren cada mitad y cierran el 2.º y 4.º cuarto; la rotación entra a final del 1.º y del 3.º;
// los de rol, al inicio del 2.º y del 4.º; las reservas, solo en los últimos minutos si hay paliza.
const ROLE = { titular: "Titular", rotacion: "Rotación", rol: "Rol", reserva: "Reserva (paliza)" };
const SLOT_TXT = { PG: "Base (PG)", SG: "Escolta (SG)", SF: "Alero (SF)", PF: "Ala-pívot (PF)", C: "Pívot (C)" };
function stints(r) {
  const m = r.min, cap = (x0, x1) => [Math.max(0, x0), Math.min(48, x1)];
  if (r.role === "titular") { const a = Math.min(m * .3, 11), b = Math.min(Math.max((m - 2 * a) / 2, 0), 12); return [cap(0, a), cap(24 - b, 24), cap(24, 24 + a), cap(48 - b, 48)]; }

  if (r.role === "rol") return [cap(12, 12 + m / 2), cap(36, 36 + m / 2)];

function teamDist(d, mk, T) {

// a = P(acierta el lado 1: el equipo / over), b = P(lado 2: under), push = P(empate)
function teamProb(d, mk, T, L) {

  if (mk === "ml") return { a: d.summary.win_prob[T], b: null, push: 0, src: "pub" };
  if (mk === "spread") {
    const b = pub(teamLabel(mk, T, L));

  const over = l.side ? l.side === "over" : l.label.includes(" Over ");

  return { hit, ok: on };
}
function simJoint(legs, S) {
  const hs = legs.map(l => simLeg(l, S));
  if (hs.some(h => !h)) return null;
  let both = 0, nok = 0;
  const marg = hs.map(h => { let w = 0, k = 0; for (let i = 0; i < S.n; i++) if (!h.ok || h.ok[i]) { k++; w += h.hit[i]; } return k ? w / k : 0; });
  for (let i = 0; i < S.n; i++) {
    if (hs.some(h => h.ok && !h.ok[i])) continue;
    nok++; if (hs.every(h => h.hit[i])) both++;
  }
  const ind = marg.reduce((t, m) => t * m, 1);
  return nok >= 100 && ind > 0 ? both / nok / ind : null;   // factor de correlación
}
function comboCalc() {
  const groups = {};
  MYC.forEach(l => (groups[l.gid] ||= []).push(l));
  let p = 1, decT = 1, approx = [], exact = [], sim = [], loading = false, clash = [];
  const res = MYC.map(legResult);
  Object.values(groups).forEach(ls_ => {
    const live = ls_.filter(l => res[MYC.indexOf(l)] !== "push");
    live.forEach(l => { decT *= l.dec; });
    if (live.length > 1) {
      const gid = live[0].gid, g = INDEX.games.find(x => x.id === gid), prod = live.reduce((t, l) => t * l.p, 1);
      if (g && !g.result) loadSims(gid);
      const S = SIMS[gid], f = S && S !== "loading" ? simJoint(live, S) : null, m = sgpMatch(gid, live.map(l => l.label));
      if (f != null) { const q = Math.min(prod * f, ...live.map(l => l.p)); p *= q; sim.push({ game: live[0].game, f, indep: prod, p: q }); }
      else if (m) { p *= m.p; exact.push(live[0].game); }
      else { p *= prod; approx.push(live[0].game); if (S === "loading") loading = true; }
    } else if (live.length) p *= live[0].p;
    for (let i = 0; i < ls_.length; i++) for (let j = i + 1; j < ls_.length; j++) {
      const a = ls_[i], b = ls_[j];
      const side = x => x.kind === "spread" ? "ml" : x.kind === "tt" ? "tt" + x.team : x.kind;   // ganador y hándicap del mismo partido tampoco se combinan
      if (a.player ? a.player === b.player && a.stat === b.stat : !b.player && side(a) === side(b)) clash.push(`${a.label} / ${b.label}`);
    }
  });
  const st = res.some(r => r === "lost") ? "lost" : res.length && res.every(r => r === "push") ? "push" : res.length && res.every(r => r === "won" || r === "push") ? "won" : null;
  return { p, dec: decT, ev: p * decT - 1, approx, exact, sim, loading, clash, res, st, done: res.filter(r => r).length };
}
const fmtMoney = x => x.toLocaleString("es-CO", { maximumFractionDigits: x < 100 ? 2 : 0 });
function drawCombo() {
  const box = $("#combo"), n = MYC.length;
  box.hidden = !n && !box.classList.contains("open");
  document.body.classList.toggle("has-combo", !!n);
  $("#cp-n").textContent = n;
  syncMkBtn();
  if (!n) {
    $("#cp-d").textContent = "";
    $("#cb-body").innerHTML = `<div class="empty">Tu combinada está vacía. Toca <span class="addc" aria-hidden="true">+</span> junto a cualquier pick (o "Agregar a mi combinada" en un parlay) para sumarlo aquí, o crea el tuyo con <b>+ Crear pick</b>.</div>`;
    $("#cb-foot").hidden = true;
    return;
  }
  const c = comboCalc(), thr = INDEX ? INDEX.value_ev : .03;
  $("#cp-d").textContent = "@ " + c.dec.toFixed(2);
  $("#cp-n").classList.toggle("won", c.st === "won"); $("#cp-n").classList.toggle("lost", c.st === "lost");
  const stake = parseFloat(ls("nbap-combo-stake")) || 0;
  $("#cb-body").innerHTML = `
    ${c.st ? `<div class="cb-res ${c.st}">${c.st === "won" ? "Combinada ganada ✓" : c.st === "lost" ? "Combinada perdida ✗" : "Combinada nula (todas las patas anuladas)"}</div>`
      : c.done ? `<div class="cb-res">${c.res.filter(r => r === "won").length} de ${n} patas acertadas · faltan ${n - c.done} por jugarse</div>` : ""}
    <ol class="cb-legs">${MYC.map((l, i) => `<li>
      <div class="cb-l"><div class="lg">${esc(l.label)}${ftag(l.flag)}</div><div class="kind">${KIND[l.kind] || l.kind} · <a href="#${esc(l.gid)}">${esc(l.game)}</a>${l.gid.slice(0, 10) !== DAY ? ` · ${esc(dayName(l.gid.slice(0, 10)))}` : ""}${l.custom ? " · tu cuota" : ""}</div></div>
      <div class="cb-r"><span class="num">${pct(l.p, 0)} · @ ${l.dec.toFixed(2)}</span>${resPill(c.res[i])}</div>
      <button type="button" class="cb-x" data-rm="${i}" aria-label="Quitar ${esc(l.label)}">×</button></li>`).join("")}</ol>
    ${n === 1 ? `<p class="cb-note">Agrega al menos otra pata para armar la combinada.</p>` : ""}
    ${c.sim.map(x => `<p class="cb-note">Patas de ${esc(x.game)} contadas juntas en las simulaciones del partido: ${x.f >= 1.02 ? `se ayudan entre sí, ${pct(x.f - 1, 0)} más probable que multiplicarlas` : x.f <= 0.98 ? `se estorban, ${pct(1 - x.f, 0)} menos probable que multiplicarlas` : "casi independientes"} (${pct(x.p)} frente a ${pct(x.indep)}).${x.f >= 1.02 ? " La casa suele pagar menos por un parlay así: compara su cuota con la cuota justa." : ""}</p>`).join("")}
    ${c.loading ? `<p class="cb-note">Contando las patas del mismo partido en las simulaciones…</p>` : ""}
    ${c.approx.length && !c.loading ? `<p class="cb-note warn">Patas del mismo partido (${c.approx.map(esc).join(", ")}): no hay simulaciones publicadas para contarlas juntas${c.res.some(r => r) ? " (el partido ya se jugó)" : ""}, así que la probabilidad se calcula multiplicando, como si fueran independientes. Tómala como aproximada.</p>` : ""}
    ${c.exact.length ? `<p class="cb-note">Las patas de ${c.exact.map(esc).join(", ")} coinciden con un parlay recomendado: se usa la probabilidad contada en las simulaciones, que ya tiene en cuenta cómo dependen unas de otras.</p>` : ""}
    ${c.clash.length ? `<p class="cb-note warn">Ojo, estas patas se pisan entre sí y muchas casas no las dejan combinar: ${c.clash.map(esc).join("; ")}.</p>` : ""}`;
  $("#cb-foot").hidden = false;
  $("#cb-stats").innerHTML = `
    <div class="cell main"><span class="k">Prob. modelo</span><span class="v">${pct(c.p)}${c.approx.length || c.loading ? "*" : ""}</span></div>
    <div class="cell"><span class="k">Cuota aprox.</span><span class="v">${c.dec.toFixed(2)}</span></div>
    <div class="cell"><span class="k">Cuota justa</span><span class="v">${fairDec(c.p)}</span></div>
    <div class="cell"><span class="k">EV</span><span class="v">${n > 1 ? evPill(c.ev, thr) : "—"}</span></div>`;
  const si = $("#cb-stake"); if (document.activeElement !== si) si.value = stake || "";
  $("#cb-pay").textContent = stake > 0 ? `Pago posible ${fmtMoney(stake * c.dec)} (ganancia ${fmtMoney(stake * (c.dec - 1))})` : "Escribe cuánto apostarías para ver el pago.";
  document.querySelectorAll("#cb-body [data-rm]").forEach(b => b.addEventListener("click", () => { MYC.splice(+b.dataset.rm, 1); comboChanged(); }));
  document.querySelectorAll("#cb-body a").forEach(a => a.addEventListener("click", () => { if (matchMedia("(max-width: 640px)").matches) openCombo(false); }));
}
function openCombo(on) {
  const box = $("#combo");
  box.classList.toggle("open", on); $("#combo-panel").hidden = !on;
  $("#combo-pill").setAttribute("aria-expanded", on);
  if (on) { box.hidden = false; drawCombo(); $("#cb-min").focus({ preventScroll: true }); } else { if (MK_OPEN) showPickForm(false); drawCombo(); if (!box.hidden) $("#combo-pill").focus({ preventScroll: true }); }
}
$("#combo-pill").addEventListener("click", () => openCombo(true));
$("#cb-min").addEventListener("click", () => openCombo(false));
$("#cb-mk").addEventListener("click", () => showPickForm(!MK_OPEN));
$("#cb-clear").addEventListener("click", () => { if (!MYC.length || confirm("¿Vaciar tu combinada?")) { MYC = []; comboChanged(); openCombo(false); } });
$("#cb-stake").addEventListener("input", e => { ls("nbap-combo-stake", e.target.value); drawCombo(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("#combo").classList.contains("open") && !$("#guide").open) openCombo(false); });
addEventListener("storage", e => { if (e.key === "nbap-combo") { try { MYC = JSON.parse(e.newValue || "[]"); } catch (x) { MYC = []; } syncAddBtns(); drawCombo(); } });

// Botón flotante para volver arriba (al inicio del análisis en la página de un partido) tras bajar un poco
// aparece al bajar media pantalla (en el celular unos 400 px); también con desplazamiento táctil e inercia
const toTop = () => { $("#to-top").hidden = (scrollY || document.scrollingElement.scrollTop) < Math.min(600, innerHeight * 0.5); };
["scroll", "touchmove", "touchend", "resize"].forEach(e => addEventListener(e, toTop, { passive: true }));
$("#to-top").addEventListener("click", () => {
  scrollTo({ top: 0, behavior: calm.matches ? "auto" : "smooth" });
});

// Modo claro / oscuro: el botón alterna y guarda la elección; sin elección sigue al sistema
const darkMQ = matchMedia("(prefers-color-scheme: dark)");
const isDark = () => (document.documentElement.dataset.theme || (darkMQ.matches ? "dark" : "light")) === "dark";
function syncThemeBtn() { $("#theme-btn").setAttribute("aria-label", isDark() ? "Cambiar a modo claro" : "Cambiar a modo oscuro"); }
$("#theme-btn").addEventListener("click", () => {
  const t = isDark() ? "light" : "dark";
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem("nbap-theme", t); } catch (e) {}
  syncThemeBtn();
});
darkMQ.addEventListener?.("change", syncThemeBtn);
syncThemeBtn();

getJSON("data/index.json").then(d => {
  INDEX = d;
  const dates = [...new Set(d.games.map(g => g.date))].sort().reverse();
  DAY = dates[0];
  const todays = d.games.filter(g => g.date === DAY);
  const nCup = todays.filter(isCup).length;
  $("#n-reg").textContent = todays.length - nCup || ""; $("#n-cup").textContent = nCup || "";
  const gen = toDate(d.generated);
  $("#meta").innerHTML = `Jornada ${esc(DAY)} · ${todays.length} partidos<br>Actualizado ${gen ? esc(whenTxt(gen)) : ""}${d.last_stage ? ` · ${esc(STAGE[d.last_stage] || "")}` : ""}`;
  const prevDay = dates[1], prev = prevDay ? d.games.filter(g => g.date === prevDay) : [];
  setupTicker();
  renderTicker(prev, todays);
  let rw; addEventListener("resize", () => { clearTimeout(rw); rw = setTimeout(() => { renderTicker(prev, todays); markTicker(location.hash.slice(1)); }, 250); });
  route();
  drawCombo();
  window.addEventListener("hashchange", route);
}).catch(e => { $("#app").innerHTML = `<p>No se pudo cargar <code>data/index.json</code>. Ejecuta <code>python build_site.py</code> para generarlo.</p>`; });
</script>
