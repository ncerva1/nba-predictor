<!doctype html><html lang="es"><meta charset="utf-8">
<title>NBA Predictor</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: banner con el título, barra de partidos en movimiento (clic → análisis), y debajo
   la página activa: inicio (picks con valor + partidos) o el panel de un partido (#id). */
:root {
  --bg: #f3f5f8; --surface: #ffffff; --ink: #141a26; --muted: #5b6577; --line: #dde2ea;
  --accent: #1f4fd1; --accent-soft: #e5ecfc;
  --banner: #0f1b3d; --banner-ink: #f2f5fb; --banner-muted: #a9b5d3; --ticker: #17264f;
  --good: #0f7a4a; --good-soft: #def3e8; --bad: #b4372e; --bad-soft: #f8e3e1;
  --display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e121a; --surface: #161c27; --ink: #e8ecf3; --muted: #95a0b3; --line: #273041;
  --accent: #7d9cff; --accent-soft: #1d2945;
  --banner: #0a1230; --banner-ink: #f2f5fb; --banner-muted: #93a1c4; --ticker: #111c40;
  --good: #4fd193; --good-soft: #143326; --bad: #ff8a80; --bad-soft: #3a1d1c; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0e121a; --surface: #161c27; --ink: #e8ecf3; --muted: #95a0b3; --line: #273041;
  --accent: #7d9cff; --accent-soft: #1d2945;
  --banner: #0a1230; --banner-ink: #f2f5fb; --banner-muted: #93a1c4; --ticker: #111c40;
  --good: #4fd193; --good-soft: #143326; --bad: #ff8a80; --bad-soft: #3a1d1c; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body); margin: 0 }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.inner { max-width: 1080px; margin: 0 auto }
h1, h2, h3 { font-family: var(--display); font-weight: 700; letter-spacing: .01em; margin: 0; text-wrap: balance; line-height: 1.05 }
h1 { font-size: clamp(34px, 6vw, 52px); text-transform: uppercase }
h2 { font-size: 28px; text-transform: uppercase }
h3 { font-size: 20px }
.eyebrow { font: 500 12px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted) }
.muted { color: var(--muted) }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums }
a { color: var(--accent) }

/* banner */
.banner { background: var(--banner); color: var(--banner-ink) }
.banner .inner { padding-block: 26px 22px; display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: flex-end; justify-content: space-between }
.banner a.brand { color: inherit; text-decoration: none; display: grid; gap: 4px }
.banner .brand span { font: 500 12px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--banner-muted) }
.banner h1 { font-size: clamp(38px, 7vw, 60px) }
.banner .meta { font: 500 12px var(--mono); color: var(--banner-muted); letter-spacing: .04em; text-align: right }

/* barra de partidos */
.ticker { background: var(--ticker); border-top: 1px solid rgba(255,255,255,.08); overflow: hidden; position: relative }
.ticker-track { display: flex; gap: 10px; width: max-content; padding-block: 10px; animation: slide var(--dur, 60s) linear infinite }
.ticker:hover .ticker-track, .ticker:focus-within .ticker-track { animation-play-state: paused }
@keyframes slide { from { transform: translateX(0) } to { transform: translateX(-50%) } }
.chip { display: grid; grid-template-columns: auto auto; gap: 0 14px; align-items: center; text-decoration: none; color: var(--banner-ink);
  background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12); border-radius: 8px; padding: 7px 12px; min-width: 190px; transition: background .15s, border-color .15s }
.chip:hover, .chip:focus-visible { background: rgba(255,255,255,.14); border-color: var(--banner-ink); outline: none }
.chip.active { border-color: var(--banner-ink) }
.chip .t { font: 700 19px/1.15 var(--display); letter-spacing: .03em }
.chip .s { font: 500 13px/1.3 var(--mono); text-align: right }
.chip .x { font: 500 11px var(--mono); color: var(--banner-muted); grid-column: 1 / -1 }
.chip .v { color: #7fe3b0 }
.ticker-hint { position: absolute; right: 0; top: 0; bottom: 0; width: 48px; background: linear-gradient(to right, transparent, var(--ticker)); pointer-events: none }

main.wrap { padding-block: 28px 64px }
main .inner { display: grid; gap: 30px }
.section { display: grid; gap: 12px }
.section > p { margin: 0 }
.lede { max-width: 70ch; color: var(--muted) }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px; min-width: 0 }
.tbl-wrap { overflow-x: auto; min-width: 0 }
table { border-collapse: collapse; width: 100%; font-size: 14px }
th { text-align: left; font: 500 11px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted);
  padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap }
td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: middle }
tr:last-child td { border-bottom: 0 }
td.r, th.r { text-align: right }
tr.link { cursor: pointer }
tr.link:hover td { background: var(--accent-soft) }
.pill { display: inline-block; font: 600 11px var(--mono); letter-spacing: .04em; padding: 2px 8px; border-radius: 999px; white-space: nowrap }
.pill.value { background: var(--good-soft); color: var(--good) }
.pill.neg { background: var(--bad-soft); color: var(--bad) }
.pill.flat { background: var(--accent-soft); color: var(--accent) }
.kind { font: 500 11px var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .05em }
.legend-row { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)) }
.legend-item { display: grid; gap: 4px; font-size: 13px; color: var(--muted) }
.legend-item .pill { justify-self: start }
details.howto { font-size: 14px; color: var(--muted) }
details.howto summary { cursor: pointer; color: var(--accent); font-weight: 500 }
details.howto dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; margin: 10px 0 0; max-width: 80ch }
details.howto dt { font-weight: 600; color: var(--ink) }
details.howto dd { margin: 0 }
.games { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)) }
.card { display: grid; gap: 12px; text-decoration: none; color: inherit; background: var(--surface);
  border: 1px solid var(--line); border-radius: 10px; padding: 16px; transition: border-color .15s }
.card:hover, .card:focus-visible { border-color: var(--accent); outline: none }
.matchup { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: baseline }
.team { font: 700 26px/1 var(--display); letter-spacing: .02em }
.score { font: 500 18px var(--mono) }
.bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; display: flex }
.bar i { background: var(--accent); display: block }
.mini { display: grid; gap: 4px; font-size: 13px }
.mini div { display: flex; justify-content: space-between; gap: 8px }
.cta { font: 500 13px var(--mono); color: var(--accent) }
.back { font: 500 13px var(--mono); text-decoration: none }
.hero { display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)) }
.stat { display: grid; gap: 2px }
.stat b { font: 700 34px/1 var(--display) }
.notes { margin: 0; padding-left: 18px; color: var(--muted); display: grid; gap: 4px; max-width: 80ch }
.grid2 { display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)) }
.chart text { fill: var(--muted); font: 11px var(--mono) }
.filters { display: flex; flex-wrap: wrap; gap: 8px }
.filters button { font: 500 12px var(--mono); padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink); cursor: pointer }
.filters button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--surface) }
.filters button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.more { display: block; margin-top: 4px; font: 500 11px var(--mono); color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline }
tr.detail td { background: var(--bg) }
.books { display: flex; flex-wrap: wrap; gap: 6px }
.book { font: 12px var(--mono); border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 3px 8px; white-space: nowrap }
.book i { font-style: normal; color: var(--muted) }
.book.good i { color: var(--good) } .book.bad i { color: var(--bad) }
.res { font: 600 11px var(--mono); letter-spacing: .04em; padding: 2px 8px; border-radius: 999px; white-space: nowrap }
.res.won { background: var(--good-soft); color: var(--good) }
.res.lost { background: var(--bad-soft); color: var(--bad) }
.res.push { background: var(--accent-soft); color: var(--accent) }
.final { font: 500 13px var(--mono) }
.empty { padding: 24px; text-align: center; color: var(--muted) }
.foot { font-size: 13px; color: var(--muted); max-width: 80ch; margin: 0 }
@media (max-width: 640px) {
  .hide-sm { display: none }
  table.stack thead { display: none }
  table.stack, table.stack tbody { display: block }
  table.stack tr { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 16px; padding: 12px 0; border-bottom: 1px solid var(--line) }
  table.stack tr:last-child { border-bottom: 0 }
  table.stack td { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 0; border: 0; text-align: right }
  table.stack td::before { content: attr(data-label); font: 500 10px var(--mono); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); text-align: left }
  table.stack td.head { grid-column: 1 / -1; display: block; text-align: left; font-weight: 600 }
  table.stack td.head::before, table.stack td.r-sm::before { content: none }
  table.stack td.r-sm { grid-column: 1 / -1; display: block; text-align: left; padding-top: 4px; border-top: 1px dashed var(--line) }
  table.stack td.r-sm::before { content: "Mejor casa"; display: block; font: 500 10px var(--mono); letter-spacing: .05em; text-transform: uppercase; color: var(--muted) }
  table.stack tr.detail { display: block; padding: 8px 0 12px }
  table.stack tr.detail td { display: block; background: none }
  table.stack tr.detail td::before { content: none }
  tr.link:hover td { background: none }
  table.stack td[data-label="Cuota"] .kind { display: none }
  table.stack td .pill { margin-left: auto }
  .banner .meta { text-align: left }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important }
  .ticker { overflow-x: auto }
  .ticker-track { animation: none }
  .ticker-track .dup { display: none }
}
</style>

<header class="banner gutter">
  <div class="inner">
    <a class="brand" href="#"><span>Simulaciones Monte Carlo · NBA</span><h1>NBA Predictor</h1></a>
    <div class="meta" id="meta"></div>
  </div>
</header>
<nav class="ticker gutter" id="ticker" aria-label="Partidos del día"><div class="ticker-track" id="track"></div><div class="ticker-hint"></div></nav>
<main class="wrap gutter"><div class="inner" id="app"><p class="muted">Cargando partidos…</p></div></main>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const pct = (p, d = 1) => (p * 100).toFixed(d) + "%";
const dec = o => (o > 0 ? 1 + o / 100 : 1 + 100 / -o).toFixed(2);   // americana → decimal
const fairDec = p => p > 0 ? (1 / p).toFixed(2) : "—";               // cuota justa = 1 / prob
const evTxt = ev => (ev >= 0 ? "+" : "") + (ev * 100).toFixed(1) + "%";
const KIND = { ml: "Ganador", spread: "Hándicap", total: "Total de puntos", prop: "Player prop" };
let INDEX = null, DAY = null;
const cache = {};

async function getJSON(u) { const r = await fetch(u, { cache: "no-store" }); if (!r.ok) throw new Error(u + " " + r.status); return r.json(); }

function evPill(ev, thr) {
  if (ev >= thr) return `<span class="pill value">${evTxt(ev)}</span>`;
  if (ev >= 0) return `<span class="pill flat">${evTxt(ev)}</span>`;
  return `<span class="pill neg">${evTxt(ev)}</span>`;
}

const legend = thr => `<div class="legend-row">
  <div class="legend-item"><span class="pill value">Verde · EV ≥ +${(thr * 100).toFixed(0)}%</span>Pick con valor: el modelo ve el resultado más probable de lo que paga la cuota.</div>
  <div class="legend-item"><span class="pill flat">Azul · EV 0 a +${(thr * 100).toFixed(0)}%</span>Ligeramente a favor, pero el margen es tan pequeño que no se recomienda.</div>
  <div class="legend-item"><span class="pill neg">Rojo · EV negativo</span>La cuota paga menos de lo que vale según el modelo. Evitar.</div>
</div>`;

const howto = `<details class="howto"><summary>¿Cómo leer esta tabla?</summary><dl>
  <dt>Cuota</dt><dd>Cuota decimal promedio de las casas que ofrecen la línea más repetida (la de consenso): lo que recibes por cada 1 apostado, incluido lo apostado. Un * indica que no hubo cuota publicada y se asume 1.91.</dd>
  <dt>Prob. modelo</dt><dd>Porcentaje de las simulaciones en que gana la apuesta.</dd>
  <dt>Prob. casa</dt><dd>Probabilidad que implica la cuota (1 / cuota), con el margen de la casa incluido.</dd>
  <dt>Cuota justa</dt><dd>La cuota que haría la apuesta neutra según el modelo (1 / prob. modelo). Si la casa paga más que esto, hay valor.</dd>
  <dt>EV</dt><dd>Ganancia esperada por cada 100 apostados con la cuota promedio. +10% significa ganar 10 de media por cada 100 a largo plazo. El color se decide con esta cuota promedio.</dd>
  <dt>Mejor casa</dt><dd>La casa donde la apuesta rinde más según el modelo, a veces con una línea distinta (por ejemplo -13.5 en vez de -14.5). En la página de cada partido puedes ver todas las casas.</dd>
</dl></details>`;

const lineTxt = (b, l) => l == null ? "" : (b.kind === "total" ? `${l} ` : `${l > 0 ? "+" : ""}${l} `);
function bestCell(b, thr) {
  if (!b.best) return `<span class="muted">—</span>`;
  const o = b.best, other = o.line !== b.line;
  return `<div class="num">${esc(o.book)}</div><div class="kind">${other ? esc(lineTxt(b, o.line)) + "@ " : "@ "}${o.dec.toFixed(2)} · EV ${evTxt(o.ev)}</div>`;
}
function bookList(b) {
  return `<div class="books">${b.books.map(o => `<span class="book${o.ev >= INDEX.value_ev ? " good" : o.ev < 0 ? " bad" : ""}"><b>${esc(o.book)}</b> ${esc(lineTxt(b, o.line))}@ ${o.dec.toFixed(2)} <i>${evTxt(o.ev)}</i></span>`).join("")}</div>`;
}
const RES = { won: "Ganada", lost: "Perdida", push: "Nula" };
const resPill = r => r ? `<span class="res ${r}">${RES[r]}</span>` : "";
function betRows(bets, thr, withGame) {
  const withRes = bets.some(b => b.result);
  return bets.map((b, i) => `<tr${withGame ? ` class="link" data-go="${b._gid}"` : ""}>
    ${withGame ? `<td class="head"><a href="#${b._gid}">${esc(b._game)}</a></td>` : ""}
    <td class="head"><div>${esc(b.label)}</div><div class="kind">${KIND[b.kind] || b.kind}</div>${!withGame && b.books ? `<button type="button" class="more" id="more-${i}" data-i="${i}" aria-expanded="false">Ver ${b.books.length} casas</button>` : ""}</td>
    <td class="r num" data-label="Cuota">${(b.dec || +dec(b.odds)).toFixed(2)}${b.odds_assumed ? "*" : ""}${b.n_books ? `<div class="kind">prom. ${b.n_books} casa${b.n_books > 1 ? "s" : ""}</div>` : ""}</td>
    <td class="r num" data-label="Prob. modelo">${pct(b.p)}</td>
    <td class="r num" data-label="Prob. casa">${pct(b.implied)}</td>
    <td class="r num" data-label="Cuota justa">${fairDec(b.p)}</td>
    <td class="r" data-label="EV">${evPill(b.ev, thr)}</td>
    <td class="r-sm" data-label="Mejor casa">${bestCell(b, thr)}</td>${withRes ? `<td class="r" data-label="Resultado">${resPill(b.result)}</td>` : ""}</tr>
    ${!withGame && b.books ? `<tr class="detail" id="det-${i}" hidden><td colspan="${withRes ? 9 : 8}">${bookList(b)}</td></tr>` : ""}`).join("");
}
const betHead = (withGame, withRes) => `<thead><tr>${withGame ? "<th>Partido</th>" : ""}<th>Pick</th><th class="r">Cuota</th>
  <th class="r">Prob. modelo</th><th class="r">Prob. casa</th><th class="r">Cuota justa</th><th class="r">EV</th><th>Mejor casa</th>${withRes ? '<th class="r">Resultado</th>' : ""}</tr></thead>`;

function chip(g, dup) {
  const fav = g.win_prob[g.away] >= g.win_prob[g.home] ? g.away : g.home;
  return `<a class="chip" href="#${g.id}" data-id="${g.id}"${dup ? ' aria-hidden="true" tabindex="-1"' : ""}>
    <span class="t">${esc(g.away)} @ ${esc(g.home)}</span><span class="s">${g.proj[g.away]}–${g.proj[g.home]}</span>
    <span class="x">${g.tip_et ? esc(g.tip_et) + " ET · " : ""}${esc(fav)} ${pct(g.win_prob[fav], 0)}${g.n_value ? ` · <span class="v">${g.n_value} pick${g.n_value > 1 ? "s" : ""}</span>` : ""}</span></a>`;
}

function renderTicker(todays) {
  const one = todays.map(g => chip(g, false)).join("");
  $("#track").innerHTML = one + `<span class="dup" style="display:contents">${todays.map(g => chip(g, true)).join("")}</span>`;
  $("#track").style.setProperty("--dur", Math.max(25, todays.length * 7) + "s");
}

function markTicker(id) { document.querySelectorAll(".chip").forEach(c => c.classList.toggle("active", c.dataset.id === id)); }

function renderIndex() {
  const thr = INDEX.value_ev;
  const todays = INDEX.games.filter(g => g.date === DAY);
  const picks = todays.flatMap(g => (g.value_bets || g.top_bets.filter(b => b.value)).map(b => ({ ...b, _gid: g.id, _game: `${g.away} @ ${g.home}` })))
    .sort((a, b) => b.ev - a.ev);
  const older = INDEX.games.filter(g => g.date !== DAY);
  const hist = INDEX.history || [];
  const tot = hist.reduce((t, x) => ({ w: t.w + x.picks_won, l: t.l + x.picks_lost, u: t.u + x.units, g: t.g + x.games, ok: t.ok + x.winners_ok }), { w: 0, l: 0, u: 0, g: 0, ok: 0 });
  const uTxt = u => `${u >= 0 ? "+" : ""}${u.toFixed(2)} u`;
  $("#app").innerHTML = `
  ${hist.length ? `<section class="section">
    <h2>Cómo le ha ido al modelo</h2>
    <p class="lede">Picks con valor (EV ≥ +${(thr * 100).toFixed(0)}%) publicados antes de cada partido y liquidados con el resultado real. Unidades = ganancia apostando 1 a cada pick con la cuota promedio. ${tot.w + tot.l < 100 ? "Con tan pocos picks el resultado es sobre todo suerte: hacen falta cientos para juzgar el modelo." : ""}</p>
    <div class="panel tbl-wrap"><table class="stack"><thead><tr><th>Jornada</th><th class="r">Ganador acertado</th><th class="r">Picks ganados–perdidos</th><th class="r">Unidades</th></tr></thead><tbody>
      ${hist.map(x => `<tr><td class="head">${esc(x.date)}</td><td class="r num" data-label="Ganador acertado">${x.winners_ok} de ${x.games}</td><td class="r num" data-label="Picks">${x.picks_won}–${x.picks_lost}</td><td class="r num" data-label="Unidades">${uTxt(x.units)}</td></tr>`).join("")}
      ${hist.length > 1 ? `<tr><td class="head"><b>Total</b></td><td class="r num" data-label="Ganador acertado">${tot.ok} de ${tot.g}</td><td class="r num" data-label="Picks">${tot.w}–${tot.l}</td><td class="r num" data-label="Unidades">${uTxt(tot.u)}</td></tr>` : ""}
    </tbody></table></div>
  </section>` : ""}
  <section class="section">
    <span class="eyebrow">Jornada ${esc(DAY)}</span>
    <h2>${todays.some(g => g.result) ? "Picks con valor de la jornada" : "Picks con valor de hoy"}</h2>
    <p class="lede">${picks.length} pick${picks.length === 1 ? "" : "s"} en ${todays.length} partidos donde la probabilidad del modelo supera a la que paga la casa. Ordenados de mayor a menor valor esperado (EV). Toca una fila para ver el análisis del partido.</p>
    ${legend(thr)}
    <div class="panel tbl-wrap">${picks.length ? `<table class="stack">${betHead(true, picks.some(b => b.result))}<tbody>${betRows(picks, thr, true)}</tbody></table>` : `<div class="empty">Hoy el modelo no encuentra picks con EV ≥ +${(thr * 100).toFixed(0)}%.</div>`}</div>
    ${howto}
  </section>
  <section class="section">
    <h2>${todays.some(g => g.result) ? "Partidos de la jornada" : "Partidos de hoy"}</h2>
    <div class="games">${todays.map(card).join("") || `<div class="empty">No hay partidos para esta jornada.</div>`}</div>
  </section>
  ${older.length ? `<section class="section"><h2>Jornadas anteriores</h2><div class="games">${older.reverse().map(card).join("")}</div></section>` : ""}
  <p class="foot">EV alto (+15% o más) al inicio de temporada suele indicar que al modelo le falta información (lesiones, rotaciones); revisa el contexto del partido antes de apostar. Herramienta de análisis, no consejo de apuesta.</p>`;
  document.querySelectorAll("tr.link").forEach(tr => tr.addEventListener("click", e => { if (e.target.tagName !== "A") location.hash = tr.dataset.go; }));
}

function card(g) {
  const pa = g.win_prob[g.away], ph = g.win_prob[g.home], r = g.result;
  return `<a class="card" href="#${g.id}">
    <span class="eyebrow">${esc(g.date)}${g.tip_et ? " · " + esc(g.tip_et) + " ET" : ""}</span>
    <div class="matchup">
      <span class="team">${esc(g.away)} <span class="muted num" style="font-size:13px">${esc(g.records?.[g.away] || "")}</span></span><span class="score">${g.proj[g.away]}</span>
      <span class="team">@ ${esc(g.home)} <span class="muted num" style="font-size:13px">${esc(g.records?.[g.home] || "")}</span></span><span class="score">${g.proj[g.home]}</span>
    </div>
    ${r ? `<div class="final">Final ${r.score[g.away]}–${r.score[g.home]}${r.ot ? " (OT)" : ""} · ${resPill(r.winner_ok ? "won" : "lost").replace(/Ganada|Perdida/, r.winner_ok ? "Ganador acertado" : "Ganador fallado")}</div>` : ""}
    <div class="bar" aria-label="Probabilidad de victoria"><i style="width:${pa * 100}%"></i></div>
    <div class="mini">
      <div><span>Victoria ${esc(g.away)} / ${esc(g.home)}</span><span class="num">${pct(pa, 0)} / ${pct(ph, 0)}</span></div>
      <div><span>Total proyectado</span><span class="num">${g.proj_total}</span></div>
      <div><span>Picks con valor</span><span class="num">${r && g.n_value ? `${r.picks_won}–${r.picks_lost} (${r.units >= 0 ? "+" : ""}${r.units.toFixed(2)} u)` : g.n_value}</span></div>
    </div>
    <span class="cta">Ver análisis →</span>
  </a>`;
}

function histogram(h, away, home) {
  const W = 520, H = 170, pad = 26, n = h.length, max = Math.max(...h, 1), bw = (W - pad * 2) / n;
  const bars = h.map((v, i) => {
    const lo = -40 + i * 4, x = pad + i * bw, bh = (v / max) * (H - 44);
    return `<rect x="${x + 1}" y="${H - 24 - bh}" width="${bw - 2}" height="${bh}" rx="2" fill="${lo >= 0 ? "var(--accent)" : "var(--muted)"}" opacity="${lo >= 0 ? 1 : .55}"><title>${away} ${lo} a ${lo + 4}: ${v}</title></rect>`;
  }).join("");
  const ticks = [-40, -20, 0, 20, 40].map(t => `<text x="${pad + ((t + 40) / 4) * bw}" y="${H - 6}" text-anchor="middle">${t > 0 ? "+" + t : t}</text>`).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Distribución del margen">
    <line x1="${pad + 10 * bw}" x2="${pad + 10 * bw}" y1="8" y2="${H - 24}" stroke="var(--line)" />
    ${bars}${ticks}
    <text x="${W - pad}" y="14" text-anchor="end">gana ${esc(away)} →</text><text x="${pad}" y="14">← gana ${esc(home)}</text></svg>`;
}

async function renderGame(id) {
  const thr = INDEX.value_ev;
  let d = cache[id];
  if (!d) { try { d = cache[id] = await getJSON(`data/${id}.json`); } catch (e) { $("#app").innerHTML = `<a class="back" href="#">← Inicio</a><p>No se encontró el partido ${esc(id)}.</p>`; return; } }
  const g = d.game, s = d.summary, a = g.away, h = g.home, mk = d.market || {};
  const sc = Object.entries(s.scenarios);
  const players = [...s.players];
  const nVal = d.bets.filter(b => b.ev >= thr).length;
  $("#app").innerHTML = `
  <a class="back" href="#">← Inicio · todos los picks</a>
  <header class="section">
    <span class="eyebrow">${esc(g.date)}${g.tip_et ? " · " + esc(g.tip_et) + " ET" : ""}${g.venue ? " · " + esc(g.venue) : ""}</span>
    <h1>${esc(a)} @ ${esc(h)}</h1>
    <span class="muted">${d.sims.toLocaleString("es")} simulaciones · ${d.used_db ? "con BD de rankings" : "sin BD de rankings"}${mk.source ? " · cuotas: " + esc(mk.source) : ""}</span>
  </header>
  <div class="panel hero">
    ${d.result ? `<div class="stat"><span class="eyebrow">Resultado real</span><b class="num">${d.result.score[a]} – ${d.result.score[h]}${d.result.ot ? " (OT)" : ""}</b><span class="muted">Ganó ${esc(d.result.winner)} · ${d.result.winner_ok ? "el modelo acertó el ganador" : "el modelo falló el ganador"}</span></div>` : ""}
    <div class="stat"><span class="eyebrow">Marcador proyectado</span><b class="num">${s.proj[a]} – ${s.proj[h]}</b><span class="muted">${esc(a)} – ${esc(h)}</span></div>
    <div class="stat"><span class="eyebrow">Victoria ${esc(a)} / ${esc(h)}</span><b class="num">${pct(s.win_prob[a], 0)} / ${pct(s.win_prob[h], 0)}</b><span class="muted">Cuota justa ${fairDec(s.win_prob[a])} / ${fairDec(s.win_prob[h])}${mk.ml_away ? ` · casa ${dec(mk.ml_away)} / ${dec(mk.ml_home)}` : ""}</span></div>
    <div class="stat"><span class="eyebrow">Total de puntos</span><b class="num">${s.proj_total}</b><span class="muted">${mk.total ? `línea ${mk.total} · over ${pct(s.p_over, 0)}` : "sin línea"} · ritmo ${s.pace}</span></div>
    <div class="stat"><span class="eyebrow">Paliza 20+ / prórroga</span><b class="num">${pct(s.p_blowout_any, 0)} / ${pct(s.p_ot, 0)}</b><span class="muted">${esc(a)} ${pct(s.p_blowout_by[a], 0)} · ${esc(h)} ${pct(s.p_blowout_by[h], 0)}</span></div>
  </div>
  <section class="section">
    <h2>Apuestas de este partido</h2>
    <p class="lede">${nVal ? `${nVal} pick${nVal > 1 ? "s" : ""} con valor (en verde).` : "Ningún pick con valor en este partido."} Todas las apuestas con cuota, ordenadas por EV.</p>
    ${legend(thr)}
    <div class="panel tbl-wrap">${d.bets.length ? `<table class="stack">${betHead(false, d.bets.some(b => b.result))}<tbody>${betRows(d.bets, thr, false)}</tbody></table>` : `<div class="empty">Sin cuotas cargadas para este partido.</div>`}</div>
    ${howto}
  </section>
  <div class="grid2">
    <section class="panel section"><h3>Margen final (${esc(a)} − ${esc(h)})</h3>${histogram(s.margin_hist, a, h)}</section>
    <section class="panel section"><h3>Escenarios</h3>
      <table>${sc.map(([k, v]) => `<tr><td>${esc(k)}</td><td class="r num">${pct(v)}</td></tr>`).join("")}
      <tr><td>Total de puntos (rango 10–90%)</td><td class="r num">${s.total_pcts[10]} – ${s.total_pcts[90]}</td></tr></table></section>
  </div>
  <section class="section">
    <h2>Player props proyectados</h2>
    <div class="filters" role="group" aria-label="Estadística">${["pts", "reb", "ast", "fg3m", "pra"].map((k, i) =>
      `<button type="button" id="f-${k}" data-k="${k}" aria-pressed="${i === 0}">${{ pts: "Puntos", reb: "Rebotes", ast: "Asistencias", fg3m: "Triples", pra: "PTS+REB+AST" }[k]}</button>`).join("")}</div>
    <div class="panel tbl-wrap" id="props"></div>
    <p class="foot">Media = promedio en las simulaciones. Rango = lo que hace en 8 de cada 10 partidos simulados. Línea justa = línea .5 más cercana a la media; P(over) = probabilidad de superarla. Si la casa publicó línea, se muestra con su cuota decimal y EV.</p>
  </section>
  ${(g.notes || []).length ? `<section class="section"><h2>Contexto</h2><ul class="notes">${g.notes.map(n => `<li>${esc(n)}</li>`).join("")}</ul></section>` : ""}`;
  const draw = k => {
    document.querySelectorAll(".filters button").forEach(b => b.setAttribute("aria-pressed", b.dataset.k === k));
    const rows = [...players].sort((x, y) => x.team === y.team ? y[k].mean - x[k].mean : (x.team === a ? -1 : 1));
    const played = players.some(p => p.actual !== undefined);
    $("#props").innerHTML = `<table class="stack"><thead><tr><th>Jugador</th><th class="r">Min</th><th class="r">Media</th><th class="r">Rango</th><th class="r">Línea justa</th><th class="r">P(over)</th><th class="r">Casa</th>${played ? '<th class="r">Real</th>' : ""}</tr></thead><tbody>
    ${rows.map(p => { const st = p[k], m = st.market; return `<tr><td class="head">${esc(p.name)} <span class="muted">${esc(p.pos)} · ${esc(p.team)}</span></td>
      <td class="r num" data-label="Minutos">${p.min}</td><td class="r num" data-label="Media"><b>${st.mean}</b></td><td class="r num" data-label="Rango">${st.p10}–${st.p90}</td><td class="r num" data-label="Línea justa">${st.line}</td>
      <td class="r num" data-label="P(over)">${pct(st.p_over, 0)}</td><td class="r num" data-label="Casa">${m ? `O ${m.line} @ ${dec(m.odds)} ${evPill(m.p_over * (dec(m.odds) - 1) - (1 - m.p_over), thr)}` : "—"}</td>${played ? `<td class="r num" data-label="Real">${p.actual ? `<b>${p.actual[k]}</b> ${resPill(p.actual[k] > st.line ? "won" : "lost").replace(/Ganada|Perdida/, p.actual[k] > st.line ? "over" : "under")}` : '<span class="muted">no jugó</span>'}</td>` : ""}</tr>`; }).join("")}</tbody></table>`;
  };
  document.querySelectorAll(".filters button").forEach(b => b.addEventListener("click", () => draw(b.dataset.k)));
  document.querySelectorAll("button.more").forEach(btn => btn.addEventListener("click", () => {
    const row = $("#det-" + btn.dataset.i), open = row.hidden;
    row.hidden = !open; btn.setAttribute("aria-expanded", open);
    btn.textContent = open ? "Ocultar casas" : `Ver ${d.bets[btn.dataset.i].books.length} casas`;
  }));
  draw("pts");
}

function route() {
  const id = location.hash.slice(1);
  window.scrollTo(0, 0);
  const isGame = id && INDEX.games.some(g => g.id === id);
  markTicker(isGame ? id : null);
  if (isGame) renderGame(id); else renderIndex();
}

getJSON("data/index.json").then(d => {
  INDEX = d;
  DAY = [...new Set(d.games.map(g => g.date))].sort().reverse()[0];
  const todays = d.games.filter(g => g.date === DAY);
  $("#meta").innerHTML = `Jornada ${esc(DAY)} · ${todays.length} partidos<br>Actualizado ${esc((d.generated || "").replace("T", " ").replace("+00:00", ""))} UTC`;
  renderTicker(todays);
  route();
  window.addEventListener("hashchange", route);
}).catch(e => { $("#app").innerHTML = `<p>No se pudo cargar <code>data/index.json</code>. Ejecuta <code>python build_site.py</code> para generarlo.</p>`; });
</script>
