<link rel="preconnect" href="https://fonts.googleapis.com">

<script>
// Tema claro/oscuro: se aplica antes de pintar para que no parpadee. Sin preferencia guardada sigue al sistema.
try { const t = localStorage.getItem("nbap-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<style>
/* Layout: banner con el título y las pestañas (Liga regular / NBA Cup), barra de partidos en movimiento
   (clic → análisis), y debajo la página activa: inicio de la pestaña o el panel de un partido (#id).
   Paleta: azul y rojo NBA en la liga regular; negro, oro y plata en la NBA Cup (data-mode="cup"). */
:root {
  --bg: #f2f4f8; --surface: #ffffff; --ink: #0b1630; --muted: #586379; --line: #dce1ea;
  --accent: #1d428a; --accent-soft: #e2e9f6; --hot: #c8102e; --on-accent: #ffffff;
  --banner: #0b1a3a; --banner-2: #1d428a; --banner-ink: #f4f6fb; --banner-muted: #aab6d3; --ticker: #08122a; --stripe: #c8102e;
  --good: #0a7d4b; --good-soft: #dcf2e6; --bad: #b3122b; --bad-soft: #f9e1e4;
  --display: "Oswald", "Arial Narrow", system-ui, sans-serif;
  --body: "Roboto", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Roboto Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #060b17; --surface: #0e1628; --ink: #eef2f9; --muted: #93a0b8; --line: #1e2a42;
  --accent: #6f9bff; --accent-soft: #152449; --hot: #ff4d5e; --on-accent: #060b17;
  --banner: #050a18; --banner-2: #12285a; --banner-ink: #f4f6fb; --banner-muted: #93a1c4; --ticker: #03070f; --stripe: #e0213f;
  --good: #47d08f; --good-soft: #10301f; --bad: #ff7b86; --bad-soft: #3a141b; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #060b17; --surface: #0e1628; --ink: #eef2f9; --muted: #93a0b8; --line: #1e2a42;
  --accent: #6f9bff; --accent-soft: #152449; --hot: #ff4d5e; --on-accent: #060b17;
  --banner: #050a18; --banner-2: #12285a; --banner-ink: #f4f6fb; --banner-muted: #93a1c4; --ticker: #03070f; --stripe: #e0213f;
  --good: #47d08f; --good-soft: #10301f; --bad: #ff7b86; --bad-soft: #3a141b; color-scheme: dark }
/* NBA Cup: tablero negro, oro del trofeo y plata */
:root[data-mode="cup"] {
  --bg: #f5f2ea; --surface: #fffdf8; --ink: #17140c; --muted: #6b6250; --line: #e4dcc8;
  --accent: #8a6412; --accent-soft: #f3e8cc; --hot: #b8892b; --on-accent: #ffffff;
  --banner: #0d0c0a; --banner-2: #2a2316; --banner-ink: #faf6ec; --banner-muted: #c9bc9c; --ticker: #070605; --stripe: #d4a537;
  --display: "Bebas Neue", "Oswald", "Arial Narrow", sans-serif;
}
@media (prefers-color-scheme: dark) { :root[data-mode="cup"]:not([data-theme="light"]) {
  --bg: #0a0907; --surface: #15130e; --ink: #f6f1e4; --muted: #a99f88; --line: #2c271c;
  --accent: #e2b75a; --accent-soft: #2d2412; --hot: #f0c66b; --on-accent: #0a0907;
  --banner: #000000; --banner-2: #241d10; --ticker: #000000; --stripe: #e2b75a } }
:root[data-mode="cup"][data-theme="dark"] {
  --bg: #0a0907; --surface: #15130e; --ink: #f6f1e4; --muted: #a99f88; --line: #2c271c;
  --accent: #e2b75a; --accent-soft: #2d2412; --hot: #f0c66b; --on-accent: #0a0907;
  --banner: #000000; --banner-2: #241d10; --ticker: #000000; --stripe: #e2b75a }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body); margin: 0 }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.inner { max-width: 1080px; margin: 0 auto }
h1, h2, h3 { font-family: var(--display); font-weight: 700; letter-spacing: .01em; margin: 0; text-wrap: balance; line-height: 1.05 }
h1 { font-size: clamp(34px, 6vw, 52px); text-transform: uppercase }
h2 { font-size: 28px; text-transform: uppercase }
h3 { font-size: 20px }
.eyebrow { font: 500 12px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted) }
.muted { color: var(--muted) }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums }
a { color: var(--accent) }

/* banner */
.banner { background: linear-gradient(115deg, var(--banner) 0%, var(--banner) 55%, var(--banner-2) 100%); color: var(--banner-ink); position: relative }
.banner::after { content: ""; position: absolute; inset: auto 0 0 0; height: 4px; background: linear-gradient(90deg, var(--stripe) 0 62%, var(--banner-ink) 62% 64%, var(--accent) 64%) }
:root[data-mode="cup"] .banner::after { background: linear-gradient(90deg, #7a5a14, var(--stripe) 30%, #f6e2a6 55%, var(--stripe) 75%, #7a5a14) }
.banner .inner { padding-block: 22px 0; display: flex; flex-wrap: wrap; gap: 10px 24px; align-items: center; justify-content: space-between }
.banner a.brand { color: inherit; text-decoration: none; display: flex; align-items: center; gap: 14px }
.banner .logo { flex: none; width: 52px; height: 52px; border-radius: 12px; display: grid; place-items: center; background: var(--stripe); box-shadow: inset 0 -3px 0 rgba(0,0,0,.25) }
:root[data-mode="cup"] .banner .logo { background: linear-gradient(150deg, #f6e2a6, var(--stripe) 45%, #7a5a14) }
.banner .logo svg { width: 34px; height: 34px }
.banner .brand-t { display: grid; gap: 2px }
.banner .brand-t > span { font: 500 11px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--banner-muted) }
.banner h1 { font-size: clamp(34px, 6vw, 52px); letter-spacing: .02em }
.banner .side { display: flex; align-items: center; gap: 14px; margin-left: auto }
.banner .meta { font: 500 12px var(--mono); color: var(--banner-muted); letter-spacing: .04em; text-align: right }
.theme-btn { flex: none; width: 40px; height: 40px; border-radius: 999px; border: 1px solid rgba(255,255,255,.25); background: rgba(255,255,255,.08);
  color: var(--banner-ink); display: grid; place-items: center; cursor: pointer; transition: background .15s, border-color .15s }
.theme-btn:hover, .theme-btn:focus-visible { background: rgba(255,255,255,.18); border-color: var(--banner-ink); outline: none }
.theme-btn svg { width: 20px; height: 20px }
.theme-btn .moon { display: none }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .theme-btn .moon { display: block } :root:not([data-theme="light"]) .theme-btn .sun { display: none } }
:root[data-theme="dark"] .theme-btn .moon { display: block } :root[data-theme="dark"] .theme-btn .sun { display: none }
/* pestañas: liga regular / NBA Cup */
.tabs { flex-basis: 100%; display: flex; gap: 4px; margin-top: 6px }
.tab { display: flex; align-items: center; gap: 8px; padding: 10px 16px 12px; color: var(--banner-muted); text-decoration: none;
  font: 600 15px/1 var(--display); letter-spacing: .08em; text-transform: uppercase; border-radius: 8px 8px 0 0; position: relative; transition: color .15s, background .15s }
.tab:hover, .tab:focus-visible { color: var(--banner-ink); background: rgba(255,255,255,.06); outline: none }
.tab[aria-current="page"] { color: var(--banner-ink); background: rgba(255,255,255,.1) }
.tab[aria-current="page"]::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: 4px; height: 3px; border-radius: 2px; background: var(--banner-ink) }
.tab.cup-tab { font-family: "Bebas Neue", var(--display); font-size: 19px; font-weight: 400; letter-spacing: .1em }
.tab.cup-tab svg { width: 16px; height: 16px; color: #e2b75a }
.tab.cup-tab[aria-current="page"]::after { background: linear-gradient(90deg, #a77a1c, #f6e2a6, #a77a1c) }
.tab .n:empty { display: none }
.tab .n { font: 600 11px var(--mono); letter-spacing: 0; background: rgba(255,255,255,.14); padding: 2px 6px; border-radius: 999px }
/* colores de cada equipo (TEAM en el script): insignia con la abreviatura y barras de probabilidad */
.tm { display: inline-flex; align-items: center; gap: 8px }
.tm i { width: 10px; height: 10px; border-radius: 3px; background: var(--tc); box-shadow: 0 0 0 1px rgba(128,128,128,.35); flex: none }
.badge { display: inline-grid; place-items: center; min-width: 2.6em; padding: .18em .4em .1em; border-radius: 6px; background: var(--tc); color: var(--tf);
  font: 700 1em/1 var(--display); letter-spacing: .04em; box-shadow: inset 0 -2px 0 rgba(0,0,0,.2), 0 0 0 1px rgba(128,128,128,.25) }
:root[data-mode="cup"] h1, :root[data-mode="cup"] h2, :root[data-mode="cup"] h3 { font-weight: 400; letter-spacing: .03em }
/* barra de partidos */
/* Se mueve sola con JS (scrollLeft), así que también se puede arrastrar, deslizar con el dedo o
   mover con las flechas; se pausa al pasar el ratón o al tocarla y sigue a los pocos segundos. */
.ticker { background: var(--ticker); border-top: 1px solid rgba(255,255,255,.08); position: relative; display: flex; align-items: stretch }
.ticker-scroll { flex: 1; min-width: 0; overflow-x: auto; scrollbar-width: none; cursor: grab; user-select: none; -webkit-user-select: none }
.ticker-scroll::-webkit-scrollbar { display: none }
.ticker-scroll.dragging { cursor: grabbing }
.ticker-track { display: flex; gap: 10px; width: max-content; padding-block: 10px; align-items: stretch }
.tk-btn { flex: none; width: 34px; border: 0; background: var(--ticker); color: var(--banner-ink); font: 700 22px/1 var(--display); cursor: pointer; position: relative; z-index: 1 }
.tk-btn:hover, .tk-btn:focus-visible { background: rgba(255,255,255,.1); outline: none }
.tk-btn.prev { box-shadow: 8px 0 10px -6px rgba(0,0,0,.5) } .tk-btn.next { box-shadow: -8px 0 10px -6px rgba(0,0,0,.5) }
.tk-label { display: grid; place-items: center; writing-mode: vertical-rl; transform: rotate(180deg); font: 600 10px var(--mono); letter-spacing: .1em;
  text-transform: uppercase; color: var(--banner-muted); padding: 0 2px; border-left: 1px solid rgba(255,255,255,.15) }
.chip.done { background: rgba(255,255,255,.03) }
.chip .ok { color: #7fe3b0 } .chip .ko { color: #ffaaa3 }
.chip { display: grid; grid-template-columns: auto auto; gap: 0 14px; align-items: center; text-decoration: none; color: var(--banner-ink);
  background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12); border-radius: 8px; padding: 7px 12px; min-width: 190px; transition: background .15s, border-color .15s }
.chip:hover, .chip:focus-visible { background: rgba(255,255,255,.14); border-color: var(--banner-ink); outline: none }
.chip.active { border-color: var(--banner-ink) }
.chip .t { font: 700 19px/1.15 var(--display); letter-spacing: .03em }
.chip .s { font: 500 13px/1.3 var(--mono); text-align: right }
.chip .x { font: 500 11px var(--mono); color: var(--banner-muted); grid-column: 1 / -1 }
.chip .v { color: #7fe3b0 }
.chip { border-left: 3px solid var(--ca, rgba(255,255,255,.12)) }
.chip.cup { border-color: rgba(226,183,90,.45); border-left-color: #e2b75a; background: rgba(226,183,90,.08) }
/* hoy resalta (fondo más claro, etiqueta HOY); ayer queda atenuado */
.chip.past { opacity: .62 } .chip.past:hover, .chip.past:focus-visible, .chip.past.active { opacity: 1 }
.chip.today { background: rgba(255,255,255,.13); border-color: rgba(255,255,255,.38) }
.chip.today.cup { background: rgba(226,183,90,.16); border-color: rgba(226,183,90,.7) }
.chip .hoy { display: inline-block; background: var(--stripe); color: #fff; font: 700 10px/1.5 var(--mono); letter-spacing: .08em; padding: 0 5px; border-radius: 3px; margin-right: 6px; vertical-align: 1px }
.tk-label.today { background: var(--stripe); color: #fff; font-weight: 700; border-left: 0; border-radius: 4px; padding: 0 4px }
.chip .cupk { color: #e2b75a; font-weight: 600 }

main.wrap { padding-block: 28px 64px }
main .inner { display: grid; gap: 30px }
.section > h2, .section > header > h2 { display: flex; align-items: center; gap: 10px }
.section > h2::before { content: ""; flex: none; width: 6px; height: .82em; border-radius: 2px; background: var(--hot); transform: skewX(-12deg) }
.vs { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px }
.vs .badge { font-size: .9em; min-width: 2.9em }
.vs .at { color: var(--muted); font-size: .6em }
.section { display: grid; gap: 12px }
.section > p { margin: 0 }
.lede { max-width: 70ch; color: var(--muted) }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px; min-width: 0 }
.tbl-wrap { overflow-x: auto; min-width: 0 }
table { border-collapse: collapse; width: 100%; font-size: 14px }
th { text-align: left; font: 500 11px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted);
  padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap }
td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: middle }
tr:last-child td { border-bottom: 0 }
td.r, th.r { text-align: right }
tr.link { cursor: pointer }
tr.link:hover td { background: var(--accent-soft) }
.pill { display: inline-block; font: 600 11px var(--mono); letter-spacing: .04em; padding: 2px 8px; border-radius: 999px; white-space: nowrap }
.pill.value { background: var(--good-soft); color: var(--good) }
.pill.neg { background: var(--bad-soft); color: var(--bad) }
.pill.flat { background: var(--accent-soft); color: var(--accent) }
.kind { font: 500 11px var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .05em }
.legend-row { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)) }
.legend-item { display: grid; gap: 4px; font-size: 13px; color: var(--muted) }
.legend-item .pill { justify-self: start }
details.howto { font-size: 14px; color: var(--muted) }
details.howto summary { cursor: pointer; color: var(--accent); font-weight: 500 }
details.howto dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; margin: 10px 0 0; max-width: 80ch }
details.howto dt { font-weight: 600; color: var(--ink) }
details.howto dd { margin: 0 }
.games { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)) }
.card { display: grid; gap: 12px; text-decoration: none; color: inherit; background: var(--surface); position: relative; overflow: hidden;
  border: 1px solid var(--line); border-radius: 10px; padding: 19px 16px 16px; transition: border-color .15s, transform .15s, box-shadow .15s }
.card::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 4px; background: linear-gradient(90deg, var(--ca, var(--accent)) 50%, var(--ch, var(--hot)) 50%) }
.card:hover { transform: translateY(-2px); box-shadow: 0 8px 22px -12px rgba(0,0,0,.35) }
.card:hover, .card:focus-visible { border-color: var(--accent); outline: none }
.matchup { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: baseline }
.team { font: 700 24px/1 var(--display); letter-spacing: .02em; display: flex; align-items: center; gap: 8px; flex-wrap: wrap }
.team .badge { font-size: 20px }
.score { font: 500 18px var(--mono) }
.bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; display: flex }
.bar i { background: var(--accent); display: block }
.bar.duo { gap: 2px; background: none } .bar.duo i:first-child { border-radius: 3px 0 0 3px } .bar.duo i:last-child { border-radius: 0 3px 3px 0; flex: 1 }
.mini { display: grid; gap: 4px; font-size: 13px }
.mini div { display: flex; justify-content: space-between; gap: 8px }
.cta { font: 500 13px var(--mono); color: var(--accent) }
.back { font: 500 13px var(--mono); text-decoration: none }
.hero { display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)) }
.stat { display: grid; gap: 2px }
.stat b { font: 700 34px/1 var(--display) }
.notes { margin: 0; padding-left: 18px; color: var(--muted); display: grid; gap: 4px; max-width: 80ch }
.grid2 { display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)) }
.chart text { fill: var(--muted); font: 11px var(--mono) }
.filters { display: flex; flex-wrap: wrap; gap: 8px }
.filters + .filters { margin-top: -4px }
.filters .lbl { font: 500 11px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); align-self: center; min-width: 74px }
.filters button { font: 500 12px var(--mono); padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink); cursor: pointer }
.filters button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--surface) }
.filters button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.more { display: block; margin-top: 4px; font: 500 11px var(--mono); color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline }
tr.detail td { background: var(--bg) }
.books { display: flex; flex-wrap: wrap; gap: 6px }
.book { font: 12px var(--mono); border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 3px 8px; white-space: nowrap }
.book i { font-style: normal; color: var(--muted) }
.book.good i { color: var(--good) } .book.bad i { color: var(--bad) }
.co { font: 600 9px var(--mono); letter-spacing: .04em; color: #fff; background: #1a4fa0; border-radius: 3px; padding: 1px 3px; margin-left: 4px; vertical-align: 1px }
.bestco { margin-top: 3px }
.res { font: 600 11px var(--mono); letter-spacing: .04em; padding: 2px 8px; border-radius: 999px; white-space: nowrap }
.res.won { background: var(--good-soft); color: var(--good) }
.res.lost { background: var(--bad-soft); color: var(--bad) }
.res.push { background: var(--accent-soft); color: var(--accent) }
.final { font: 500 13px var(--mono) }
.empty { padding: 24px; text-align: center; color: var(--muted) }
.foot { font-size: 13px; color: var(--muted); max-width: 80ch; margin: 0 }
.h2h-games { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)) }
.h2h-g { display: grid; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px }
.h2h-g .sc { display: grid; grid-template-columns: 1fr auto; font: 600 17px/1.3 var(--mono) }
.h2h-g .sc .w { color: var(--ink) } .h2h-g .sc .l { color: var(--muted); font-weight: 500 }
.h2h-g .ld { font-size: 12px; color: var(--muted) }
.h2h-cell .vals { display: block; font: 11px var(--mono); color: var(--muted) }
/* enfrentamiento según los rankings: todo se colorea desde el punto de vista del equipo que ataca */

.mv-block + .mv-block { margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--line) }
.mv-block h3 small { font: 500 12px var(--body); color: var(--muted); letter-spacing: 0 }
.mv-rows { display: grid; gap: 8px }
.dvp-row { display: grid; grid-template-columns: minmax(130px, 1.3fr) repeat(4, minmax(0, 1fr)); gap: 6px; align-items: stretch }

.dvp-pos b { font: 700 22px/1 var(--display) }
.dvp-pos span { font-size: 12px; color: var(--muted); line-height: 1.3 }
.cell { border-radius: 8px; padding: 6px 8px; background: var(--bg); display: grid; gap: 1px; min-width: 0 }
.cell .k { font: 500 10px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted) }
.cell .v { font: 600 17px/1.15 var(--mono); font-variant-numeric: tabular-nums }
.cell .rk { font: 500 11px var(--mono); color: var(--muted) }
.cell.good { background: var(--good-soft) } .cell.good .rk { color: var(--good) }
.cell.bad { background: var(--bad-soft) } .cell.bad .rk { color: var(--bad) }
.pt-row { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr) minmax(0, 1fr) 120px; gap: 6px 12px; align-items: center;
  padding: 8px 0; border-bottom: 1px solid var(--line) }
.pt-row:last-child { border-bottom: 0 }
.pt-name { display: grid; gap: 4px; min-width: 0 }

.pt-freq { display: flex; align-items: center; gap: 8px; font: 12px var(--mono); color: var(--muted) }
.pt-freq .bar { flex: 1; max-width: 140px }
.pt-cell { display: grid; gap: 1px; font-size: 13px }
.pt-cell .k { font: 500 10px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted) }

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const pct = (p, d = 1) => (p * 100).toFixed(d) + "%";
const dec = o => (o > 0 ? 1 + o / 100 : 1 + 100 / -o).toFixed(2);   // americana → decimal
const fairDec = p => p > 0 ? (1 / p).toFixed(2) : "—";               // cuota justa = 1 / prob
const evTxt = ev => (ev >= 0 ? "+" : "") + (ev * 100).toFixed(1) + "%";
// Colores de cada franquicia (uno vivo por equipo, para que se distingan también en modo oscuro)
const TEAM = { ATL: "#E03A3E", BOS: "#007A33", BKN: "#6E7378", CHA: "#00788C", CHI: "#CE1141", CLE: "#860038", DAL: "#00538C", DEN: "#FEC524",
  DET: "#C8102E", GSW: "#FFC72C", HOU: "#BA0C2F", IND: "#FDBB30", LAC: "#1D428A", LAL: "#552583", MEM: "#5D76A9", MIA: "#98002E", MIL: "#00471B",
  MIN: "#78BE20", NOP: "#85714D", NYK: "#F58426", OKC: "#007AC1", ORL: "#0077C0", PHI: "#006BB6", PHX: "#E56020", POR: "#E03A3E", SAC: "#5A2D81",
  SAS: "#8A8D8F", TOR: "#A6192E", UTA: "#F9A01B", WAS: "#E31837" };

const tf = t => { const h = tc(t), [r, g, b] = [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)); return (r * 299 + g * 587 + b * 114) / 1000 > 150 ? "#111" : "#fff"; };

const isCup = g => g.competition === "cup";
const KIND = { ml: "Ganador", spread: "Hándicap", total: "Total de puntos", prop: "Player prop" };
let INDEX = null, DAY = null;
const cache = {};

async function getJSON(u) { const r = await fetch(u, { cache: "no-store" }); if (!r.ok) throw new Error(u + " " + r.status); return r.json(); }

  if (ev >= thr) return `<span class="pill value">${evTxt(ev)}</span>`;

const howto = `<details class="howto"><summary>¿Cómo leer esta tabla?</summary><dl>
  <dt>Cuota</dt><dd>Cuota decimal promedio de las casas que ofrecen la línea más repetida (la de consenso): lo que recibes por cada 1 apostado, incluido lo apostado. Un * indica que no hubo cuota publicada y se asume 1.91.</dd>

const lineTxt = (b, l) => l == null ? "" : (b.kind === "total" ? `${l} ` : `${l > 0 ? "+" : ""}${l} `);

  const co = b.best_co && b.best_co !== o && b.best_co.book !== o.book ? b.best_co : null;
  return `<div class="num">${esc(o.book)}${coTag(o)}</div><div class="kind">${other ? esc(lineTxt(b, o.line)) + "@ " : "@ "}${o.dec.toFixed(2)} · EV ${evTxt(o.ev)}</div>` +
    (co ? `<div class="kind bestco">En Colombia: ${esc(co.book)} ${co.line !== b.line ? esc(lineTxt(b, co.line)) : ""}@ ${co.dec.toFixed(2)} · EV ${evTxt(co.ev)}</div>` : "");
}
const coTag = o => o.region === "CO" ? `<span class="co" title="Casa de Colombia">CO</span>` : "";
function bookList(b) {
  return `<div class="books">${b.books.map(o => `<span class="book${o.ev >= INDEX.value_ev ? " good" : o.ev < 0 ? " bad" : ""}"><b>${esc(o.book)}</b>${coTag(o)} ${esc(lineTxt(b, o.line))}@ ${o.dec.toFixed(2)} <i>${evTxt(o.ev)}</i></span>`).join("")}</div>`;
}
const RES = { won: "Ganada", lost: "Perdida", push: "Nula" };
const resPill = r => r ? `<span class="res ${r}">${RES[r]}</span>` : "";
function betRows(bets, thr, withGame) {
  const withRes = bets.some(b => b.result);
  return bets.map((b, i) => `<tr${withGame ? ` class="link" data-go="${b._gid}"` : ""}>
    ${withGame ? `<td class="head"><a href="#${b._gid}">${esc(b._game)}</a></td>` : ""}
    <td class="head"><div>${esc(b.label)}</div><div class="kind">${KIND[b.kind] || b.kind}</div>${!withGame && b.books ? `<button type="button" class="more" id="more-${i}" data-i="${i}" aria-expanded="false">Ver ${b.books.length} casas</button>` : ""}</td>
    <td class="r num" data-label="Cuota">${(b.dec || +dec(b.odds)).toFixed(2)}${b.odds_assumed ? "*" : ""}${b.n_books ? `<div class="kind">prom. ${b.n_books} casa${b.n_books > 1 ? "s" : ""}</div>` : ""}</td>
    <td class="r num" data-label="Prob. modelo">${pct(b.p)}</td>
    <td class="r num" data-label="Prob. casa">${pct(b.implied)}</td>
    <td class="r num" data-label="Cuota justa">${fairDec(b.p)}</td>
    <td class="r" data-label="EV">${evPill(b.ev, thr)}</td>
    <td class="r-sm" data-label="Mejor casa">${bestCell(b, thr)}</td>${withRes ? `<td class="r" data-label="Resultado">${resPill(b.result)}</td>` : ""}</tr>
    ${!withGame && b.books ? `<tr class="detail" id="det-${i}" hidden><td colspan="${withRes ? 9 : 8}">${bookList(b)}</td></tr>` : ""}`).join("");
}
const betHead = (withGame, withRes) => `<thead><tr>${withGame ? "<th>Partido</th>" : ""}<th>Pick</th><th class="r">Cuota</th>
  <th class="r">Prob. modelo</th><th class="r">Prob. casa</th><th class="r">Cuota justa</th><th class="r">EV</th><th>Mejor casa</th>${withRes ? '<th class="r">Resultado</th>' : ""}</tr></thead>`;

function chip(g, dup, when = "") {   // when: "past" (ayer) o "today"
  const r = g.result, hid = dup ? ' aria-hidden="true" tabindex="-1"' : "", hoy = when === "today" ? '<span class="hoy">Hoy</span>' : "";
  if (r) return `<a class="chip done ${when}${isCup(g) ? " cup" : ""}" href="#${g.id}" data-id="${g.id}" draggable="false" style="--ca:${tc(g.away)}"${hid}>
    <span class="t">${esc(g.away)} @ ${esc(g.home)}</span><span class="s">${r.score[g.away]}–${r.score[g.home]}</span>
    <span class="x">${hoy}Final${r.ot ? " (OT)" : ""} · ${r.winner_ok ? '<span class="ok">ganador ✓</span>' : '<span class="ko">ganador ✗</span>'}${g.n_value ? ` · picks ${r.picks_won}–${r.picks_lost}` : ""}</span></a>`;
  const fav = g.win_prob[g.away] >= g.win_prob[g.home] ? g.away : g.home;
  return `<a class="chip ${when}${isCup(g) ? " cup" : ""}" href="#${g.id}" data-id="${g.id}" draggable="false" style="--ca:${tc(g.away)}"${hid}>
    <span class="t">${esc(g.away)} @ ${esc(g.home)}</span><span class="s">${g.proj[g.away]}–${g.proj[g.home]}</span>
    <span class="x">${hoy}${isCup(g) ? '<span class="cupk">Cup · </span>' : ""}${g.tip_et ? esc(g.tip_et) + " ET · " : ""}${esc(fav)} ${pct(g.win_prob[fav], 0)}${g.n_value ? ` · <span class="v">${g.n_value} pick${g.n_value > 1 ? "s" : ""}</span>` : ""}</span></a>`;
}

// Barra: resultados de la jornada anterior + partidos de hoy. Se repite 3 veces para poder dar la
// vuelta sin saltos en ambos sentidos; se mantiene siempre dentro de la copia del medio.
const TK = { set: 0, loop: false, pauseUntil: 0, hover: false, drag: null, pos: 0, last: 0 };
const calm = matchMedia("(prefers-reduced-motion: reduce)");
function renderTicker(prev, todays) {
  const sc = $("#tscroll"), tr = $("#track");
  const group = (games, label, dup, when) => games.length ? `<span class="tk-label ${when}"${dup ? ' aria-hidden="true"' : ""}>${label}</span>${games.map(g => chip(g, dup, when)).join("")}` : "";
  const copy = dup => group(prev, prev[0] ? "Ayer · " + prev[0].date.slice(5) : "", dup, "past") + group(todays, todays.some(g => g.result) ? "Jornada" : "Hoy", dup, "today");
  tr.innerHTML = `<span class="tk-copy" style="display:contents">${copy(false)}</span>`;
  const one = tr.scrollWidth;
  TK.loop = !calm.matches && one > sc.clientWidth;
  if (TK.loop) {
    tr.innerHTML = copy(true) + `<span class="tk-mark"></span>` + copy(false) + `<span class="tk-mark"></span>` + copy(true);
    const m = tr.querySelectorAll(".tk-mark");
    TK.set = m[1].offsetLeft - m[0].offsetLeft;
    sc.scrollLeft = TK.pos = m[0].offsetLeft - tr.offsetLeft;
  }
  // arranca mostrando los partidos de hoy (en el bucle, los de la copia del medio)
  const lb = tr.querySelectorAll(".tk-label.today"), hoyLb = lb[TK.loop ? 1 : 0];
  if (hoyLb && prev.length) { sc.scrollLeft = TK.pos = Math.max(0, hoyLb.offsetLeft - tr.offsetLeft - 8); tkPause(4000); }
  $("#tk-prev").hidden = $("#tk-next").hidden = one <= sc.clientWidth;
}
function tkWrap() {   // vuelve a la copia del medio cuando el usuario no está desplazando
  const sc = $("#tscroll");
  if (!TK.loop || TK.drag) return;
  const lo = TK.set * 0.5, hi = TK.set * 1.5 + 1;   // la copia del medio empieza ~en set
  if (sc.scrollLeft < lo) sc.scrollLeft += TK.set; else if (sc.scrollLeft > hi) sc.scrollLeft -= TK.set;
  TK.pos = sc.scrollLeft;
}
const tkPause = (ms = 5000) => { TK.pauseUntil = performance.now() + ms; };
function tkFrame(t) {
  const sc = $("#tscroll"), dt = Math.min(64, t - (TK.last || t)); TK.last = t;
  if (TK.loop && !TK.hover && !TK.drag && t > TK.pauseUntil && !document.hidden) {
    if (Math.abs(sc.scrollLeft - TK.pos) > 2) TK.pos = sc.scrollLeft;   // el usuario la movió
    TK.pos += dt * 0.04;   // 40 px por segundo
    sc.scrollLeft = TK.pos;
    if (sc.scrollLeft > TK.set * 1.5) { sc.scrollLeft -= TK.set; TK.pos -= TK.set; }
  }
  requestAnimationFrame(tkFrame);
}
function setupTicker() {
  const sc = $("#tscroll");
  sc.addEventListener("mouseenter", () => TK.hover = true);
  sc.addEventListener("mouseleave", () => { TK.hover = false; tkPause(1500); });
  ["touchstart", "touchmove", "touchend", "wheel", "focusin"].forEach(e => sc.addEventListener(e, () => tkPause(), { passive: true }));
  let idle;
  sc.addEventListener("scroll", () => { clearTimeout(idle); idle = setTimeout(tkWrap, 180); }, { passive: true });
  // arrastrar con el ratón; si hubo arrastre no se abre el partido al soltar
  sc.addEventListener("pointerdown", e => { if (e.pointerType === "mouse" && e.button === 0) TK.drag = { x: e.clientX, s: sc.scrollLeft, moved: false, id: e.pointerId }; });
  sc.addEventListener("pointermove", e => {
    const d = TK.drag; if (!d) return;
    const dx = e.clientX - d.x;
    if (!d.moved && Math.abs(dx) > 5) { d.moved = true; sc.classList.add("dragging"); sc.setPointerCapture(d.id); }
    if (d.moved) sc.scrollLeft = d.s - dx;
  });
  const end = () => { const d = TK.drag; if (!d) return; TK.drag = null; sc.classList.remove("dragging"); TK.pos = sc.scrollLeft; tkPause(3000); tkWrap();
    if (d.moved) sc.addEventListener("click", ev => { ev.preventDefault(); ev.stopPropagation(); }, { capture: true, once: true }); };
  sc.addEventListener("pointerup", end); sc.addEventListener("pointercancel", end);
  const step = dir => { tkPause(6000); sc.scrollBy({ left: dir * sc.clientWidth * 0.7, behavior: calm.matches ? "auto" : "smooth" }); };
  $("#tk-prev").addEventListener("click", () => step(-1));
  $("#tk-next").addEventListener("click", () => step(1));
  requestAnimationFrame(tkFrame);
}

// Inicio: picks agrupados por partido (por defecto en móvil, donde la lista larga cansa) o lista única por EV
let GROUP = matchMedia("(max-width: 640px)").matches ? "game" : "ev";
const GROUPS = { game: "Por partido", ev: "Lista por EV" };
// Picks segmentados: todos / de equipo (ganador, hándicap, total) / player props
let SEG = "all";
const SEGS = { all: "Todos", team: "Equipo", prop: "Player props" };
const inSeg = (b, k) => k === "all" || (k === "prop" ? b.kind === "prop" : b.kind !== "prop");
function segBar(bets, id) {
  return `<div class="filters" role="group" aria-label="Tipo de pick" id="${id}">${Object.entries(SEGS).map(([k, t]) =>
    `<button type="button" data-seg="${k}" aria-pressed="${k === SEG}">${t} · ${bets.filter(b => inSeg(b, k)).length}</button>`).join("")}</div>`;
}
function bindSeg(id, draw) {
  document.querySelectorAll(`#${id} button`).forEach(b => b.addEventListener("click", () => {
    SEG = b.dataset.seg;
    document.querySelectorAll(`#${id} button`).forEach(x => x.setAttribute("aria-pressed", x.dataset.seg === SEG));

}

function markTicker(id) { document.querySelectorAll(".chip").forEach(c => c.classList.toggle("active", c.dataset.id === id)); }

// Jornadas anteriores: un desplegable por día, solo los últimos OLD_DAYS días con partidos (para que la página no crezca)
const OLD_DAYS = 7;
const DOW = ["dom", "lun", "mar", "mié", "jue", "vie", "sáb"], MON = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];
const dayName = d => { const x = new Date(d + "T12:00:00"); return `${DOW[x.getDay()]} ${x.getDate()} ${MON[x.getMonth()]}`; };
function olderSection(older, cup) {
  const dates = [...new Set(older.map(g => g.date))].sort().reverse(), shown = dates.slice(0, OLD_DAYS);
  if (!shown.length) return "";
  return `<section class="section"><h2>${cup ? "Partidos de Copa anteriores" : "Jornadas anteriores"}</h2>
    <p class="lede">Últimos ${shown.length === 1 ? "día" : shown.length + " días"} con partidos${dates.length > OLD_DAYS ? ` (se muestran solo los ${OLD_DAYS} más recientes)` : ""}. Toca un día para ver sus partidos.</p>
    <div class="pgroups">${shown.map(d => {
      const gs = older.filter(g => g.date === d), rs = gs.filter(g => g.result).map(g => g.result);
      const w = rs.reduce((s, r) => s + r.picks_won, 0), l = rs.reduce((s, r) => s + r.picks_lost, 0), u = rs.reduce((s, r) => s + r.units, 0);
      const info = `${gs.length} partido${gs.length > 1 ? "s" : ""}${rs.length ? ` · ganador ${rs.filter(r => r.winner_ok).length} de ${rs.length} · picks ${w}–${l}` : " · sin resultados"}`;
      return `<details class="pgroup day"><summary><span class="pg-t">${dayName(d)}</span><span class="pg-x">${info}</span>
        <span class="pg-r">${rs.length ? `<span class="pg-n" style="color:var(${u >= 0 ? "--good" : "--bad"})">${u >= 0 ? "+" : ""}${u.toFixed(2)} u</span>` : ""}</span></summary>
        <div class="pg-body"><div class="games">${gs.map(card).join("")}</div></div></details>`;
    }).join("")}</div></section>`;
}

// Inicio de cada pestaña: "reg" = liga regular, "cup" = partidos marcados con "competition": "cup" en games/*.json
const inScope = (g, scope) => (scope === "cup") === isCup(g);
const CUP_HERO = n => `<section class="cup-hero">
    <span class="eyebrow">Torneo dentro de la temporada</span>
    <h2>NBA <em>Cup</em></h2>
    <p>Los partidos de la Copa se analizan por separado de la liga regular: aquí aparecen sus picks, parlays y simulaciones. ${n ? "" : "Todavía no hay partidos de la Copa cargados; en cuanto haya jornada de Copa se verán en esta pestaña."}</p>
    <ol class="cup-steps">
      <li><b>Fase de grupos</b><span>6 grupos de 5 equipos</span></li>
      <li><b>Cuartos de final</b><span>8 clasificados</span></li>
      <li><b>Semifinales</b><span>Las Vegas</span></li>
      <li><b>Final</b><span>Campeón de la Copa</span></li>
    </ol>
  </section>`;
function renderIndex(scope = "reg") {
  const thr = INDEX.value_ev;
  const todays = INDEX.games.filter(g => g.date === DAY && inScope(g, scope));
  const picks = todays.flatMap(g => (g.value_bets || g.top_bets.filter(b => b.value)).map(b => ({ ...b, _gid: g.id, _game: `${g.away} @ ${g.home}` })))
    .sort((a, b) => b.ev - a.ev);
  const older = INDEX.games.filter(g => g.date !== DAY && inScope(g, scope));
  const hist = scope === "cup" ? [] : INDEX.history || [];
  const tot = hist.reduce((t, x) => ({ w: t.w + x.picks_won, l: t.l + x.picks_lost, u: t.u + x.units, g: t.g + x.games, ok: t.ok + x.winners_ok }), { w: 0, l: 0, u: 0, g: 0, ok: 0 });
  const uTxt = u => `${u >= 0 ? "+" : ""}${u.toFixed(2)} u`;
  const cup = scope === "cup";
  if (cup && !todays.length) {
    $("#app").innerHTML = INTRO() + CUP_HERO(0) + cupStudy() + olderSection(older, true);
    return;
  }
  $("#app").innerHTML = `
  ${INTRO()}
  ${cup ? CUP_HERO(todays.length) : ""}
  ${hist.length ? `<section class="section">
    <h2>Cómo le ha ido al modelo ${qh("historial", "resultados del modelo")}</h2>
    <p class="lede">Picks con valor (EV ≥ +${(thr * 100).toFixed(0)}%) publicados antes de cada partido y liquidados con el resultado real. Unidades = ganancia apostando 1 a cada pick con la cuota promedio. ${tot.w + tot.l < 100 ? "Con tan pocos picks el resultado es sobre todo suerte: hacen falta cientos para juzgar el modelo." : ""}</p>
    <div class="panel tbl-wrap"><table class="stack"><thead><tr><th>Jornada</th><th class="r">Ganador acertado</th><th class="r">Picks ganados–perdidos</th><th class="r">Unidades</th></tr></thead><tbody>
      ${hist.map(x => `<tr><td class="head">${esc(x.date)}</td><td class="r num" data-label="Ganador acertado">${x.winners_ok} de ${x.games}</td><td class="r num" data-label="Picks">${x.picks_won}–${x.picks_lost}</td><td class="r num" data-label="Unidades">${uTxt(x.units)}</td></tr>`).join("")}
      ${hist.length > 1 ? `<tr><td class="head"><b>Total</b></td><td class="r num" data-label="Ganador acertado">${tot.ok} de ${tot.g}</td><td class="r num" data-label="Picks">${tot.w}–${tot.l}</td><td class="r num" data-label="Unidades">${uTxt(tot.u)}</td></tr>` : ""}
    </tbody></table></div>
  </section>` : ""}
  <section class="section">
    <span class="eyebrow">${cup ? "NBA Cup · " : ""}Jornada ${esc(DAY)}</span>
    <h2>${todays.some(g => g.result) ? "Picks con valor de la jornada" : "Picks con valor de hoy"} ${qh("ev", "picks con valor y EV")}</h2>
    <p class="lede">${picks.length} pick${picks.length === 1 ? "" : "s"} en ${todays.length} partidos donde la probabilidad del modelo supera a la que paga la casa. Agrupados por partido o en una sola lista ordenada por valor esperado (EV). Toca un pick para ver el análisis del partido.</p>
    ${legend(thr)}
    ${picks.length ? segBar(picks, "seg-idx") : ""}
    ${picks.length ? `<div class="filters" role="group" aria-label="Cómo ver los picks" id="grp-idx"><span class="lbl">Ver</span>${Object.entries(GROUPS).map(([k, t]) =>
      `<button type="button" data-grp="${k}" aria-pressed="${k === GROUP}">${t}</button>`).join("")}</div>` : ""}
    <div id="picks"></div>
    ${howto}
  </section>
  ${parlaySection(todays, thr)}
  ${cup ? cupStudy() : ""}
  <section class="section">
    <h2>${todays.some(g => g.result) ? "Partidos de la jornada" : "Partidos de hoy"} ${qh("usar", "cómo usar la página")}</h2>
    <div class="games">${todays.map(card).join("") || `<div class="empty">No hay partidos para esta jornada.</div>`}</div>
  </section>
  ${olderSection(older, cup)}
  <p class="foot">EV alto (+15% o más) al inicio de temporada suele indicar que al modelo le falta información (lesiones, rotaciones); revisa el contexto del partido antes de apostar. Herramienta de análisis, no consejo de apuesta.</p>`;
  const open = new Set();   // acordeones abiertos, se conservan al cambiar de filtro
  const groupHtml = list => {
    const gs = todays.map(g => ({ g, bets: list.filter(b => b._gid === g.id) })).filter(x => x.bets.length);
    return `<div class="pg-tools"><button type="button" id="pg-all">${gs.every(x => open.has(x.g.id)) ? "Cerrar todos" : "Abrir todos"}</button></div>
    <div class="pgroups">${gs.map(({ g, bets }) => {
      const r = g.result, won = bets.filter(b => b.result === "won").length, lost = bets.filter(b => b.result === "lost").length;
      const info = r ? `Final ${r.score[g.away]}–${r.score[g.home]}${r.ot ? " (OT)" : ""} · picks ${won}–${lost}`
        : `${g.tip_et ? esc(g.tip_et) + " ET · " : ""}<span class="hide-sm">proy. </span>${Math.round(g.proj[g.away])}–${Math.round(g.proj[g.home])}`;
      return `<details class="pgroup" data-id="${g.id}"${open.has(g.id) ? " open" : ""}>
        <summary><span class="pg-t">${esc(g.away)} @ ${esc(g.home)}</span><span class="pg-x">${info}</span>
          <span class="pg-r"><span class="pg-n">${bets.length} pick${bets.length > 1 ? "s" : ""}</span>${evPill(bets[0].ev, thr)}</span></summary>
        <div class="pg-body"><table class="stack">${betHead(true, bets.some(b => b.result))}<tbody>${betRows(bets, thr, true)}</tbody></table>
          <a class="pg-go" href="#${g.id}">Ver análisis del partido →</a></div></details>`;
    }).join("")}</div>`;
  };
  const drawPicks = () => {

      : GROUP === "game" ? groupHtml(list)
      : `<div class="panel tbl-wrap"><table class="stack">${betHead(true, list.some(b => b.result))}<tbody>${betRows(list, thr, true)}</tbody></table></div>`;
    document.querySelectorAll("#picks tr.link").forEach(tr => tr.addEventListener("click", e => { if (e.target.tagName !== "A") location.hash = tr.dataset.go; }));
    document.querySelectorAll("#picks details.pgroup").forEach(d => d.addEventListener("toggle", () => {
      d.open ? open.add(d.dataset.id) : open.delete(d.dataset.id);
      const all = [...document.querySelectorAll("#picks details.pgroup")].every(x => x.open);
      $("#pg-all").textContent = all ? "Cerrar todos" : "Abrir todos";
    }));
    $("#pg-all")?.addEventListener("click", () => {
      const ds = [...document.querySelectorAll("#picks details.pgroup")], to = !ds.every(x => x.open);
      ds.forEach(x => { x.open = to; });
    });
  };
  document.querySelectorAll("#grp-idx button").forEach(b => b.addEventListener("click", () => {
    GROUP = b.dataset.grp;
    document.querySelectorAll("#grp-idx button").forEach(x => x.setAttribute("aria-pressed", x.dataset.grp === GROUP));
    drawPicks();
  }));
  bindSeg("seg-idx", drawPicks);
  drawPicks();
  bindParlays(todays, thr);
}

// Parlays recomendados (build_site.py): mismo partido = prob. conjunta contada en las simulaciones
// (incluye la correlación); entre partidos = producto de probabilidades (partidos independientes).
const PL_N = { 2: "2 patas", 3: "3 patas", 4: "4 patas" };
function parlayCard(pl, thr, withGame) {
  const cross = pl.type === "cross", c = pl.corr;
  const corr = cross ? "Partidos distintos: la probabilidad conjunta es el producto de las de cada pata."
    : c >= 1.02 ? `Patas que se ayudan entre sí: ${pct(c - 1, 0)} más probable que si fueran independientes (${pct(pl.p_indep)}).`
    : c <= 0.98 ? `Patas que se estorban un poco: ${pct(1 - c, 0)} menos probable que si fueran independientes (${pct(pl.p_indep)}).`
    : `Patas casi independientes entre sí (${pct(pl.p_indep)} multiplicando).`;
  return `<article class="pl-card">
    <header><h3>${PL_N[pl.n] || pl.n + " patas"}</h3><span class="kind">${cross ? "Entre partidos" : "Mismo partido" + (withGame ? ` · <a href="#${pl.legs[0].gid}">${esc(pl.legs[0].game)}</a>` : "")}</span>${resPill(pl.result)}</header>
    <ol class="pl-legs">${pl.legs.map(l => `<li><div><div class="lg">${esc(l.label)}</div><div class="kind">${KIND[l.kind] || l.kind}${cross ? ` · <a href="#${l.gid}">${esc(l.game)}</a>` : ""}</div></div>
      <div class="lp"><span>${pct(l.p, 0)} · @ ${l.dec.toFixed(2)}</span>${resPill(l.result)}</div></li>`).join("")}</ol>
    <div class="pl-stats">
      <div class="cell main"><span class="k">Prob. modelo</span><span class="v">${pct(pl.p)}</span></div>
      <div class="cell"><span class="k">Cuota aprox.</span><span class="v">${pl.dec.toFixed(2)}</span></div>
      <div class="cell"><span class="k">Cuota justa</span><span class="v">${pl.fair ? pl.fair.toFixed(2) : "—"}</span></div>

const plHowto = `<details class="howto"><summary>¿Cómo se arman los parlays?</summary><dl>
  <dt>Patas</dt><dd>Solo entran apuestas con cuota publicada, probabilidad del modelo de al menos 55% y EV no negativo. En los parlays entre partidos, solo picks con valor (EV ≥ +3%), los dos más probables de cada partido. No se combinan dos patas del mismo jugador ni ganador con hándicap del mismo partido.</dd>
  <dt>Elección</dt><dd>Para 2, 3 y 4 patas se elige la combinación con la mayor probabilidad de acertar todas, siempre que la cuota combinada sea de al menos 2.00 y el EV sea positivo.</dd>
  <dt>Prob. modelo</dt><dd>Mismo partido: porcentaje de las simulaciones en que aciertan todas las patas a la vez, así se tiene en cuenta que unas dependen de otras (si un equipo anota mucho suben sus jugadores y el over). Entre partidos: producto de las probabilidades. Se calcula suponiendo que juegan todos los jugadores de las props (si uno no juega, la casa anula esa pata) y no entran jugadores en duda.</dd>
  <dt>Cuota aprox.</dt><dd>Producto de las cuotas promedio de cada pata. En un parlay del mismo partido la casa suele pagar menos que esto cuando las patas van en la misma dirección: compara con la cuota que te ofrezca y con la cuota justa.</dd>
</dl></details>`;
let PL_MODE = "cross", PL_GAME = null;
function parlaySection(todays, thr) {
  const cross = crossFor(todays), withSgp = todays.filter(g => (g.parlays || []).length);
  if (!cross.length && !withSgp.length) return "";

  if (!withSgp.some(g => g.id === PL_GAME)) PL_GAME = withSgp[0]?.id;
  return `<section class="section" id="parlays">

    <div class="filters" role="group" aria-label="Tipo de parlay" id="pl-mode">
      ${cross.length ? `<button type="button" data-m="cross" aria-pressed="${PL_MODE === "cross"}">Entre partidos · ${cross.length}</button>` : ""}

// parlays entre partidos solo con patas de la pestaña activa (liga regular o NBA Cup)
function crossFor(todays) {

}
function bindParlays(todays, thr) {

    document.querySelectorAll("#pl-mode button").forEach(b => b.setAttribute("aria-pressed", b.dataset.m === PL_MODE));

    gb.style.display = PL_MODE === "sgp" ? "" : "none";
    gb.innerHTML = withSgp.map(g => `<button type="button" data-g="${g.id}" aria-pressed="${g.id === PL_GAME}">${esc(g.away)} @ ${esc(g.home)}</button>`).join("");
    gb.querySelectorAll("button").forEach(b => b.addEventListener("click", () => { PL_GAME = b.dataset.g; draw(); }));
    const list = PL_MODE === "cross" ? crossFor(todays) : (withSgp.find(g => g.id === PL_GAME) || {}).parlays || [];

  };

}

function histogram(h, away, home) {
  const W = 520, H = 170, pad = 26, n = h.length, max = Math.max(...h, 1), bw = (W - pad * 2) / n;
  const bars = h.map((v, i) => {
    const lo = -40 + i * 4, x = pad + i * bw, bh = (v / max) * (H - 44);
    return `<rect x="${x + 1}" y="${H - 24 - bh}" width="${bw - 2}" height="${bh}" rx="2" fill="${lo >= 0 ? "var(--accent)" : "var(--muted)"}" opacity="${lo >= 0 ? 1 : .55}"><title>${away} ${lo} a ${lo + 4}: ${v}</title></rect>`;
  }).join("");
  const ticks = [-40, -20, 0, 20, 40].map(t => `<text x="${pad + ((t + 40) / 4) * bw}" y="${H - 6}" text-anchor="middle">${t > 0 ? "+" + t : t}</text>`).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Distribución del margen">
    <line x1="${pad + 10 * bw}" x2="${pad + 10 * bw}" y1="8" y2="${H - 24}" stroke="var(--line)" />
    ${bars}${ticks}
    <text x="${W - pad}" y="14" text-anchor="end">gana ${esc(away)} →</text><text x="${pad}" y="14">← gana ${esc(home)}</text></svg>`;
}

  const g = d.game, s = d.summary, a = g.away, h = g.home, mk = d.market || {};
  const sc = Object.entries(s.scenarios);
  const players = [...s.players];

    <div class="stat"><span class="eyebrow">Paliza 20+ / prórroga</span><b class="num">${pct(s.p_blowout_any, 0)} / ${pct(s.p_ot, 0)}</b><span class="muted">${esc(a)} ${pct(s.p_blowout_by[a], 0)} · ${esc(h)} ${pct(s.p_blowout_by[h], 0)}</span></div>

    document.querySelectorAll("#bets button.more").forEach(btn => btn.addEventListener("click", () => {
      const row = $("#det-" + btn.dataset.i), open = row.hidden;
      row.hidden = !open; btn.setAttribute("aria-expanded", open);
      btn.textContent = open ? "Ocultar casas" : `Ver ${list[btn.dataset.i].books.length} casas`;
    }));
  };
  bindSeg("seg-game", drawBets);
  drawBets();
  draw();
  if (d.matchup_view) {
    document.querySelectorAll("#mv-teams button").forEach(b => b.addEventListener("click", () => mvDraw(d, b.dataset.t)));

const GUIDE = [
  ["que", "Qué es", "¿Qué es NBA Predictor?", () => `<p>Una herramienta que <b>simula cada partido de la NBA decenas de miles de veces</b> antes de que se juegue. Cada simulación es un partido posible, jugador por jugador, a partir de:</p>

    <p>Contando en cuántas simulaciones pasa cada cosa sale su <b>probabilidad</b>. Después se compara con las cuotas de las casas de apuestas para encontrar <b>picks con valor</b>: apuestas que, según el modelo, pagan más de lo que deberían.</p>`],
  ["usar", "Cómo usarla", "Cómo usar la página", () => `<ol>
    <li><b>Barra de partidos</b> (debajo del título): los partidos de hoy (resaltados, con la etiqueta <b>Hoy</b>) y, atenuados, los resultados de ayer. Se mueve sola; puedes deslizarla y tocar cualquiera.</li>
    <li><b>Jornadas anteriores</b>: un desplegable por día con los últimos 7 días. El botón <b>↑</b> de abajo a la derecha te devuelve al inicio de la página o del análisis del partido.</li>

    <li><b>Página de un partido</b>: toca un pick o una tarjeta para ver el análisis completo (marcador proyectado, todas las apuestas, rankings, temporada pasada y player props).</li>
    <li><b>Compara con tu casa</b>: si tu casa paga una cuota mayor que la <i>cuota justa</i> del modelo, la apuesta tiene valor.</li></ol>
    <p>Las pestañas <b>Liga regular</b> y <b>NBA Cup</b> separan los partidos del torneo de copa. El botón del sol/luna cambia entre modo claro y oscuro, y los botones <span class="qh" aria-hidden="true">?</span> junto a cada sección te traen a la parte de esta guía que la explica.</p>`],
  ["prob", "Probabilidad", "Probabilidad del modelo", () => `<p>Es el porcentaje de simulaciones en que la apuesta gana. <b>62%</b> quiere decir que pasó en 62 de cada 100 partidos simulados.</p>
    <p>No es una certeza: una apuesta del 62% se pierde 38 de cada 100 veces. El modelo no adivina un partido, estima qué tan probable es cada resultado.</p>`],
  ["cuota", "Cuotas", "Cuotas decimales", () => `<p>La cuota es lo que te devuelven por cada 1 apostado, <b>incluido lo que apostaste</b>.</p>
    <div class="ex">Cuota <b>2.00</b>: apuestas 10.000 y, si aciertas, recibes 20.000 (ganas 10.000).<br>Cuota <b>1.50</b>: apuestas 10.000 y recibes 15.000 (ganas 5.000).</div>
    <dl><dt>Prob. casa</dt><dd>La probabilidad que implica la cuota: 1 ÷ cuota. Una cuota de 2.00 equivale a 50%. Incluye el margen que se queda la casa.</dd>

    <dt>Mejor casa</dt><dd>La casa donde esa apuesta rinde más. Las marcadas con <span class="co">CO</span> son casas de Colombia (Rushbet, BetPlay).</dd></dl>`],
  ["ev", "EV y colores", "EV (valor esperado) y colores", () => `<p>El EV dice cuánto ganarías de media por cada 100 apostados si hicieras esa misma apuesta muchas veces. Se calcula con la probabilidad del modelo y la cuota:</p>
    <div class="ex">EV = prob. modelo × cuota − 1<br>Prob. 55% y cuota 2.00 → 0.55 × 2.00 − 1 = <b>+10%</b>: a la larga, +10 por cada 100 apostados.</div>
    <dl><dt><span class="pill value">Verde</span></dt><dd>Pick con valor: EV de al menos +${((INDEX?.value_ev ?? .03) * 100).toFixed(0)}%. Son los que se recomiendan.</dd>

  ["parlays", "Parlays", "Parlays (combinadas)", () => `<p>Un parlay junta 2 a 4 apuestas ("patas") en una sola: <b>tienen que acertar todas</b>, y a cambio la cuota se multiplica.</p>

    <dt>Contexto</dt><dd>Notas del partido: lesionados, back-to-back, fichajes.</dd></dl>`],
  ["rankings", "Rankings", "Enfrentamiento según los rankings", () => `<p>Compara el ataque de un equipo con la defensa del rival. Elige qué equipo ataca con los botones.</p>

  ["h2h", "Temporada pasada", "Enfrentamientos de la temporada pasada", () => `<p>Los partidos entre ambos equipos la temporada anterior, con el marcador, la máxima ventaja de cada uno y si hubo paliza (ventaja de 20 o más en algún momento).</p>

  ["props", "Player props", "Player props proyectados", () => `<dl>
    <dt>Min</dt><dd>Minutos que se espera que juegue.</dd>
    <dt>Media</dt><dd>Su promedio en las simulaciones.</dd>
    <dt>Rango</dt><dd>Lo que hace en 8 de cada 10 partidos simulados (de lo bajo a lo alto).</dd>

    <dt>P(over)</dt><dd>Probabilidad de superar esa línea.</dd>

  ["copa", "NBA Cup", "Partidos de la NBA Cup", () => `<p>Los partidos de la fase de grupos de la Copa cuentan para la liga regular, pero en la web van en su propia pestaña. En cada partido de Copa verás los <b>precedentes de Copa</b>: las veces que esos dos equipos ya se cruzaron en la Copa (2023-24 a 2025-26), con el total de puntos frente a la línea de cierre, y cómo anotó y recibió cada equipo en sus partidos de Copa comparado con sus partidos de liga del mismo tramo.</p>
    <p>En el inicio de la pestaña está el estudio de si la Copa tiene más puntos: en las dos últimas temporadas no fue así (ni en la primera jornada ni en toda la fase de grupos), así que el modelo simula los partidos de Copa igual que los de liga.</p>`],
  ["historial", "Resultados", "Cómo le ha ido al modelo", () => `<p>Cada jornada, los picks con valor publicados antes de los partidos se liquidan con el resultado real.</p>

const qh = (id, what) => `<button type="button" class="qh" data-guide="${id}" aria-label="Qué significa: ${esc(what)}" title="¿Qué significa esto?">?</button>`;
function openGuide(id = "que") {
  const dlg = $("#guide");
  if (!$("#g-body").childElementCount) {
    $("#g-toc").innerHTML = GUIDE.map(([k, t]) => `<button type="button" data-to="${k}">${t}</button>`).join("");
    $("#g-toc").addEventListener("click", e => { const k = e.target.dataset?.to; if (k) jumpGuide(k); });
  }
  $("#g-body").innerHTML = GUIDE.map(([k, , t, body]) => `<section id="g-${k}"><h3>${t}</h3>${body()}</section>`).join("");
  if (!dlg.open) { if (dlg.showModal) dlg.showModal(); else dlg.setAttribute("open", ""); }
  jumpGuide(id, id === "que");
}
function jumpGuide(id, quiet) {
  const sec = $("#g-" + id); if (!sec) return;
  $("#g-body").scrollTop = sec.offsetTop - $("#g-body").offsetTop - 4;
  if (quiet) return;
  sec.classList.remove("flash"); void sec.offsetWidth; sec.classList.add("flash");
  setTimeout(() => sec.classList.remove("flash"), 1400);
}

      <span class="muted" style="font-size:13px">Los botones ${qh("usar", "cómo usar la página")} explican cada sección.</span></div>
  </section>`;
const NEWBIE = () => introOff() ? "" : `<div class="newbie"><span>¿Primera vez aquí? Esta es la simulación de un partido.</span><button type="button" data-guide="partido">Cómo leer esta página</button><button type="button" class="x" data-intro-off>Ocultar</button></div>`;
$("#g-close").addEventListener("click", () => $("#guide").close());
$("#guide").addEventListener("click", e => { if (e.target === e.currentTarget) e.currentTarget.close(); });   // clic fuera del cuadro
document.addEventListener("click", e => {
  const t = e.target.closest("[data-guide], [data-intro-off]"); if (!t) return;
  e.preventDefault(); e.stopPropagation();
  if (t.hasAttribute("data-intro-off")) hideIntro(); else openGuide(t.dataset.guide);
}, true);

function route() {
  const id = location.hash.slice(1);
  window.scrollTo(0, 0);
  const game = id && INDEX.games.find(g => g.id === id);
  const scope = game ? (isCup(game) ? "cup" : "reg") : id === "cup" ? "cup" : "reg";
  // la pestaña NBA Cup (y sus partidos) cambia la paleta y la tipografía
  if (scope === "cup") document.documentElement.dataset.mode = "cup"; else delete document.documentElement.dataset.mode;
  $("#tab-reg").toggleAttribute("aria-current", false); $("#tab-cup").toggleAttribute("aria-current", false);
  $(scope === "cup" ? "#tab-cup" : "#tab-reg").setAttribute("aria-current", "page");
  markTicker(game ? id : null);
  $("#to-top-t").textContent = game ? "Inicio del partido" : "Arriba";
  SEG = "all";
  if (game) renderGame(id); else renderIndex(scope);
}

// Botón flotante para volver arriba (al inicio del análisis en la página de un partido) tras bajar un poco
const toTop = () => { $("#to-top").hidden = scrollY < 600; };
addEventListener("scroll", toTop, { passive: true });
$("#to-top").addEventListener("click", () => {
  scrollTo({ top: 0, behavior: calm.matches ? "auto" : "smooth" });
});

// Modo claro / oscuro: el botón alterna y guarda la elección; sin elección sigue al sistema
const darkMQ = matchMedia("(prefers-color-scheme: dark)");
const isDark = () => (document.documentElement.dataset.theme || (darkMQ.matches ? "dark" : "light")) === "dark";
function syncThemeBtn() { $("#theme-btn").setAttribute("aria-label", isDark() ? "Cambiar a modo claro" : "Cambiar a modo oscuro"); }
$("#theme-btn").addEventListener("click", () => {
  const t = isDark() ? "light" : "dark";
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem("nbap-theme", t); } catch (e) {}
  syncThemeBtn();
});
darkMQ.addEventListener?.("change", syncThemeBtn);
syncThemeBtn();

getJSON("data/index.json").then(d => {
  INDEX = d;
  const dates = [...new Set(d.games.map(g => g.date))].sort().reverse();
  DAY = dates[0];
  const todays = d.games.filter(g => g.date === DAY);
  const nCup = todays.filter(isCup).length;
  $("#n-reg").textContent = todays.length - nCup || ""; $("#n-cup").textContent = nCup || "";
  $("#meta").innerHTML = `Jornada ${esc(DAY)} · ${todays.length} partidos<br>Actualizado ${esc((d.generated || "").replace("T", " ").replace("+00:00", ""))} UTC`;
  const prevDay = dates[1], prev = prevDay ? d.games.filter(g => g.date === prevDay) : [];
  setupTicker();
  renderTicker(prev, todays);
  let rw; addEventListener("resize", () => { clearTimeout(rw); rw = setTimeout(() => { renderTicker(prev, todays); markTicker(location.hash.slice(1)); }, 250); });
  route();
  window.addEventListener("hashchange", route);
}).catch(e => { $("#app").innerHTML = `<p>No se pudo cargar <code>data/index.json</code>. Ejecuta <code>python build_site.py</code> para generarlo.</p>`; });
</script>
