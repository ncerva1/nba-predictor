<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Bebas+Neue&family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500;600&display=swap">
<script>
// Tema claro/oscuro: se aplica antes de pintar para que no parpadee. Sin preferencia guardada sigue al sistema.
try { const t = localStorage.getItem("nbap-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<style>
/* Layout: banner con el título y las pestañas (Liga regular / NBA Cup), barra de partidos en movimiento
   (clic → análisis), y debajo la página activa: inicio de la pestaña o el panel de un partido (#id).
   Paleta: azul y rojo NBA en la liga regular; negro, oro y plata en la NBA Cup (data-mode="cup"). */
:root {
  --bg: #f2f4f8; --surface: #ffffff; --ink: #0b1630; --muted: #586379; --line: #dce1ea;
  --accent: #1d428a; --accent-soft: #e2e9f6; --hot: #c8102e; --on-accent: #ffffff;
  --banner: #0b1a3a; --banner-2: #1d428a; --banner-ink: #f4f6fb; --banner-muted: #aab6d3; --ticker: #08122a; --stripe: #c8102e;
  --good: #0a7d4b; --good-soft: #dcf2e6; --bad: #b3122b; --bad-soft: #f9e1e4;
  --display: "Oswald", "Arial Narrow", system-ui, sans-serif;
  --body: "Roboto", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Roboto Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #060b17; --surface: #0e1628; --ink: #eef2f9; --muted: #93a0b8; --line: #1e2a42;
  --accent: #6f9bff; --accent-soft: #152449; --hot: #ff4d5e; --on-accent: #060b17;
  --banner: #050a18; --banner-2: #12285a; --banner-ink: #f4f6fb; --banner-muted: #93a1c4; --ticker: #03070f; --stripe: #e0213f;
  --good: #47d08f; --good-soft: #10301f; --bad: #ff7b86; --bad-soft: #3a141b; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #060b17; --surface: #0e1628; --ink: #eef2f9; --muted: #93a0b8; --line: #1e2a42;
  --accent: #6f9bff; --accent-soft: #152449; --hot: #ff4d5e; --on-accent: #060b17;
  --banner: #050a18; --banner-2: #12285a; --banner-ink: #f4f6fb; --banner-muted: #93a1c4; --ticker: #03070f; --stripe: #e0213f;
  --good: #47d08f; --good-soft: #10301f; --bad: #ff7b86; --bad-soft: #3a141b; color-scheme: dark }
/* NBA Cup: tablero negro, oro del trofeo y plata */
:root[data-mode="cup"] {
  --bg: #f5f2ea; --surface: #fffdf8; --ink: #17140c; --muted: #6b6250; --line: #e4dcc8;
  --accent: #8a6412; --accent-soft: #f3e8cc; --hot: #b8892b; --on-accent: #ffffff;
  --banner: #0d0c0a; --banner-2: #2a2316; --banner-ink: #faf6ec; --banner-muted: #c9bc9c; --ticker: #070605; --stripe: #d4a537;
  --display: "Bebas Neue", "Oswald", "Arial Narrow", sans-serif;
}
@media (prefers-color-scheme: dark) { :root[data-mode="cup"]:not([data-theme="light"]) {
  --bg: #0a0907; --surface: #15130e; --ink: #f6f1e4; --muted: #a99f88; --line: #2c271c;
  --accent: #e2b75a; --accent-soft: #2d2412; --hot: #f0c66b; --on-accent: #0a0907;
  --banner: #000000; --banner-2: #241d10; --ticker: #000000; --stripe: #e2b75a } }
:root[data-mode="cup"][data-theme="dark"] {
  --bg: #0a0907; --surface: #15130e; --ink: #f6f1e4; --muted: #a99f88; --line: #2c271c;
  --accent: #e2b75a; --accent-soft: #2d2412; --hot: #f0c66b; --on-accent: #0a0907;
  --banner: #000000; --banner-2: #241d10; --ticker: #000000; --stripe: #e2b75a }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body); margin: 0 }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.inner { max-width: 1080px; margin: 0 auto }
h1, h2, h3 { font-family: var(--display); font-weight: 700; letter-spacing: .01em; margin: 0; text-wrap: balance; line-height: 1.05 }
h1 { font-size: clamp(34px, 6vw, 52px); text-transform: uppercase }
h2 { font-size: 28px; text-transform: uppercase }
h3 { font-size: 20px }
.eyebrow { font: 500 12px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted) }
.muted { color: var(--muted) }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums }
a { color: var(--accent) }

/* banner */
.banner { background: linear-gradient(115deg, var(--banner) 0%, var(--banner) 55%, var(--banner-2) 100%); color: var(--banner-ink); position: relative }
.banner::after { content: ""; position: absolute; inset: auto 0 0 0; height: 4px; background: linear-gradient(90deg, var(--stripe) 0 62%, var(--banner-ink) 62% 64%, var(--accent) 64%) }
:root[data-mode="cup"] .banner::after { background: linear-gradient(90deg, #7a5a14, var(--stripe) 30%, #f6e2a6 55%, var(--stripe) 75%, #7a5a14) }
.banner .inner { padding-block: 22px 0; display: flex; flex-wrap: wrap; gap: 10px 24px; align-items: center; justify-content: space-between }
.banner a.brand { color: inherit; text-decoration: none; display: flex; align-items: center; gap: 14px }
.banner .logo { flex: none; width: 52px; height: 52px; border-radius: 12px; display: grid; place-items: center; background: var(--stripe); box-shadow: inset 0 -3px 0 rgba(0,0,0,.25) }
:root[data-mode="cup"] .banner .logo { background: linear-gradient(150deg, #f6e2a6, var(--stripe) 45%, #7a5a14) }
.banner .logo svg { width: 34px; height: 34px }
.banner .brand-t { display: grid; gap: 2px }
.banner .brand-t > span { font: 500 11px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--banner-muted) }
.banner h1 { font-size: clamp(34px, 6vw, 52px); letter-spacing: .02em }
.banner .side { display: flex; align-items: center; gap: 14px; margin-left: auto }
.banner .meta { font: 500 12px var(--mono); color: var(--banner-muted); letter-spacing: .04em; text-align: right }
.theme-btn { flex: none; width: 40px; height: 40px; border-radius: 999px; border: 1px solid rgba(255,255,255,.25); background: rgba(255,255,255,.08);
  color: var(--banner-ink); display: grid; place-items: center; cursor: pointer; transition: background .15s, border-color .15s }
.theme-btn:hover, .theme-btn:focus-visible { background: rgba(255,255,255,.18); border-color: var(--banner-ink); outline: none }
.theme-btn svg { width: 20px; height: 20px }
.theme-btn .moon { display: none }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .theme-btn .moon { display: block } :root:not([data-theme="light"]) .theme-btn .sun { display: none } }
:root[data-theme="dark"] .theme-btn .moon { display: block } :root[data-theme="dark"] .theme-btn .sun { display: none }
/* pestañas: liga regular / NBA Cup */
.tabs { flex-basis: 100%; display: flex; gap: 4px; margin-top: 6px }
.tab { display: flex; align-items: center; gap: 8px; padding: 10px 16px 12px; color: var(--banner-muted); text-decoration: none;
  font: 600 15px/1 var(--display); letter-spacing: .08em; text-transform: uppercase; border-radius: 8px 8px 0 0; position: relative; transition: color .15s, background .15s }
.tab:hover, .tab:focus-visible { color: var(--banner-ink); background: rgba(255,255,255,.06); outline: none }
.tab[aria-current="page"] { color: var(--banner-ink); background: rgba(255,255,255,.1) }
.tab[aria-current="page"]::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: 4px; height: 3px; border-radius: 2px; background: var(--banner-ink) }
.tab.cup-tab { font-family: "Bebas Neue", var(--display); font-size: 19px; font-weight: 400; letter-spacing: .1em }
.tab.cup-tab svg { width: 16px; height: 16px; color: #e2b75a }
.tab.cup-tab[aria-current="page"]::after { background: linear-gradient(90deg, #a77a1c, #f6e2a6, #a77a1c) }
.tab .n:empty { display: none }
.tab .n { font: 600 11px var(--mono); letter-spacing: 0; background: rgba(255,255,255,.14); padding: 2px 6px; border-radius: 999px }
/* colores de cada equipo (TEAM en el script): insignia con la abreviatura y barras de probabilidad */
.tm { display: inline-flex; align-items: center; gap: 8px }
.tm i { width: 10px; height: 10px; border-radius: 3px; background: var(--tc); box-shadow: 0 0 0 1px rgba(128,128,128,.35); flex: none }
.badge { display: inline-grid; place-items: center; min-width: 2.6em; padding: .18em .4em .1em; border-radius: 6px; background: var(--tc); color: var(--tf);
  font: 700 1em/1 var(--display); letter-spacing: .04em; box-shadow: inset 0 -2px 0 rgba(0,0,0,.2), 0 0 0 1px rgba(128,128,128,.25) }
:root[data-mode="cup"] h1, :root[data-mode="cup"] h2, :root[data-mode="cup"] h3 { font-weight: 400; letter-spacing: .03em }
/* barra de partidos */
/* Se mueve sola con JS (scrollLeft), así que también se puede arrastrar, deslizar con el dedo o
   mover con las flechas; se pausa al pasar el ratón o al tocarla y sigue a los pocos segundos. */
.ticker { background: var(--ticker); border-top: 1px solid rgba(255,255,255,.08); position: relative; display: flex; align-items: stretch }
.ticker-scroll { flex: 1; min-width: 0; overflow-x: auto; scrollbar-width: none; cursor: grab; user-select: none; -webkit-user-select: none }
.ticker-scroll::-webkit-scrollbar { display: none }
.ticker-scroll.dragging { cursor: grabbing }
.ticker-track { display: flex; gap: 10px; width: max-content; padding-block: 10px; align-items: stretch }
.tk-btn { flex: none; width: 34px; border: 0; background: var(--ticker); color: var(--banner-ink); font: 700 22px/1 var(--display); cursor: pointer; position: relative; z-index: 1 }
.tk-btn:hover, .tk-btn:focus-visible { background: rgba(255,255,255,.1); outline: none }
.tk-btn.prev { box-shadow: 8px 0 10px -6px rgba(0,0,0,.5) } .tk-btn.next { box-shadow: -8px 0 10px -6px rgba(0,0,0,.5) }
.tk-label { display: grid; place-items: center; writing-mode: vertical-rl; transform: rotate(180deg); font: 600 10px var(--mono); letter-spacing: .1em;
  text-transform: uppercase; color: var(--banner-muted); padding: 0 2px; border-left: 1px solid rgba(255,255,255,.15) }
.chip.done { background: rgba(255,255,255,.03) }
.chip .ok { color: #7fe3b0 } .chip .ko { color: #ffaaa3 }
.chip { display: grid; grid-template-columns: auto auto; gap: 0 14px; align-items: center; text-decoration: none; color: var(--banner-ink);
  background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12); border-radius: 8px; padding: 7px 12px; min-width: 190px; transition: background .15s, border-color .15s }
.chip:hover, .chip:focus-visible { background: rgba(255,255,255,.14); border-color: var(--banner-ink); outline: none }
.chip.active { border-color: var(--banner-ink) }
.chip .t { font: 700 19px/1.15 var(--display); letter-spacing: .03em }
.chip .s { font: 500 13px/1.3 var(--mono); text-align: right }
.chip .x { font: 500 11px var(--mono); color: var(--banner-muted); grid-column: 1 / -1 }
.chip .v { color: #7fe3b0 }
.chip { border-left: 3px solid var(--ca, rgba(255,255,255,.12)) }
.chip.cup { border-color: rgba(226,183,90,.45); border-left-color: #e2b75a; background: rgba(226,183,90,.08) }
/* hoy resalta (fondo más claro, etiqueta HOY); ayer queda atenuado */
.chip.past { opacity: .62 } .chip.past:hover, .chip.past:focus-visible, .chip.past.active { opacity: 1 }
.chip.today { background: rgba(255,255,255,.13); border-color: rgba(255,255,255,.38) }
.chip.today.cup { background: rgba(226,183,90,.16); border-color: rgba(226,183,90,.7) }
.chip .hoy { display: inline-block; background: var(--stripe); color: #fff; font: 700 10px/1.5 var(--mono); letter-spacing: .08em; padding: 0 5px; border-radius: 3px; margin-right: 6px; vertical-align: 1px }
.tk-label.today { background: var(--stripe); color: #fff; font-weight: 700; border-left: 0; border-radius: 4px; padding: 0 4px }
.chip .cupk { color: #e2b75a; font-weight: 600 }

main.wrap { padding-block: 28px 64px }
main .inner { display: grid; gap: 30px }
.section > h2, .section > header > h2 { display: flex; align-items: center; gap: 10px }
.rot-wrap{display:grid;gap:20px}
.rot{width:100%;table-layout:fixed}
.rot th:nth-child(1),.rot td:nth-child(1){width:38%}
.rot th:nth-child(2),.rot td:nth-child(2){width:17%}
.rot th:nth-child(3),.rot td:nth-child(3){width:9%}
.rot td{vertical-align:middle}
.rot-q{display:flex;justify-content:space-around;font-size:.75rem}
.rotbar{width:100%;height:16px;display:block}
.rb-bg{fill:var(--line)} .rb-q{stroke:var(--surface);stroke-width:2}
.rb-titular{fill:var(--accent)} .rb-rotacion{fill:var(--good)} .rb-rol{fill:var(--muted)} .rb-reserva{fill:var(--hot);opacity:.55}
.rtag{display:inline-block;font-size:.72rem;padding:2px 6px;border-radius:999px;white-space:nowrap}
.rt-titular{background:var(--accent-soft);color:var(--accent)} .rt-rotacion{background:var(--good-soft);color:var(--good)}
.rt-rol{background:var(--line);color:var(--ink)} .rt-reserva{background:var(--bad-soft);color:var(--bad)}
.rot-note{margin:4px 0 8px}
@media (max-width:640px){
  .rot thead{display:none}
  .rot,.rot tbody{display:block}
  .rot tr{display:grid;grid-template-columns:1fr auto auto;gap:4px 10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
  .rot td{display:block;width:auto !important;padding:0;border:0;font-size:.88rem}
  .rot td.rot-tl{grid-column:1/-1}
  .rot-wrap h3::after{content:"  1.º · 2.º · 3.º · 4.º cuarto";font:400 .72rem var(--body);color:var(--muted)}
}
.mp-h{margin:18px 0 4px;font-size:1rem}
.hr{display:inline-block;min-width:3.2em;padding:1px 6px;border-radius:999px;font-weight:600;text-align:center;background:var(--line)}
.hr.hi{background:var(--good-soft);color:var(--good)} .hr.lo{background:var(--bad-soft);color:var(--bad)}
.subsec{margin-top:28px}
.mp-wrap tr[hidden],.mp-wrap p[hidden]{display:none!important}
.calc{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;align-items:end}
.calc label{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted, inherit)}
.calc select,.calc input{font:inherit;padding:6px 8px;border-radius:8px;border:1px solid var(--line, #8884);background:var(--bg, transparent);color:inherit;min-width:0}
.calc-out{grid-column:1/-1;display:flex;flex-direction:column;gap:4px}
.fold-btn { margin-left: auto; flex: none; font: 500 11px var(--mono); letter-spacing: .04em; text-transform: none; padding: 4px 10px;
  border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); cursor: pointer }
.fold-btn:hover { color: var(--ink); border-color: var(--accent) }
.panel.section > h3 { display: flex; align-items: center; gap: 8px }
.section.folded > :not(h2):not(h3):not(.eyebrow) { display: none !important }
.section > h2::before { content: ""; flex: none; width: 6px; height: .82em; border-radius: 2px; background: var(--hot); transform: skewX(-12deg) }
.vs { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px }
.vs .badge { font-size: .9em; min-width: 2.9em }
.vs .at { color: var(--muted); font-size: .6em }
.section { display: grid; gap: 12px }
.section > p { margin: 0 }
.lede { max-width: 70ch; color: var(--muted) }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px; min-width: 0 }
.tbl-wrap { overflow-x: auto; min-width: 0 }
table { border-collapse: collapse; width: 100%; font-size: 14px }
th { text-align: left; font: 500 11px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted);
  padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap }
td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: middle }
tr:last-child td { border-bottom: 0 }
td.r, th.r { text-align: right }
tr.link { cursor: pointer }
tr.link:hover td { background: var(--accent-soft) }
.pill { display: inline-block; font: 600 11px var(--mono); letter-spacing: .04em; padding: 2px 8px; border-radius: 999px; white-space: nowrap }
.pill.value { background: var(--good-soft); color: var(--good) }
.wo-d { font: 600 11px var(--mono); margin-left: 4px; padding: 1px 5px; border-radius: 4px; background: var(--line); color: var(--muted) }
.wo-d.up { background: var(--good-soft); color: var(--good) } .wo-d.dn { background: var(--bad-soft); color: var(--bad) }
.wo-c { white-space: nowrap } .wo-who { font-size: 13px } .wo-who .tag { font: 500 10px var(--mono); margin-left: 4px; color: var(--bad) }
.wo-note { margin: 8px 0 12px; font-size: 14px } .wo-real h3 { margin: 18px 0 6px; font-size: 15px }
.pill.neg { background: var(--bad-soft); color: var(--bad) }
.pill.flat { background: var(--accent-soft); color: var(--accent) }
.kind { font: 500 11px var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .05em }
.legend-row { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)) }
.legend-item { display: grid; gap: 4px; font-size: 13px; color: var(--muted) }
.legend-item .pill { justify-self: start }
details.howto { font-size: 14px; color: var(--muted) }
details.howto summary { cursor: pointer; color: var(--accent); font-weight: 500 }
details.howto dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; margin: 10px 0 0; max-width: 80ch }
details.howto dt { font-weight: 600; color: var(--ink) }
details.howto dd { margin: 0 }
.games { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)) }
.card { display: grid; gap: 12px; text-decoration: none; color: inherit; background: var(--surface); position: relative; overflow: hidden;
  border: 1px solid var(--line); border-radius: 10px; padding: 19px 16px 16px; transition: border-color .15s, transform .15s, box-shadow .15s }
.card::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 4px; background: linear-gradient(90deg, var(--ca, var(--accent)) 50%, var(--ch, var(--hot)) 50%) }
.card:hover { transform: translateY(-2px); box-shadow: 0 8px 22px -12px rgba(0,0,0,.35) }
.card:hover, .card:focus-visible { border-color: var(--accent); outline: none }
.matchup { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: baseline }
.team { font: 700 24px/1 var(--display); letter-spacing: .02em; display: flex; align-items: center; gap: 8px; flex-wrap: wrap }
.team .badge { font-size: 20px }
.score { font: 500 18px var(--mono) }
.bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; display: flex }
.bar i { background: var(--accent); display: block }
.bar.duo { gap: 2px; background: none } .bar.duo i:first-child { border-radius: 3px 0 0 3px } .bar.duo i:last-child { border-radius: 0 3px 3px 0; flex: 1 }
.mini { display: grid; gap: 4px; font-size: 13px }
.mini div { display: flex; justify-content: space-between; gap: 8px }
.cta { font: 500 13px var(--mono); color: var(--accent) }
.back { font: 500 13px var(--mono); text-decoration: none }
.hero { display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)) }
.stat { display: grid; gap: 2px }
.stat b { font: 700 34px/1 var(--display) }
.notes { margin: 0; padding-left: 18px; color: var(--muted); display: grid; gap: 4px; max-width: 80ch }
.grid2 { display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)) }
.chart text { fill: var(--muted); font: 11px var(--mono) }
.filters { display: flex; flex-wrap: wrap; gap: 8px }
.filters + .filters { margin-top: -4px }
.filters .lbl { font: 500 11px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); align-self: center; min-width: 74px }
.filters button { font: 500 12px var(--mono); padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink); cursor: pointer }
.filters button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--surface) }
.filters button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
th.sort { cursor: pointer; user-select: none }
th.sort:hover { color: var(--ink) }
th.sort[aria-sort]::after { content: " ▼"; font-size: 9px }
th.sort[aria-sort="ascending"]::after { content: " ▲" }
.sortsel { font: 500 12px var(--mono); padding: 6px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink) }
.seeall { justify-self: start; font: 600 13px var(--mono); text-decoration: none; padding: 9px 16px; border-radius: 999px; border: 1px solid var(--accent); color: var(--accent) }

.search { font: 14px var(--sans, inherit); padding: 8px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); width: min(100%, 320px) }
.more { display: block; margin-top: 4px; font: 500 11px var(--mono); color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline }
tr.detail td { background: var(--bg) }
.books { display: flex; flex-wrap: wrap; gap: 6px }
.book { font: 12px var(--mono); border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 3px 8px; white-space: nowrap }
.book i { font-style: normal; color: var(--muted) }
.book.good i { color: var(--good) } .book.bad i { color: var(--bad) }
.co { font: 600 9px var(--mono); letter-spacing: .04em; color: #fff; background: #1a4fa0; border-radius: 3px; padding: 1px 3px; margin-left: 4px; vertical-align: 1px }
.bestco { margin-top: 3px }
.res { font: 600 11px var(--mono); letter-spacing: .04em; padding: 2px 8px; border-radius: 999px; white-space: nowrap }
.res.won { background: var(--good-soft); color: var(--good) }
.res.lost { background: var(--bad-soft); color: var(--bad) }
.res.push { background: var(--accent-soft); color: var(--accent) }
.final { font: 500 13px var(--mono) }
.empty { padding: 24px; text-align: center; color: var(--muted) }
.foot { font-size: 13px; color: var(--muted); max-width: 80ch; margin: 0 }
.h2h-games { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)) }
.h2h-g { display: grid; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px }
.h2h-g .sc { display: grid; grid-template-columns: 1fr auto; font: 600 17px/1.3 var(--mono) }
.h2h-g .sc .w { color: var(--ink) } .h2h-g .sc .l { color: var(--muted); font-weight: 500 }
.h2h-g .ld { font-size: 12px; color: var(--muted) }
.h2h-cell .vals { display: block; font: 11px var(--mono); color: var(--muted) }
/* enfrentamiento según los rankings: todo se colorea desde el punto de vista del equipo que ataca */
.mv-block { display: grid; gap: 10px }
.mv-block + .mv-block { margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--line) }
.mv-block h3 small { font: 500 12px var(--body); color: var(--muted); letter-spacing: 0 }
.mv-rows { display: grid; gap: 8px }
.dvp-row { display: grid; grid-template-columns: minmax(130px, 1.3fr) repeat(4, minmax(0, 1fr)); gap: 6px; align-items: stretch }
.dvp-pos { display: grid; align-content: center; gap: 2px; min-width: 0 }
.dvp-pos b { font: 700 22px/1 var(--display) }
.dvp-pos span { font-size: 12px; color: var(--muted); line-height: 1.3 }
.cell { border-radius: 8px; padding: 6px 8px; background: var(--bg); display: grid; gap: 1px; min-width: 0 }
.cell .k { font: 500 10px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted) }
.cell .v { font: 600 17px/1.15 var(--mono); font-variant-numeric: tabular-nums }
.cell .rk { font: 500 11px var(--mono); color: var(--muted) }
.cell.good { background: var(--good-soft) } .cell.good .rk { color: var(--good) }
.cell.bad { background: var(--bad-soft) } .cell.bad .rk { color: var(--bad) }
.pt-row { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr) minmax(0, 1fr) 120px; gap: 6px 12px; align-items: center;
  padding: 8px 0; border-bottom: 1px solid var(--line) }
.pt-row:last-child { border-bottom: 0 }
.pt-name { display: grid; gap: 4px; min-width: 0 }
.pt-name b { font-weight: 600 }
.pt-freq { display: flex; align-items: center; gap: 8px; font: 12px var(--mono); color: var(--muted) }
.pt-freq .bar { flex: 1; max-width: 140px }
.pt-cell { display: grid; gap: 1px; font-size: 13px }
.pt-cell .k { font: 500 10px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted) }
.pt-row > .pill { justify-self: end }
.pt-cell .num.good { color: var(--good) } .pt-cell .num.bad { color: var(--bad) }
.mv-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--muted) }
.mv-legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 6px }
@media (max-width: 640px) {
  .dvp-row { grid-template-columns: repeat(4, minmax(0, 1fr)); padding-bottom: 8px; border-bottom: 1px solid var(--line) }
  .dvp-row:last-child { border-bottom: 0 }
  .dvp-pos { grid-column: 1 / -1; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap }
  .cell { padding: 5px 6px } .cell .v { font-size: 15px }
  .pt-row { grid-template-columns: 1fr 1fr }
  .pt-name { grid-column: 1 / -1 }

}

/* las tres actualizaciones del día */

.bj-list li.duda { box-shadow: inset 3px 0 0 var(--accent) }

.bj-w { color: var(--bad) }
.bj-btn { padding: 2px 0; border: 0; background: none; color: var(--accent); font: 500 13px inherit; font-family: inherit; text-decoration: underline; cursor: pointer }
.bj-card span:last-child { color: var(--bad); text-align: right }
.upd { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin: 0; padding: 0; list-style: none }
.upd li { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; gap: 2px; min-width: 0 }
.upd li.done { border-color: var(--good) }

/* parlays recomendados: tarjetas con las patas y la prob. conjunta del modelo */
.pl-list { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)) }
.pl-card { display: grid; gap: 12px; align-content: start; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; min-width: 0 }
.pl-card > header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px }

.pl-legs { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; counter-reset: leg }

@media (max-width: 640px) {
  .pl-list { grid-template-columns: 1fr }

/* Armar apuesta: las 5 mejores líneas con su porqué */
.aa-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px }
.aa-item { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; gap: 8px; min-width: 0 }
.aa-h { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto auto; gap: 6px 14px; align-items: center }
.aa-qs { display: flex; gap: 16px; align-items: center }
.aa-n { font: 700 20px/1 var(--display); color: var(--accent) }
.aa-t { min-width: 0 }
.aa-q { display: grid; justify-items: end; gap: 2px; font-size: 14px; white-space: nowrap }

@media (max-width: 640px) {

/* Mis picks: botón "Lo tomo" en los picks recomendados y página #mis-picks */
.take { display: inline-flex; align-items: center; gap: 6px; margin-top: 6px; font: 500 12px var(--body); color: var(--accent); background: none; border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px 3px 7px; cursor: pointer; white-space: nowrap }
.take .bx { width: 12px; height: 12px; border: 1.5px solid currentColor; border-radius: 3px; display: inline-grid; place-items: center; font-size: 10px; line-height: 1 }
.take[aria-pressed="true"] { background: var(--good-soft); color: var(--good); border-color: var(--good) }

.take[aria-pressed="true"] .bx::after { content: "✓"; color: var(--surface); font-weight: 700 }
.take:hover:not(:disabled) { border-color: var(--accent) }

.take:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.take.demo { cursor: default; vertical-align: middle; margin: 0 2px }
.mine-kpi { padding: 12px }

.mine-note { margin: 0; font-size: 13px }

.mine-list { list-style: none; margin: 0; padding: 0 16px 8px }
.mine-list li { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line) }

.mine-list .lg { font-weight: 500 }
.mine-list a.kind { color: var(--muted); text-decoration: none } .mine-list a.kind:hover { text-decoration: underline }
.mine-list .lp { font: 12px var(--mono); text-align: right; white-space: nowrap; display: grid; justify-items: end; gap: 3px; align-content: start }

@media (max-width: 640px) {
  table.stack.mine-tbl tr { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) }

@media (max-width: 440px) {
  .tab { padding: 9px 9px 11px; gap: 5px; font-size: 13px; white-space: nowrap } .tab.cup-tab { font-size: 16px } .tab.cup-tab svg { width: 14px; height: 14px }

.take-w { margin: 6px 0 0 8px; font-size: 13px; padding: 5px 14px 5px 10px }
.cb-take .take-w { margin: 0 0 8px }
.mine-tag { display: inline-block; margin-top: 4px; font: 500 10px var(--mono); letter-spacing: .04em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 1px 7px }

/* picks de inicio agrupados por partido (acordeones) */

.pgroup summary::-webkit-details-marker { display: none }

.pgroup .pg-t { font: 700 20px/1.1 var(--display); letter-spacing: .02em }

.dream-card .ds-btn { margin-top: 4px; padding: 2px 0; border: 0; background: none; color: var(--accent); font-size: 12px; font-weight: 500; font-family: inherit; text-decoration: underline; cursor: pointer }
.dream-card .ds-was { color: var(--muted) }
.dream-card li.ds-swapped { box-shadow: inset 3px 0 0 var(--accent, currentColor); padding-left: 8px }

.dream-card .ds-soft { color: var(--hot) }
.pgroup.day .pg-t { text-transform: capitalize }
.to-top { position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom)); z-index: 60; display: inline-flex; align-items: center; gap: 6px;

/* Mi combinada: botón "+" en cada pick y panel flotante (minimizado = píldora abajo a la izquierda) */
/* Tablas de picks y player props: en móvil filas compactas que se deslizan a los lados (no se apilan) */
/* que una tabla ancha nunca ensanche la página: los hijos de las rejillas pueden encogerse y la tabla se desliza dentro */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100% }
.inner > *, .section > *, .pgroup, .pg-body, .tbl-wrap { min-width: 0; max-width: 100% }
.swipe-hint { display: none }
@media (max-width: 640px) {
  .swipe-hint { display: block; position: sticky; left: 0; margin: -4px 0 6px; font: 500 10.5px var(--mono); color: var(--muted); letter-spacing: .03em }
  .tbl-wrap { -webkit-overflow-scrolling: touch; overscroll-behavior-x: contain }
  .panel.tbl-wrap:has(> table.swipe) { padding: 12px 0 12px 12px }
  table.swipe { width: max-content; min-width: 100% }
  table.swipe td { white-space: nowrap }
  table.swipe .pk { position: sticky; left: 0; z-index: 1; background: var(--surface); box-shadow: 1px 0 0 var(--line);
    white-space: normal; min-width: 128px; max-width: 46vw; text-align: left }
  table.swipe td.pk .muted { display: block }
  table.swipe td.pk .pick-h { gap: 6px }
  table.swipe td.r-sm { white-space: normal; min-width: 150px }
  table.swipe tr.link:hover td.pk { background: var(--surface) }
  table.swipe tr.detail td { white-space: normal; padding: 0 }
  table.swipe tr.detail td > * { position: sticky; left: 0; width: calc(100vw - 72px); padding: 8px }
}
.pick-h { display: flex; align-items: flex-start; gap: 10px; justify-content: space-between }
.pick-h > div { min-width: 0 }
.addc { flex: none; display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--accent); background: var(--surface);
  color: var(--accent); font: 600 17px/1 var(--body); cursor: pointer; padding: 0; transition: background .15s, color .15s }
.addc:hover { background: var(--accent-soft) }
.addc[aria-pressed="true"] { background: var(--accent); color: var(--on-accent) }
.addc:focus-visible, .combo-pill:focus-visible, .cb-x:focus-visible, .cb-min:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
// etiqueta de jugadores con poca historia NBA (rookie, un año fuera por lesión o sin datos de la temporada pasada)
const FLAG_TXT = { rookie: "Rookie", lesion: "Sin 2025-26", sin_datos: "Sin datos previos" };
const FLAG_WHY = " Sus predicciones pueden variar mucho más que las del resto.";
const ftag = f => f ? `<span class="pflag ${esc(f.t)}" title="${esc(f.note + "." + FLAG_WHY)}" role="button" tabindex="0">${FLAG_TXT[f.t] || esc(f.t)}</span><span class="pf-note" hidden>${esc(f.note + "." + FLAG_WHY)}</span>` : "";
// en el celular no hay cursor: tocar la etiqueta muestra / oculta el detalle debajo del nombre
document.addEventListener("click", e => {
  const t = e.target.closest(".pflag"); if (!t) return;
  e.stopPropagation(); e.preventDefault();
  const n = t.nextElementSibling; if (n && n.classList.contains("pf-note")) n.hidden = !n.hidden;
}, true);
const pct = (p, d = 1) => (p * 100).toFixed(d) + "%";
const dec = o => (o > 0 ? 1 + o / 100 : 1 + 100 / -o).toFixed(2);   // americana → decimal
const fairDec = p => p > 0 ? (1 / p).toFixed(2) : "—";               // cuota justa = 1 / prob
const evTxt = ev => (ev >= 0 ? "+" : "") + (ev * 100).toFixed(1) + "%";
// Colores de cada franquicia (uno vivo por equipo, para que se distingan también en modo oscuro)
const TEAM = { ATL: "#E03A3E", BOS: "#007A33", BKN: "#6E7378", CHA: "#00788C", CHI: "#CE1141", CLE: "#860038", DAL: "#00538C", DEN: "#FEC524",
  DET: "#C8102E", GSW: "#FFC72C", HOU: "#BA0C2F", IND: "#FDBB30", LAC: "#1D428A", LAL: "#552583", MEM: "#5D76A9", MIA: "#98002E", MIL: "#00471B",
  MIN: "#78BE20", NOP: "#85714D", NYK: "#F58426", OKC: "#007AC1", ORL: "#0077C0", PHI: "#006BB6", PHX: "#E56020", POR: "#E03A3E", SAC: "#5A2D81",

function chip(g, dup, when = "") {   // when: "past" (ayer) o "today"
  const r = g.result, hid = dup ? ' aria-hidden="true" tabindex="-1"' : "", hoy = when === "today" ? '<span class="hoy">Hoy</span>' : "";
  if (r) return `<a class="chip done ${when}${isCup(g) ? " cup" : ""}" href="#${g.id}" data-id="${g.id}" draggable="false" style="--ca:${tc(g.away)}"${hid}>
    <span class="t">${esc(g.away)} @ ${esc(g.home)}</span><span class="s">${r.score[g.away]}–${r.score[g.home]}</span>
    <span class="x">${hoy}Final${r.ot ? " (OT)" : ""} · ${r.winner_ok ? '<span class="ok">ganador ✓</span>' : '<span class="ko">ganador ✗</span>'}${g.n_value ? ` · picks ${r.picks_won}–${r.picks_lost}` : ""}</span></a>`;
  const fav = g.win_prob[g.away] >= g.win_prob[g.home] ? g.away : g.home;
  return `<a class="chip ${when}${isCup(g) ? " cup" : ""}" href="#${g.id}" data-id="${g.id}" draggable="false" style="--ca:${tc(g.away)}"${hid}>
    <span class="t">${esc(g.away)} @ ${esc(g.home)}</span><span class="s">${g.proj[g.away]}–${g.proj[g.home]}</span>
    <span class="x">${hoy}${isCup(g) ? '<span class="cupk">Cup · </span>' : ""}${g.tip_et ? esc(g.tip_et) + " ET · " : ""}${esc(fav)} ${pct(g.win_prob[fav], 0)}${g.n_value ? ` · <span class="v">${g.n_value} pick${g.n_value > 1 ? "s" : ""}</span>` : ""}</span></a>`;
}

// Barra: resultados de la jornada anterior + partidos de hoy. Se repite 3 veces para poder dar la
// vuelta sin saltos en ambos sentidos; se mantiene siempre dentro de la copia del medio.
const TK = { set: 0, loop: false, pauseUntil: 0, hover: false, drag: null, pos: 0, last: 0 };
const calm = matchMedia("(prefers-reduced-motion: reduce)");
function renderTicker(prev, todays) {
  const sc = $("#tscroll"), tr = $("#track");
  const group = (games, label, dup, when) => games.length ? `<span class="tk-label ${when}"${dup ? ' aria-hidden="true"' : ""}>${label}</span>${games.map(g => chip(g, dup, when)).join("")}` : "";
  const copy = dup => group(prev, prev[0] ? "Ayer · " + prev[0].date.slice(5) : "", dup, "past") + group(todays, todays.some(g => g.result) ? "Jornada" : "Hoy", dup, "today");
  tr.innerHTML = `<span class="tk-copy" style="display:contents">${copy(false)}</span>`;
  const one = tr.scrollWidth;
  TK.loop = !calm.matches && one > sc.clientWidth;
  if (TK.loop) {
    tr.innerHTML = copy(true) + `<span class="tk-mark"></span>` + copy(false) + `<span class="tk-mark"></span>` + copy(true);
    const m = tr.querySelectorAll(".tk-mark");
    TK.set = m[1].offsetLeft - m[0].offsetLeft;
    sc.scrollLeft = TK.pos = m[0].offsetLeft - tr.offsetLeft;
  }
  // arranca mostrando los partidos de hoy (en el bucle, los de la copia del medio)
  const lb = tr.querySelectorAll(".tk-label.today"), hoyLb = lb[TK.loop ? 1 : 0];
  if (hoyLb && prev.length) { sc.scrollLeft = TK.pos = Math.max(0, hoyLb.offsetLeft - tr.offsetLeft - 8); tkPause(4000); }
  $("#tk-prev").hidden = $("#tk-next").hidden = one <= sc.clientWidth;
}
function tkWrap() {   // vuelve a la copia del medio cuando el usuario no está desplazando
  const sc = $("#tscroll");
  if (!TK.loop || TK.drag) return;
  const lo = TK.set * 0.5, hi = TK.set * 1.5 + 1;   // la copia del medio empieza ~en set
  if (sc.scrollLeft < lo) sc.scrollLeft += TK.set; else if (sc.scrollLeft > hi) sc.scrollLeft -= TK.set;
  TK.pos = sc.scrollLeft;
}
const tkPause = (ms = 5000) => { TK.pauseUntil = performance.now() + ms; };
function tkFrame(t) {
  const sc = $("#tscroll"), dt = Math.min(64, t - (TK.last || t)); TK.last = t;
  if (TK.loop && !TK.hover && !TK.drag && t > TK.pauseUntil && !document.hidden) {
    if (Math.abs(sc.scrollLeft - TK.pos) > 2) TK.pos = sc.scrollLeft;   // el usuario la movió
    TK.pos += dt * 0.04;   // 40 px por segundo
    sc.scrollLeft = TK.pos;
    if (sc.scrollLeft > TK.set * 1.5) { sc.scrollLeft -= TK.set; TK.pos -= TK.set; }
  }
  requestAnimationFrame(tkFrame);
}
function setupTicker() {
  const sc = $("#tscroll");
  sc.addEventListener("mouseenter", () => TK.hover = true);
  sc.addEventListener("mouseleave", () => { TK.hover = false; tkPause(1500); });
  ["touchstart", "touchmove", "touchend", "wheel", "focusin"].forEach(e => sc.addEventListener(e, () => tkPause(), { passive: true }));
  let idle;
  sc.addEventListener("scroll", () => { clearTimeout(idle); idle = setTimeout(tkWrap, 180); }, { passive: true });
  // arrastrar con el ratón; si hubo arrastre no se abre el partido al soltar
  sc.addEventListener("pointerdown", e => { if (e.pointerType === "mouse" && e.button === 0) TK.drag = { x: e.clientX, s: sc.scrollLeft, moved: false, id: e.pointerId }; });
  sc.addEventListener("pointermove", e => {
    const d = TK.drag; if (!d) return;
    const dx = e.clientX - d.x;
    if (!d.moved && Math.abs(dx) > 5) { d.moved = true; sc.classList.add("dragging"); sc.setPointerCapture(d.id); }
    if (d.moved) sc.scrollLeft = d.s - dx;
  });
  const end = () => { const d = TK.drag; if (!d) return; TK.drag = null; sc.classList.remove("dragging"); TK.pos = sc.scrollLeft; tkPause(3000); tkWrap();
    if (d.moved) sc.addEventListener("click", ev => { ev.preventDefault(); ev.stopPropagation(); }, { capture: true, once: true }); };
  sc.addEventListener("pointerup", end); sc.addEventListener("pointercancel", end);
  const step = dir => { tkPause(6000); sc.scrollBy({ left: dir * sc.clientWidth * 0.7, behavior: calm.matches ? "auto" : "smooth" }); };
  $("#tk-prev").addEventListener("click", () => step(-1));
  $("#tk-next").addEventListener("click", () => step(1));
  requestAnimationFrame(tkFrame);
}

// Orden de las tablas de apuestas: clic en el encabezado (escritorio) o selector "Ordenar" (celular)

function bindBetSort(barId, root, draw) {

// Secciones plegables: botón en cada título de sección (h2) y de panel (h3); se recuerda en la sesión
const FOLDED = new Set(["Los 20 de mayor EV", "Picks sin cuota de casa"]);
function addFolds() {
  document.querySelectorAll("#app .section > h2, #app .panel.section > h3").forEach(h => {
    const sec = h.parentElement, key = h.textContent.replace(/\?/g, "").trim().slice(0, 60);
    if (h.querySelector(".fold-btn") || sec.classList.contains("cup-hero")) return;
    const btn = document.createElement("button");
    btn.type = "button"; btn.className = "fold-btn";
    const set = f => { sec.classList.toggle("folded", f); btn.textContent = f ? "Mostrar ▾" : "Plegar ▴"; btn.setAttribute("aria-expanded", !f); };
    set(FOLDED.has(key));

// Jornadas anteriores: un desplegable por día, solo los últimos OLD_DAYS días con partidos (para que la página no crezca)
const OLD_DAYS = 7;
const DOW = ["dom", "lun", "mar", "mié", "jue", "vie", "sáb"], MON = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];
const dayName = d => { const x = new Date(d + "T12:00:00"); return `${DOW[x.getDay()]} ${x.getDate()} ${MON[x.getMonth()]}`; };
function olderSection(older, cup) {
  const dates = [...new Set(older.map(g => g.date))].sort().reverse(), shown = dates.slice(0, OLD_DAYS);

      const w = rs.reduce((s, r) => s + r.picks_won, 0), l = rs.reduce((s, r) => s + r.picks_lost, 0), u = rs.reduce((s, r) => s + r.units, 0);

// parlays recomendados de un día ya pasado, con su resultado
function dayParlays(d, gs) {
  const ids = new Set(gs.map(g => g.id));
  const cross = ((INDEX.parlays || {})[d] || []).filter(pl => pl.legs.every(l => ids.has(l.gid))), sgp = gs.flatMap(g => g.parlays || []);
  if (!cross.length && !sgp.length) return "";
  const [cw, cl] = plRec(cross), [sw, sl] = plRec(sgp), thr = INDEX.value_ev;
  return `<h3 class="pl-day">Parlays recomendados</h3>
    <p class="pl-rec">${sgp.length ? `Mismo partido (SGP): ${sw}–${sl}` : ""}${sgp.length && cross.length ? " · " : ""}${cross.length ? `Entre partidos: ${cw}–${cl}` : ""}</p>
    <div class="pl-list">${cross.map(pl => parlayCard(pl, thr, false)).join("")}${sgp.map(pl => parlayCard(pl, thr, true)).join("")}</div>`;
}

// "Ver todo": todas las apuestas de la jornada en una sola lista por EV, con categorías y buscador
function renderAll(scope) {

  const todays = INDEX.games.filter(g => g.date === DAY && inScope(g, scope));
  const all = dayBets(todays), mps = dayModelPicks(todays);

  <section class="section">
    <span class="eyebrow">${cup ? "NBA Cup · " : ""}Jornada ${esc(DAY)}</span>
    <h1>Todos los picks</h1>
    <p class="lede">Las ${all.length} apuestas con cuota de los ${todays.length} partidos, ordenadas por valor esperado (EV), de la que más rinde según el modelo a la que menos. Filtra por categoría o busca un jugador o equipo.</p>

  addFolds();
}

// Parlays recomendados (build_site.py): mismo partido = prob. conjunta contada en las simulaciones
// (incluye la correlación); entre partidos = producto de probabilidades (partidos independientes).
const PL_N = { 2: "2 patas", 3: "3 patas", 4: "4 patas" };
function parlayCard(pl, thr, withGame) {
  const cross = pl.type === "cross", c = pl.corr;
  const corr = cross ? "Partidos distintos: la probabilidad conjunta es el producto de las de cada pata."
    : c >= 1.02 ? `Patas que se ayudan entre sí: ${pct(c - 1, 0)} más probable que si fueran independientes (${pct(pl.p_indep)}).`
    : c <= 0.98 ? `Patas que se estorban un poco: ${pct(1 - c, 0)} menos probable que si fueran independientes (${pct(pl.p_indep)}).`
    : `Patas casi independientes entre sí (${pct(pl.p_indep)} multiplicando).`;
  return `<article class="pl-card">
    <header><h3>${PL_N[pl.n] || pl.n + " patas"}</h3><span class="kind">${cross ? "Entre partidos" : "Mismo partido" + (withGame ? ` · <a href="#${pl.legs[0].gid}">${esc(pl.legs[0].game)}</a>` : "")}</span>${resPill(pl.result)}</header>
    <ol class="pl-legs">${pl.legs.map(l => `<li><div><div class="lg">${esc(l.label)}${ftag(l.flag)}</div><div class="kind">${KIND[l.kind] || l.kind}${cross ? ` · <a href="#${l.gid}">${esc(l.game)}</a>` : ""}</div></div>
      <div class="lp"><span>${pct(l.p, 0)} · @ ${l.dec.toFixed(2)}</span>${resPill(l.result)}</div></li>`).join("")}</ol>
    <div class="pl-stats">
      <div class="cell main"><span class="k">Prob. modelo</span><span class="v">${pct(pl.p)}</span></div>
      <div class="cell"><span class="k">Cuota aprox.</span><span class="v">${pl.dec.toFixed(2)}</span></div>
      <div class="cell"><span class="k">Cuota justa</span><span class="v">${pl.fair ? pl.fair.toFixed(2) : "—"}</span></div>
      <div class="cell"><span class="k">EV</span><span class="v">${evPill(pl.ev, thr)}</span></div>
    </div>
    <p class="pl-corr">${corr}</p>
    ${plAddBtn(pl)}
  </article>`;
}
const plHowto = `<details class="howto"><summary>¿Cómo se arman los parlays?</summary><dl>
  <dt>Patas</dt><dd>Solo entran player props con cuota a los dos lados, probabilidad (mezclada con la casa) de al menos 55% y EV no negativo, sin rookies ni jugadores sin temporada previa. Cada SGP de un partido usa patas distintas a las de los otros, así una pata fallada no tumba a todos. Los parlays entre partidos son de 2 patas, con picks con valor (EV ≥ +3%). No se combinan dos patas del mismo jugador.</dd>
  <dt>Elección</dt><dd>Para 2, 3 y 4 patas se elige la combinación con la mayor probabilidad de acertar todas, siempre que la cuota combinada sea de al menos 2.00 y el EV sea positivo.</dd>
  <dt>Prob. modelo</dt><dd>Mismo partido: porcentaje de las simulaciones en que aciertan todas las patas a la vez, así se tiene en cuenta que unas dependen de otras (si un equipo anota mucho suben sus jugadores y el over). Entre partidos: producto de las probabilidades. Se calcula suponiendo que juegan todos los jugadores de las props (si uno no juega, la casa anula esa pata) y no entran jugadores en duda.</dd>
  <dt>Cuota aprox.</dt><dd>Producto de las cuotas promedio de cada pata. En un parlay del mismo partido la casa suele pagar menos que esto cuando las patas van en la misma dirección: compara con la cuota que te ofrezca y con la cuota justa.</dd>
</dl></details>`;
let PL_MODE = "cross", PL_GAME = null;
function parlaySection(todays, thr) {
  const cross = crossFor(todays), withSgp = todays.filter(g => (g.parlays || []).length);
  if (!cross.length && !withSgp.length) return "";
  if (!cross.length) PL_MODE = "sgp";
  if (!withSgp.some(g => g.id === PL_GAME)) PL_GAME = withSgp[0]?.id;
  return `<section class="section" id="parlays">

// Parlay soñador (build_site.py, 9-nov): una combinada larga por jornada, cuota total entre 50 y 200, con las patas
// más probables del modelo; como mucho 2 patas por partido y solo si no se estorban. 1 unidad por jornada.
// Reemplazos (11-nov): si tu casa no ofrece una pata, "No está en mi casa" muestra hasta 3 patas muy probables que
// cumplen las reglas del soñador (build_site.dream_swaps) y recalcula cuota y probabilidad. Lo elegido se guarda en
// este navegador para la jornada; la combinada oficial (y su récord) sigue siendo la publicada.
const DREAM_RULES = { min: 50, max: 200, under: 0.5, perGame: 2, corr: 0.97 };
let DREAM_SW = {}, DREAM_SW_DAY = null, DREAM_OPEN = null;
function dreamSwLoad(d) {
  if (DREAM_SW_DAY === d) return;
  DREAM_SW_DAY = d; DREAM_OPEN = null;
  try { DREAM_SW = (JSON.parse(ls("nbap-dream-sw") || "{}") || {})[d] || {}; } catch (e) { DREAM_SW = {}; }
  dreamAuto((INDEX.dream || {})[d]);
}
function dreamSwSave() { const o = {}; Object.keys(DREAM_SW).forEach(k => { if (!DREAM_AUTO.has(+k)) o[k] = DREAM_SW[k]; }); ls("nbap-dream-sw", JSON.stringify({ [DREAM_SW_DAY]: o })); }
const dreamCur = pl => pl.legs.map((l, i) => (DREAM_SW[i] && (l.swaps || []).find(s => s.key === DREAM_SW[i])) || l);
// bajas de última hora: la pata de un jugador que es baja se cambia sola por el mejor reemplazo que cumpla las reglas
// (si no hay ninguno, la pata queda anulada, como hacen las casas, y no cuenta en la cuota ni en la probabilidad)
let DREAM_AUTO = new Set();
function dreamAuto(pl) {
  DREAM_AUTO = new Set();
  if (!pl || pl.result) return;
  pl.legs.forEach((l, i) => {
    if (!l._out || DREAM_SW[i]) return;
    const os = dreamOpts(pl, i);
    if (os.length) { DREAM_SW[i] = os[0].s.key; DREAM_AUTO.add(i); }
  });
}
// correlación entre dos patas del mismo partido (null = no se pudo comprobar)
function dreamPair(a, b, pl) {
  if (pl.legs.includes(a) && pl.legs.includes(b)) return a.corr ?? 1;
  const s = a.pc ? a : b, o = s === a ? b : a;
  return s.pc ? (s.pc[o.key] ?? null) : null;
}
// ¿cumplen las patas las reglas duras? (jugador sin repetir, máx. 2 por partido y sin estorbarse, máx. mitad Unders)
function dreamOk(legs, pl) {
  if (new Set(legs.map(l => l.player)).size < legs.length) return false;
  if (legs.filter(l => l.side === "under").length > DREAM_RULES.under * legs.length) return false;
  const by = {};
  legs.forEach(l => (by[l.gid] = by[l.gid] || []).push(l));
  return Object.values(by).every(g => g.length <= DREAM_RULES.perGame && (g.length < 2 || (dreamPair(g[0], g[1], pl) ?? 0) >= DREAM_RULES.corr));
}
function dreamTot(legs, pl) {
  const by = {};
  legs = legs.filter(l => !l._out);
  legs.forEach(l => (by[l.gid] = by[l.gid] || []).push(l));
  const p = Object.values(by).reduce((t, g) => t * (g.length === 2 ? Math.min(dreamPair(g[0], g[1], pl) * g[0].p * g[1].p, g[0].p, g[1].p) : g.reduce((x, l) => x * l.p, 1)), 1);
  const d = legs.reduce((t, l) => t * l.dec, 1);
  return { p, dec: d, fair: p ? 1 / p : null, ev: p * d - 1 };
}
// reemplazos que encajan para la pata i con lo demás ya elegido (las 3 mejores)
function dreamOpts(pl, i) {
  const cur = dreamCur(pl);
  return (pl.legs[i].swaps || []).filter(s => { const t = cur.slice(); t[i] = s; return dreamOk(t, pl); }).slice(0, 3)
    .map(s => { const t = cur.slice(); t[i] = s; return { s, tot: dreamTot(t, pl) }; });
}
const SOFT_TXT = { p: "algo menos probable que las demás", dec: "la cuota total sale de 50–200" };
function dreamLegLi(pl, i, open) {
  const o = pl.legs[i], l = dreamCur(pl)[i], sw = l !== o, live = pl.result == null && (o.swaps || []).length && !o._out;
  if (o._out && pl.result == null) return `<li class="ds-swapped bj-leg"><div><div class="lg">${esc(sw ? l.label : o.label)}${sw ? ftag(l.flag) : ""}</div><div class="kind">${KIND[l.kind] || l.kind} · <a href="#${l.gid}">${esc(l.game)}</a> · <span class="bj-w">${sw ? `en lugar de ${esc(o.player)} (baja)` : `${esc(o.player)} es baja: tu casa anula esta pata`}</span></div></div>
      <div class="lp"><span>${sw ? `${pct(l.p, 0)} · @ ${l.dec.toFixed(2)}` : "anulada"}</span></div></li>`;
  const main = `<div><div class="lg">${esc(l.label)}${ftag(l.flag)}</div><div class="kind">${KIND[l.kind] || l.kind} · <a href="#${l.gid}">${esc(l.game)}</a>${sw ? ` · <span class="ds-was">en lugar de ${esc(o.label)}</span>` : ""}</div>
      ${live ? (sw ? `<button type="button" class="ds-btn" data-dsw-undo="${i}">Deshacer cambio</button>`
        : `<button type="button" class="ds-btn" data-dsw-open="${i}" aria-expanded="${open}">${open ? "Cerrar" : "No está en mi casa: ver reemplazos"}</button>`) : ""}</div>
      <div class="lp"><span>${pct(l.p, 0)} · @ ${l.dec.toFixed(2)}</span>${resPill(l.result)}</div>`;
  let opts = "";
  if (open && !sw) {
    const os = dreamOpts(pl, i);
    opts = `<div class="ds-opts">${os.length ? `<p class="muted">Cámbiala por una de estas, que cumplen las reglas del soñador:</p>` + os.map(({ s, tot }) => `<button type="button" class="ds-opt" data-dsw-pick="${i}" data-key="${esc(s.key)}">
        <span class="lg">${esc(s.label)}${ftag(s.flag)}</span>
        <span class="kind">${esc(s.game)} · ${pct(s.p, 0)} · @ ${s.dec.toFixed(2)} · cuota total ${tot.dec.toFixed(2)}${(s.soft || []).length ? ` · <span class="ds-soft">${s.soft.map(k => SOFT_TXT[k]).join(", ")}</span>` : ""}</span>
      </button>`).join("") : `<p class="muted">No hay otra pata que encaje con las reglas del soñador sin repetir jugador ni pasar de la mitad de Unders.</p>`}</div>`;
  }
  return `<li class="${sw ? "ds-swapped" : ""}">${main}${opts}</li>`;
}
function dreamCard(pl, thr) {

    ${plAddBtn({ ...pl, legs: legs.filter(l => !l._out) })}

}

function histogram(h, away, home) {

  }).join("");
  const ticks = [-40, -20, 0, 20, 40].map(t => `<text x="${pad + ((t + 40) / 4) * bw}" y="${H - 6}" text-anchor="middle">${t > 0 ? "+" + t : t}</text>`).join("");

}

// Quinteto probable y rotación estimada (build_site.rotation_view). Los tramos de cada cuarto siguen el patrón típico

const ROLE = { titular: "Titular", rotacion: "Rotación", rol: "Rol", reserva: "Reserva (paliza)" };

  if (r.role === "titular") { const a = Math.min(m * .3, 11), b = Math.min(Math.max((m - 2 * a) / 2, 0), 12); return [cap(0, a), cap(24 - b, 24), cap(24, 24 + a), cap(48 - b, 48)]; }
  if (r.role === "rotacion") return [cap(7.5, 7.5 + m / 2), cap(31.5, 31.5 + m / 2)];
  if (r.role === "rol") return [cap(12, 12 + m / 2), cap(36, 36 + m / 2)];
  const x = Math.min(Math.max(r.mpg || 0, 2), 6); return [cap(48 - x, 48)];
}

const COMBO = { pra: ["pts", "reb", "ast"], pr: ["pts", "reb"], pa: ["pts", "ast"], ra: ["reb", "ast"] };
function h2hCell(d, p, k, line) {
  const L = d.h2h?.players?.[p.name];

  const sv = x => COMBO[k] ? COMBO[k].reduce((t, c) => t + x[c], 0) : x[k];
  if (L.some(x => sv(x) === undefined || Number.isNaN(sv(x)))) return '<span class="muted">—</span>';
  const v = L.map(sv), avg = v.reduce((s, x) => s + x, 0) / v.length, over = v.filter(x => x > line).length;
  const other = L.filter(x => x.team !== p.team).map(x => x.team);
  return `<span class="h2h-cell"><b>${avg.toFixed(1)}</b> <span class="pill ${over * 2 > v.length ? "value" : over * 2 < v.length ? "neg" : "flat"}">${over}/${v.length} over</span>

}

    <section class="panel section"><h3>Escenarios${qh("partido", "escenarios")}</h3>
      <table>${sc.map(([k, v]) => `<tr><td>${esc(k)}</td><td class="r num">${pct(v)}</td></tr>`).join("")}
      <tr><td>Total de puntos (rango 10–90%)</td><td class="r num">${s.total_pcts[10]} – ${s.total_pcts[90]}</td></tr></table></section>
  </div>
  ${rotSection(d)}
  ${mvSection(d)}
  ${cupSection(d)}
  ${h2hSection(d)}
  ${(g.notes || []).length ? `<section class="section"><h2>Contexto</h2><ul class="notes">${g.notes.map(n => `<li>${esc(n)}</li>`).join("")}</ul></section>` : ""}
  </div>
  <div class="gtab" data-gtab="jug"${GTAB === "jug" ? "" : " hidden"}>
  <section class="section">
    <h2>Player props proyectados ${qh("props", "player props")}</h2>
    <div class="filters" role="group" aria-label="Estadística">${["all", ...stats].map(k =>
      `<button type="button" id="f-${k}" data-k="${k}" aria-pressed="${k === stat}"${STAT_BTN[k] ? ` title="${STAT_LABEL[k]}"` : ""}>${k === "all" ? "Resumen" : STAT_BTN[k] || STAT_LABEL[k]}</button>`).join("")}</div>
    <div class="filters" role="group" aria-label="Equipo" id="teams"><span class="lbl">Equipo</span>${[a, h, "all"].map(t =>
      `<button type="button" data-t="${esc(t)}" aria-pressed="${t === team}">${t === "all" ? "Ambos" : esc(t)}</button>`).join("")}</div>
    <div class="filters"><span class="lbl">Ordenar</span><select class="sortsel" id="sortsel" aria-label="Ordenar por"></select>
      <button type="button" id="sortdir" aria-pressed="false">Mayor a menor</button></div>
    <div class="panel tbl-wrap" id="props"></div>
    <p class="foot">Resumen = proyección media de cada estadística en los minutos proyectados (P+R, P+A, R+A y PRA combinadas; ROB robos, TAP tapones, R+T robos + tapones, PÉR pérdidas, FAL faltas, TCA / TCI tiros de campo anotados / intentados, 2PA / 2PI dobles, 3PI triples intentados, TLA / TLI tiros libres; DD / TD probabilidad de doble-doble / triple-doble, contando puntos, rebotes, asistencias, robos y tapones); toca un encabezado (o usa "Ordenar") para ordenar la tabla. Media = promedio en las simulaciones. Rango = lo que hace en 8 de cada 10 partidos simulados. Línea justa = línea .5 más cercana a la media; P(over) = probabilidad de superarla. Si la casa publicó línea, se muestra con su cuota decimal y EV. Etiquetas: <b>Rookie</b> = novato, <b>Sin 2025-26</b> = no jugó la temporada pasada (lesión), <b>Sin datos previos</b> = el modelo no tiene su temporada pasada; con tan poca historia sus proyecciones varían mucho más (pasa el cursor o toca la etiqueta para ver el detalle).${d.h2h && d.h2h.games.length ? ` Vs rival = promedio del jugador contra este rival esta temporada y la pasada (liga y Copa), cuántas veces superó la línea (la de la casa si existe, si no la justa) y su valor en cada partido, del más reciente al más antiguo (ᶜ = partido de Copa).` : ""}</p>
  </section>
  ${woSection(d)}
  </div>`;
  // apuestas de props del partido por jugador y estadística (over y/o under, con su EV)
  const propBets = {};
  d.bets.filter(b => b.kind === "prop").forEach(b => { (propBets[b.player + "|" + b.stat] ||= []).push(b); });
  const casa = (p, k) => { const bs = propBets[p.name + "|" + k]; return bs ? bs.map(b => `${YN[k] ? (b.side === "over" ? "Sí" : "No") : `${(b.side ? b.side === "over" : b.label.includes(" Over ")) ? "O" : "U"} ${b.line}`} @ ${b.dec.toFixed(2)} ${evPill(b.ev, thr)}`).join("<br>") : "—"; };
  const bestEv = (p, k) => Math.max(...(propBets[p.name + "|" + k] || []).map(b => b.ev), -9);
  const SUMMARY = ["pts", "reb", "ast", "fg3m", "pr", "pa", "ra", "pra", "stl", "blk", "stocks", "tov", "pf", "fgm", "fga",
    "fg2m", "fg2a", "fg3a", "ftm", "fta", "dd", "td"].filter(k => stats.includes(k));
  const cellV = (s, x) => YN[s] ? pct(x.mean, 0) : x.mean.toFixed(1), actV = (s, v) => YN[s] ? (v ? "sí" : "no") : v;
  const sortOpts = () => stat === "all" ? [["min", "Minutos"], ...SUMMARY.map(k => [k, STAT_LABEL[k]])]
    : [["mean", "Media"], ["min", "Minutos"], ["p_over", "P(over)"], ["ev", "EV de la casa"], ["name", "Nombre"]];
  const val = (p, key) => key === "min" ? p.min : key === "name" ? p.name : stat === "all" ? (p[key] ? p[key].mean : -1)
    : key === "mean" ? p[stat].mean : key === "p_over" ? p[stat].p_over : key === "ev" ? bestEv(p, stat) : 0;
  const draw = (k = stat) => {
    if (k !== stat) { stat = k; sortK = k === "all" ? "min" : "mean"; sortAsc = false; }
    document.querySelectorAll("button[data-k]").forEach(b => b.setAttribute("aria-pressed", b.dataset.k === k));
    document.querySelectorAll("#teams button").forEach(b => b.setAttribute("aria-pressed", b.dataset.t === team));
    $("#sortsel").innerHTML = sortOpts().map(([v, t]) => `<option value="${v}"${v === sortK ? " selected" : ""}>${t}</option>`).join("");
    $("#sortdir").textContent = sortK === "name" ? (sortAsc ? "A → Z" : "Z → A") : sortAsc ? "Menor a mayor" : "Mayor a menor";
    const rows = players.filter(p => (team === "all" || p.team === team) && (k === "all" || p[k])).sort((x, y) => {
      const vx = val(x, sortK), vy = val(y, sortK);
      const c = typeof vx === "string" ? vx.localeCompare(vy) : vx - vy;
      return (sortAsc ? c : -c) || y.min - x.min;
    });
    const th = (key, txt, cls = "r") => `<th class="${cls} sort" data-s="${key}"${key === sortK ? ` aria-sort="${sortAsc ? "ascending" : "descending"}"` : ""}>${txt}</th>`;
    const played = players.some(p => p.actual !== undefined);
    if (k === "all") {
      $("#props").innerHTML = `${SWIPE_HINT}<table class="swipe"><thead><tr>${th("name", "Jugador", "pk")}${th("min", "Min")}${SUMMARY.map(s => th(s, STAT_SHORT[s])).join("")}</tr></thead><tbody>
      ${rows.map(p => `<tr><td class="head pk">${pn(p.name, id)}${ftag(p.flag)} <span class="muted">${esc(p.pos)} · ${esc(p.team)}${p.p_play < 0.95 ? ` · juega ${pct(p.p_play, 0)}` : ""}</span></td>
        <td class="r num" data-label="Minutos"><b>${p.min}</b></td>${SUMMARY.map(s => `<td class="r num" data-label="${STAT_LABEL[s]}">${p[s] ? cellV(s, p[s]) : "—"}${p.actual && p.actual[s] !== undefined ? ` <span class="muted">(${actV(s, p.actual[s])})</span>` : ""}</td>`).join("")}</tr>`).join("")}</tbody></table>
      ${played ? `<p class="muted">Entre paréntesis, lo que hizo en el partido real.</p>` : ""}`;
    } else {
    const hh = d.h2h && d.h2h.games.length;
    $("#props").innerHTML = `${SWIPE_HINT}<table class="swipe"><thead><tr>${th("name", "Jugador", "pk")}${th("min", "Min")}${th("mean", "Media")}<th class="r">Rango</th><th class="r">Línea justa</th>${th("p_over", "P(over)")}${th("ev", "Casa")}${hh ? `<th class="r">Vs rival</th>` : ""}${played ? '<th class="r">Real</th>' : ""}</tr></thead><tbody>
    ${rows.map(p => { const st = p[k], bs = propBets[p.name + "|" + k], ln = bs ? bs[0].line : st.line, act = p.actual ? p.actual[k] : undefined; return `<tr><td class="head pk">${pn(p.name, id, PC_ST.includes(k) ? k : null)}${ftag(p.flag)} <span class="muted">${esc(p.pos)} · ${esc(p.team)}</span></td>
      <td class="r num" data-label="Minutos">${p.min}</td><td class="r num" data-label="Media"><b>${YN[k] ? pct(st.mean, 0) : st.mean}</b></td><td class="r num" data-label="Rango">${YN[k] ? "—" : `${st.p10}–${st.p90}`}</td><td class="r num" data-label="Línea justa">${YN[k] ? "Sí / No" : st.line}</td>
      <td class="r num" data-label="P(over)">${pct(st.p_over, 0)}</td><td class="r num" data-label="Casa">${casa(p, k)}</td>${hh ? `<td class="r num" data-label="Vs rival">${h2hCell(d, p, k, ln)}</td>` : ""}${played ? `<td class="r num" data-label="Real">${!p.actual ? '<span class="muted">no jugó</span>' : act === undefined ? "—" : YN[k] ? `<b>${act ? "Sí" : "No"}</b>` : `<b>${act}</b> ${resPill(act > st.line ? "won" : "lost").replace(/Ganada|Perdida/, act > st.line ? "over" : "under")}`}</td>` : ""}</tr>`; }).join("")}</tbody></table>`;
    }
    document.querySelectorAll("#props th.sort").forEach(t => t.addEventListener("click", () => {
      const key = t.dataset.s; if (key === sortK) sortAsc = !sortAsc; else { sortK = key; sortAsc = key === "name"; } draw();
    }));
  };
  $("#sortsel").addEventListener("change", e => { sortK = e.target.value; sortAsc = sortK === "name"; draw(); });
  $("#sortdir").addEventListener("click", () => { sortAsc = !sortAsc; draw(); });
  document.querySelectorAll("button[data-k]").forEach(b => b.addEventListener("click", () => draw(b.dataset.k)));
  document.querySelectorAll("#teams button").forEach(b => b.addEventListener("click", () => { team = b.dataset.t; draw(); }));
  let betsAll = false;
  const drawBets = () => {
    const full = sortBets(d.bets.filter(b => inSeg(b, SEG)));
    const top = new Set([...full].sort((x, y) => y.ev - x.ev).slice(0, BETS_TOP));
    const list = betsAll ? full : full.filter(b => b.ev >= thr || top.has(b));
    const mp = (SEG === "all" || MP_CATS[SEG]) ? (d.model_picks || []).filter(b => inSeg(b, SEG)) : [];
    // en "Todas", los picks sin cuota van plegados para que la tabla de apuestas no quede enterrada
    $("#mp-game").innerHTML = SEG === "all" && mp.length && d.bets.length ? `<details class="hist-d mp-d"${MP_OPEN ? " open" : ""}><summary>Ver los ${mp.length} picks del modelo sin cuota de casa</summary>${mpBlock(mp, false, true)}</details>` : mpBlock(mp, false);
    $("#mp-game details")?.addEventListener("toggle", e => { MP_OPEN = e.target.open; });
    $("#bets").hidden = !list.length && !!mp.length;  // sin cuotas de este tipo pero con picks del modelo: solo la tabla de abajo
    if (!d.bets.length) { $("#bets").innerHTML = `<div class="empty">Sin cuotas cargadas para este partido.</div>`; return; }
    $("#bets").innerHTML = list.length ? `${SWIPE_HINT}<table class="swipe">${betHead(false, list.some(b => b.result), hasHr(list))}<tbody>${betRows(list, thr, false)}</tbody></table>
      ${full.length > list.length || betsAll && full.length > BETS_TOP ? `<button type="button" class="btn ghost bets-all" id="bets-all">${betsAll ? `Ver solo las de valor y las ${BETS_TOP} de mayor EV` : `Ver las ${full.length} apuestas`}</button>` : ""}`
      : `<div class="empty">Sin apuestas con cuota de este tipo para este partido.</div>`;
    $("#bets-all")?.addEventListener("click", () => { betsAll = !betsAll; drawBets(); });
    document.querySelectorAll("#bets button.more").forEach(btn => btn.addEventListener("click", () => {
      const row = $("#det-" + btn.dataset.i), open = row.hidden;
      row.hidden = !open; btn.setAttribute("aria-expanded", open);
      btn.textContent = open ? "Ocultar casas" : `Ver ${list[btn.dataset.i].books.length} casas`;
    }));
    bindBetSort("bs-game", $("#bets"), drawBets);
  };
  bindSeg("seg-game", drawBets);
  drawBets();
  draw();
  addFolds();
  woBind(d);
  aaBind(d);
  if (d.matchup_view) {
    document.querySelectorAll("#mv-teams button").forEach(b => b.addEventListener("click", () => mvDraw(d, b.dataset.t)));
    mvDraw(d, a);
  }
}

// "Sin un jugador" (d.without, de without.py): cómo cambian los compañeros si un jugador no juega.
// Modelo = misma simulación sin él (sus minutos y tiros pasan a los demás); Real = partidos de esta temporada sin él.
const WO_SUM = ["min", "pts", "reb", "ast", "fg3m", "pra"];
function woSection(d) {
  const W = d.without; if (!W) return "";
  const g = d.game;
  return `<section class="section" id="wo">
    <h2>Si no juega… ${qh("sin", "sin un jugador")}</h2>
    <p class="lede">Elige un jugador y mira cómo cambian las proyecciones de sus compañeros si no juega (baja de última hora, minutos restringidos o descanso). Útil para ver qué props suben cuando se confirma una baja.</p>
    <div class="filters" role="group" aria-label="Equipo" id="wo-teams"><span class="lbl">Equipo</span>${[g.away, g.home].map(t =>
      `<button type="button" data-t="${esc(t)}">${esc(t)}</button>`).join("")}</div>
    <div class="filters" role="group" aria-label="Jugador que no juega" id="wo-who"></div>
    <div class="filters"><span class="lbl">Ver</span><select class="sortsel" id="wo-stat" aria-label="Estadística"></select></div>
    <div id="wo-body"></div>
  </section>`;
}
function woBind(d) {
  const W = d.without; if (!W) return;
  const L0 = d.result ? [] : lateOuts(d.id);
  let t = L0.length ? L0[0].team : d.game.away, who = L0.length ? L0[0].player : null, k = "all";
  const delta = (x, y, p) => { if (x == null || y == null) return ""; const dl = y - x, s = p ? Math.round(dl * 100) : Math.round(dl * 10) / 10;
    const th = p ? 3 : 0.5; return `<span class="wo-d ${dl >= (p ? .03 : th) ? "up" : dl <= -(p ? .03 : th) ? "dn" : ""}">${s > 0 ? "+" : ""}${p ? s + "%" : s.toFixed(1)}</span>`; };
  const cell = (x, y, p) => x == null && y == null ? "—" : `<span class="wo-c">${x == null ? "—" : p ? pct(x, 0) : x.toFixed(1)} → <b>${y == null ? "—" : p ? pct(y, 0) : y.toFixed(1)}</b>${delta(x, y, p)}</span>`;
  const stats = Object.keys(STAT_LABEL).filter(s => Object.values(W[t].base).some(r => r[s]));
  $("#wo-stat").innerHTML = [["all", "Resumen"], ...stats.map(s => [s, STAT_LABEL[s]])].map(([v, x]) => `<option value="${v}">${x}</option>`).join("");
  const draw = () => {
    const T = W[t], list = [...T.absent.map(x => ({ ...x, kind: "model" })), ...T.out_today.filter(x => x.real).map(x => ({ ...x, kind: "out" }))];
    if (!list.some(x => x.name === who)) who = list.length ? list[0].name : null;
    document.querySelectorAll("#wo-teams button").forEach(b => b.setAttribute("aria-pressed", b.dataset.t === t));
    $("#wo-who").innerHTML = `<span class="lbl">Sin</span>` + list.map(x => `<button type="button" class="wo-who" data-n="${esc(x.name)}" aria-pressed="${x.name === who}">${esc(x.name)}${x.kind === "out" ? '<span class="tag">OUT hoy</span>' : isOut(d.id, x.name) && !d.result ? '<span class="tag">baja nueva</span>' : x.p_play < 1 ? `<span class="tag">duda</span>` : ""}</button>`).join("");
    document.querySelectorAll("#wo-who button").forEach(b => b.addEventListener("click", () => { who = b.dataset.n; draw(); }));
    const A = list.find(x => x.name === who);
    if (!A) { $("#wo-body").innerHTML = `<div class="empty">Sin jugadores para simular en ${esc(t)}.</div>`; return; }
    const R = A.real, M = A.model, B = T.base;
    let html = "";
    if (M) {
      const rows = Object.keys(M).filter(n => B[n]).sort((x, y) => k === "all" ? (M[y].pts?.[0] - B[y].pts?.[0]) - (M[x].pts?.[0] - B[x].pts?.[0])
        : M[x][k] && M[y][k] ? (M[y][k][1] - B[y][k][1]) - (M[x][k][1] - B[x][k][1]) : 0);
      html += `<p class="wo-note">Sin <b>${esc(A.name)}</b> (${A.min} min proyectados${A.p_play < 1 ? `, hoy juega en el ${pct(A.p_play, 0)} de las simulaciones` : ""}) sus minutos se reparten entre los que juegan y ${esc(t)} pasa de <b>${A.team_pts[0].toFixed(1)}</b> a <b>${A.team_pts[1].toFixed(1)}</b> puntos proyectados.</p>`;
      if (k === "all") html += `<div class="panel tbl-wrap"><table class="stack"><thead><tr><th>Compañero</th>${WO_SUM.map(s => `<th class="r">${s === "min" ? "Min" : STAT_SHORT[s]}</th>`).join("")}</tr></thead><tbody>
        ${rows.map(n => `<tr><td class="head">${esc(n)}</td>${WO_SUM.map(s => `<td class="r num" data-label="${s === "min" ? "Minutos" : STAT_LABEL[s]}">${s === "min" ? cell(B[n].min, M[n].min) : cell(B[n][s]?.[0], M[n][s]?.[0])}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
      else html += `<div class="panel tbl-wrap"><table class="stack"><thead><tr><th>Compañero</th><th class="r">Línea</th><th class="r">Media con → sin</th><th class="r">P(over) con → sin</th>${R ? '<th class="r">Real con → sin</th>' : ""}</tr></thead><tbody>
        ${rows.filter(n => B[n][k] && M[n][k]).map(n => { const rm = R && R.mates[n]; return `<tr><td class="head">${esc(n)}</td><td class="r num" data-label="Línea">${B[n][k][2]}</td>
          <td class="r num" data-label="Media">${cell(B[n][k][0], M[n][k][0])}</td><td class="r num" data-label="P(over)">${cell(B[n][k][1], M[n][k][1], true)}</td>
          ${R ? `<td class="r num" data-label="Real">${rm && rm.out[k] != null ? cell(rm.in?.[k], rm.out[k]) : "—"}</td>` : ""}</tr>`; }).join("")}</tbody></table></div>`;
    } else html += `<p class="wo-note"><b>${esc(A.name)}</b> está fuera hoy: el modelo ya proyecta a ${esc(t)} sin él (tabla de player props). Aquí va lo que hicieron sus compañeros en los partidos reales sin él.</p>`;
    if (R) {
      const ks = (k === "all" ? WO_SUM : ["min", k]);
      const mates = Object.entries(R.mates).sort((x, y) => (y[1].out.min || 0) - (x[1].out.min || 0));
      html += `<div class="wo-real"><h3>Partidos reales sin ${esc(A.name)}</h3>
        <p class="muted">Esta temporada ${esc(t)} jugó ${R.n_out} partido${R.n_out > 1 ? "s" : ""} sin él (${R.games_out.map(esc).join(", ")}) y ${R.n_in} con él. Promedio de cada compañero con él → sin él; con tan pocos partidos, tómalo como pista, no como regla.</p>
        <div class="panel tbl-wrap"><table class="stack"><thead><tr><th>Compañero</th><th class="r">PJ sin</th>${ks.map(s => `<th class="r">${s === "min" ? "Min" : STAT_SHORT[s]}</th>`).join("")}</tr></thead><tbody>
        ${mates.map(([n, m]) => `<tr><td class="head">${esc(n)}</td><td class="r num" data-label="PJ sin él">${m.out.n}</td>${ks.map(s => `<td class="r num" data-label="${s === "min" ? "Minutos" : STAT_LABEL[s]}">${m.out[s] == null ? "—" : cell(m.in?.[s], m.out[s])}</td>`).join("")}</tr>`).join("")}</tbody></table></div></div>`;
    } else if (M) html += `<p class="foot">Esta temporada ${esc(t)} no ha jugado ningún partido sin ${esc(A.name)}: solo hay proyección del modelo.</p>`;
    if (M) html += `<p class="foot">Modelo: la misma simulación del partido con ${esc(A.name)} fuera. Sus minutos se reparten entre los demás y sus tiros pasan a los compañeros; al ataque de ${esc(t)} se le resta una parte de lo que aporta por encima de un suplente. Línea = la de la casa si existe, si no la línea justa con él; P(over) es la probabilidad de superar esa misma línea con y sin él. El color marca los cambios de 0.5 o más (3 puntos de probabilidad).</p>`;
    $("#wo-body").innerHTML = html;
  };
  document.querySelectorAll("#wo-teams button").forEach(b => b.addEventListener("click", () => { t = b.dataset.t; who = null; draw(); }));
  document.querySelectorAll("[data-wo]").forEach(b => b.addEventListener("click", () => { t = b.dataset.wot; who = b.dataset.wo; gtShow("jug"); draw(); $("#wo").scrollIntoView({ behavior: "smooth", block: "start" }); }));
  $("#wo-stat").addEventListener("change", e => { k = e.target.value; draw(); });
  draw();
}

// Armar apuesta (pedido de Nicolas 11-nov, estilo ludoprops): las 5 mejores líneas del partido y de cada equipo,
// cada una con el porqué sacado de los datos del modelo (proyección, Últ. 10, H2H, DvP, bajas, ritmo, contexto).
// Solo entran líneas con cuota de la casa en los dos lados (prob. mezclada con la casa) y probabilidad >= 50%.
// Puntaje = EV a cuota tipo Betano + apoyo de los % de cumplimiento (Últ. 10 y H2H) y del DvP del rival.
// Cuota: desde AA_CO_FROM las props ya vienen a margen colombiano (build_site.localize_odds, modelo 1.5.1); antes
// se estima aquí con la misma fórmula (CO_OVERROUND 1.08). Las de equipo quedan con el promedio de las casas.
const AA_CO_FROM = "2026-11-12", AA_CO = 1.08, AA_US = 1.035, AA_N = 5, AA_MIN_P = 0.5;
const AA_MK = { all: "Todos", team: "Equipo", pts: "Puntos", reb: "Rebotes", ast: "Asistencias", fg3m: "Triples", combo: "Combinadas", def: "Robos y tapones" };
const AA_FAM = { pts: "p", pr: "p", pa: "p", pra: "p", reb: "r", ra: "r", ast: "a", stl: "d", blk: "d", stocks: "d" };
const AA_NO_UNDER = { rookie: 1, lesion: 1 };
let AA = { list: "game", side: "both", mk: "all" }, AA_REG = {};

  if (l.kind !== "ml") f += `<label class="n3">Línea<input id="${P}-l" type="text" inputmode="decimal" autocomplete="off" value="${l.line ?? ""}"></label>`;
  f += `<label class="n3">Cuota<input id="${P}-o" type="text" inputmode="decimal" autocomplete="off" value="${l.dec ?? ""}" placeholder="ej. 1.85"></label>`;
  const iss = l.issues.filter(x => ISSUE_TXT[x]);

    <div class="im-top"><label class="im-on"><input type="checkbox" id="${P}-on"${l.on ? " checked" : ""}><span id="${P}-h"></span></label><button type="button" class="cb-x" id="${P}-x" aria-label="Quitar esta pata">×</button></div>
    ${iss.length ? `<p class="im-iss">Revisa ${iss.map(x => ISSUE_TXT[x]).join(", ")}: no se leyó con seguridad.</p>` : ""}
    ${l.split ? `<p class="im-iss">${l.grp ? `Va dentro de un Bet Builder de cuota ${l.grp}: repartimos esa cuota por igual entre sus patas.` : "Tu boleto no trae cuota por pata: repartimos la cuota total por igual."} Si la casa te muestra la de cada pata, escríbela.</p>` : ""}
    <div class="calc">${f}</div>
    <div class="im-out" id="${P}-out" aria-live="polite"></div>
    ${l.src && l.src.length ? `<p class="im-src">Leído: «${esc(l.src.join(" · "))}»</p>` : ""}</li>`;

function bindImpLeg(i) {
  const l = IMP.legs[i], P = "im" + i, el = id => $("#" + P + "-" + id), redraw = id => drawImport(P + "-" + id);
  el("g")?.addEventListener("change", e => { l.gid = e.target.value; l.player = null; const g = cache[l.gid].game; if (![g.away, g.home].includes(l.team)) l.team = g.away; redraw("g"); });
  el("k")?.addEventListener("change", e => { l.kind = e.target.value; const g = cache[l.gid].game; if (!l.team) l.team = g.away; if (!l.side) l.side = "over"; if (l.kind !== "p") loadSims(l.gid); redraw("k"); });
  el("p")?.addEventListener("change", e => { l.player = e.target.value; l.issues = l.issues.filter(x => x !== "nombre"); redraw("p"); });
  el("s")?.addEventListener("change", e => { l.stat = e.target.value; impOut(i); });
  el("T")?.addEventListener("change", e => { l.team = e.target.value; impOut(i); });
  el("sd")?.addEventListener("change", e => { l.side = e.target.value; impOut(i); });
  el("l")?.addEventListener("input", e => { l.line = impNum(e.target.value); impOut(i); });
  el("o")?.addEventListener("input", e => { l.dec = impNum(e.target.value); l.split = false; impOut(i); });
  el("on")?.addEventListener("change", e => { l.on = e.target.checked; e.target.closest(".im-leg").classList.toggle("off", !l.on); impFoot(); });
  el("x")?.addEventListener("click", () => { IMP.legs.splice(i, 1); drawImport(); });
  impOut(i);
}
function impApply(save) {
  const v = impValid();
  if (!v.length) return;
  const ks = v.map(x => regLeg({ ...x.c.b, p: Math.round(x.c.p * 1000) / 1000, dec: x.l.dec, custom: true }, x.l.gid, x.c.game));
  const base = MYC.length && IMP.mode === "add" ? MYC.filter(l => !ks.includes(l.k)) : [];
  const add = [...new Set(ks)].slice(0, COMBO_MAX - base.length);
  MYC = [...base, ...add.map(k => ({ ...LEGREG[k], added: Date.now() }))];
  if (add.length < new Set(ks).size) comboMsg(`Máximo ${COMBO_MAX} patas: no cupieron todas.`);
  comboChanged(true);
  showImport(false);
  if (save) {
    const only = !base.length, tot = only && IMP.total > 1 ? IMP.total : null;
    if (MYC.length > 1) { if (!isMine(comboKey())) toggleComboMine(tot); }
    else if (MYC.length === 1 && !isMine(MYC[0].k)) toggleMine(MYC[0].k);
  }
}

}

// Movimiento de línea: "open" = línea y cuota de la primera publicación (análisis de la mañana). Si la línea se movió
// hacia el pick (o su cuota bajó) el mercado le dio la razón al pick: eso es ganarle a la línea de cierre.
const sideOver = b => b.side ? b.side === "over" : /^Over\b| Over /.test(b.label);
function clvSign(b, o = b.open) {
  if (!o || o[1] == null || b.dec == null) return null;
  const [ol, od] = o;
  if (ol != null && b.line != null && ol !== b.line) { const up = b.line > ol; return b.kind === "spread" ? (up ? -1 : 1) : up === sideOver(b) ? 1 : -1; }
  return Math.abs(b.dec - od) < 0.01 ? 0 : b.dec < od ? 1 : -1;
}
const mvTxt = b => {
  const s = clvSign(b); if (!s) return "";
  const [ol, od] = b.open, lm = ol != null && b.line != null && ol !== b.line, lt = l => b.kind === "spread" && l > 0 ? "+" + l : l;
  return `<span class="mv ${s > 0 ? "good" : "bad"}" title="${s > 0 ? "Desde la apertura el mercado se movió hacia este pick (buena señal: le gana a la línea de cierre)" : "Desde la apertura el mercado se movió en contra de este pick"}">${lm ? (b.line > ol ? "↑" : "↓") : (b.dec < od ? "↓" : "↑")} abrió ${lm ? lt(ol) + " @ " : "@ "}${od.toFixed(2)}</span>`;
};
const clvKey = b => [b.kind, b.player || "", b.team || "", b.stat || "", b.side || (b.kind === "total" ? (/^Over/.test(b.label) ? "o" : "u") : "")].join("|");
function mineClv(l) {   // tu pick frente a la línea de cierre (la última publicada antes del partido)
  if (l.combo || l.custom) return null;
  const g = INDEX.games.find(x => x.id === l.gid), d = cache[l.gid];
  if (!g || !gameLocked(g)) return null;
  const k = clvKey(l), b = [g.all_bets, g.value_bets, g.top_bets, d && d.bets].map(a => (a || []).find(x => clvKey(x) === k)).find(Boolean);
  return b ? clvSign(b, [l.line, l.dec_taken || l.dec]) : null;
}

// Pick del día (idea 6): el pick con valor de mayor EV de la jornada, con su historial (el de mayor EV de cada jornada)
function potd(date) {
  const vb = INDEX.games.filter(g => g.date === date && !isCup(g)).flatMap(g => (g.value_bets || []).filter(notOut(g.id)).map(b => ({ ...b, _gid: g.id, _game: `${g.away} @ ${g.home}` })));
  return vb.sort((a, b) => b.ev - a.ev)[0] || null;
}
// Tarjetas de pick (13-nov): foto, el pick en grande, cuota, gráfica de sus últimos 10 partidos contra la línea de hoy
// y sus cruces recientes contra el rival. Las gráficas se llenan después con docs/data/players/<fecha>.json

const spkTag = (b, cls) => b.kind === "prop" && b.player && PC_ST.includes(b.stat) && b.line != null
  ? `<div class="${cls}" data-spk="${esc(b.player)}" data-st="${b.stat}" data-ln="${b.line}" data-sd="${isOver(b) ? "o" : "u"}" data-dt="${esc((b._gid || CUR_GAME?.id || DAY).slice(0, 10))}"></div>` : "";
function pickCard(b, thr, big) {
  const gid = b._gid || CUR_GAME.id, game = b._game || CUR_GAME.game, k = regLeg(b, gid, game), dc = (b.dec || +dec(b.odds)).toFixed(2);

      <span class="pcd-odd"><small>Cuota</small><b class="num">${dc}</b>${mvTxt(b)}</span></div>

    <footer class="pcd-f">${takeBtn(k)}${addBtn(k)}${b.result ? resPill(b.result) : ""}<a class="pcd-go" href="#${esc(gid)}">Ver partido →</a></footer>
