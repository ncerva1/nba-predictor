const pickCards = (list, thr) => `<div class="pcards-hint">Desliza → ${list.length} picks</div><div class="pcards">${list.map(b => pickCard(b, thr)).join("")}</div>`;
// barras: una por partido, del más antiguo al más reciente; verde si ese día se habría cumplido el pick
function spkBars(xs, L, over, mini) {
  const top = Math.max(L * 1.5, ...xs.map(x => x.v), 1);
  const hit = v => over ? v > L : v < L;
  return `<div class="spk${mini ? " mini" : ""}" style="--ln:${(L / top).toFixed(3)}">${xs.map(x => `<i class="${hit(x.v) ? "hit" : ""}" style="--h:${Math.max(x.v / top, .02).toFixed(3)}" title="${esc(x.d)} ${x.home ? "vs" : "@"} ${esc(x.opp)}: ${x.v}">${mini ? "" : `<b>${x.v}</b><em>${esc(x.opp)}</em>`}</i>`).join("")}</div>`;
}
async function hydrateSparks(root) {
  const els = [...root.querySelectorAll("[data-spk]:not([data-done])")];
  for (const e of els) {
    e.dataset.done = "1";
    const F = await playersOf(e.dataset.dt), P = F && F.players[e.dataset.spk];
    const st = e.dataset.st, L = +e.dataset.ln, over = e.dataset.sd === "o", mini = e.classList.contains("spk-mini");
    if (!P) { e.remove(); continue; }
    const xs = P.g.map(r => ({ v: pcVal(F, r, st), d: r[F.ix.date], opp: r[F.ix.opp], home: r[F.ix.home], min: r[F.ix.min] }))
      .filter(x => x.v != null && x.min > 0);
    const last = xs.slice(0, 10).reverse();
    if (!last.length) { e.remove(); continue; }
    const n = last.filter(x => over ? x.v > L : x.v < L).length;
    if (mini) { e.innerHTML = spkBars(last, L, over, true); continue; }
    const h2h = xs.filter(x => x.opp === P.opp).slice(0, 5);
    const hh = h2h.filter(x => over ? x.v > L : x.v < L).length;
    e.innerHTML = `<div class="pcd-vh"><span>Últimos ${last.length}</span><b class="${n / last.length >= .6 ? "hi" : n / last.length <= .4 ? "lo" : ""}">${n} de ${last.length}</b><span class="muted">línea ${L}</span></div>
      ${spkBars(last, L, over)}
      <div class="pcd-h2h"><span>Vs ${esc(P.opp)}</span>${h2h.length ? h2h.map(x => `<span class="h2c${(over ? x.v > L : x.v < L) ? " hit" : ""}" title="${esc(x.d)}">${x.v}</span>`).join("") + `<b class="${hh / h2h.length >= .6 ? "hi" : hh / h2h.length <= .4 ? "lo" : ""}">${hh} de ${h2h.length}</b>` : `<span class="muted">sin cruces recientes</span>`}</div>`;

  document.querySelectorAll("#cb-body a").forEach(a => a.addEventListener("click", () => { if (matchMedia("(max-width: 640px)").matches) openCombo(false); }));
}
function openCombo(on) {
  const box = $("#combo");
  box.classList.toggle("open", on); $("#combo-panel").hidden = !on;
  $("#combo-pill").setAttribute("aria-expanded", on);
  if (on) { box.hidden = false; drawCombo(); $("#cb-min").focus({ preventScroll: true }); } else { if (MK_OPEN) showPickForm(false); if (IMG_OPEN) showImport(false); drawCombo(); if (!box.hidden) $("#combo-pill").focus({ preventScroll: true }); }
}
$("#combo-pill").addEventListener("click", () => openCombo(true));
$("#cb-min").addEventListener("click", () => openCombo(false));
$("#cb-mk").addEventListener("click", () => IMG_OPEN ? showImport(false) : showPickForm(!MK_OPEN));
$("#cb-clear").addEventListener("click", () => { if (!MYC.length || confirm("¿Vaciar tu combinada?")) { MYC = []; comboChanged(); openCombo(false); } });
$("#cb-stake").addEventListener("input", e => { ls("nbap-combo-stake", e.target.value); drawCombo(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("#combo").classList.contains("open") && !$("#guide").open) openCombo(false); });
addEventListener("storage", e => { if (e.key === "nbap-combo") { try { MYC = JSON.parse(e.newValue || "[]"); } catch (x) { MYC = []; } syncAddBtns(); drawCombo(); } });

// Botón flotante para volver arriba (al inicio del análisis en la página de un partido) tras bajar un poco
// aparece al bajar media pantalla (en el celular unos 400 px); también con desplazamiento táctil e inercia
const toTop = () => { $("#to-top").hidden = (scrollY || document.scrollingElement.scrollTop) < Math.min(600, innerHeight * 0.5); };
["scroll", "touchmove", "touchend", "resize"].forEach(e => addEventListener(e, toTop, { passive: true }));
$("#to-top").addEventListener("click", () => {
  scrollTo({ top: 0, behavior: calm.matches ? "auto" : "smooth" });
});

// Modo claro / oscuro: el botón alterna y guarda la elección; sin elección sigue al sistema
const darkMQ = matchMedia("(prefers-color-scheme: dark)");
const isDark = () => (document.documentElement.dataset.theme || (darkMQ.matches ? "dark" : "light")) === "dark";
function syncThemeBtn() { $("#theme-btn").setAttribute("aria-label", isDark() ? "Cambiar a modo claro" : "Cambiar a modo oscuro"); }
$("#theme-btn").addEventListener("click", () => {
  const t = isDark() ? "light" : "dark";
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem("nbap-theme", t); } catch (e) {}
  syncThemeBtn();
});
darkMQ.addEventListener?.("change", syncThemeBtn);
syncThemeBtn();

Promise.all([getJSON("data/index.json"), getJSON("data/bajas.json").catch(() => null), getJSON("data/player_ids.json").catch(() => null)]).then(([d, bj, ids]) => {
  INDEX = d; PIDS = ids || {};
  setBajas(bj); bajasIndex();
  const dates = [...new Set(d.games.map(g => g.date))].sort().reverse();
  DAY = dates[0];
  const todays = d.games.filter(g => g.date === DAY);
  const nCup = todays.filter(isCup).length;
  $("#n-reg").textContent = todays.length - nCup || ""; $("#n-cup").textContent = nCup || ""; syncMineCount();
  const gen = toDate(d.generated);
  $("#meta").innerHTML = `Jornada ${esc(DAY)} · ${todays.length} partidos · act. ${gen ? esc(hm(gen)) : ""}`;
  $("#meta").title = gen ? `Actualizado ${whenTxt(gen)}${d.last_stage ? ` · ${STAGE[d.last_stage] || ""}` : ""}` : "";
  const prevDay = dates[1], prev = prevDay ? d.games.filter(g => g.date === prevDay) : [];
  setupTicker();
  renderTicker(prev, todays);
  let rw; addEventListener("resize", () => { clearTimeout(rw); rw = setTimeout(() => { renderTicker(prev, todays); markTicker(location.hash.slice(1)); }, 250); });
  route();
  drawCombo();
  window.addEventListener("hashchange", route);
}).catch(e => { $("#app").innerHTML = `<p>No se pudo cargar <code>data/index.json</code>. Ejecuta <code>python build_site.py</code> para generarlo.</p>`; });
</script>
